<div id="topProgressBar" class="fixed top-0 left-0 w-full h-[3px] bg-blue-600 z-[999999] pointer-events-none scale-x-0 origin-left transition-all duration-400 ease-[cubic-bezier(0.4,0,0.2,1)]"></div>
<script>
    const np = document.getElementById('topProgressBar');
    np.style.transform = 'scaleX(0.3)';
    window.addEventListener('load', () => { 
        np.style.transform = 'scaleX(1)'; 
        setTimeout(() => np.style.opacity = '0', 400); 
    });
</script>

<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1499689204986172&ev=PageView&noscript=1"/></noscript>

<script>
    window.openAppModal = function(id) {
        try {
            const m = document.getElementById(id); if(!m) return;
            document.documentElement.classList.add('modal-open'); 
            m.style.display = 'flex'; m.offsetHeight; m.classList.add('active');
            if(id === 'searchModalMobile') { setTimeout(() => document.getElementById('mobileSearchInput').focus(), 100); }
        } catch(e) { console.error(e); }
    };

    window.closeAppModal = function(id) {
        try {
            const m = typeof id === 'string' ? document.getElementById(id) : id; if(!m) return;
            m.classList.remove('active');
            if (m.id === 'trackingModal') { const url = new URL(window.location); url.searchParams.delete('orderstatus'); history.pushState(null, '', url.pathname + url.search); }
            if (!document.querySelector('.modal.active')) { document.documentElement.classList.remove('modal-open'); }
            setTimeout(() => { if(!m.classList.contains('active')) m.style.display = 'none'; }, 400); 
        } catch(e) { console.error(e); }
    };

    window.globalToastTimeout = null;
    window.showToast = function(msg, actionData = null) {
        try {
            const t = document.getElementById('globalToast'); if(!t) return;
            t.innerHTML = msg;
            if (actionData) {
                t.style.cursor = 'pointer';
                t.innerHTML += ' <svg width="18" height="18" class="ml-2 opacity-90 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>';
                t.onclick = function() {
                    if(actionData === 'fav') { window.openFavorites(); } 
                    else if (actionData && actionData.type === 'link') { 
                        document.getElementById('copiedLinkText').innerText = actionData.url;
                        window.openAppModal('linkModal');
                    }
                    t.classList.remove('show');
                };
            } else {
                t.style.cursor = 'default';
                t.onclick = function() { t.classList.remove('show'); };
            }
            t.classList.add('show');
            clearTimeout(window.globalToastTimeout);
            window.globalToastTimeout = setTimeout(() => { t.classList.remove('show'); }, 4000);
        } catch(e) { console.error(e); }
    }

    window.updateBadges = function() {
        try {
            let favs = JSON.parse(localStorage.getItem('myFavs') || '[]');
            let orders = JSON.parse(localStorage.getItem('myOrders') || '[]');
            document.querySelectorAll('.fav-badge').forEach(el => { el.innerText = favs.length; el.style.display = favs.length > 0 ? 'flex' : 'none'; });
            document.querySelectorAll('.orders-badge').forEach(el => { el.innerText = orders.length; el.style.display = orders.length > 0 ? 'flex' : 'none'; });
        } catch(e) { console.error(e); }
    };

    window.openFavorites = function(e) { if(e) e.preventDefault(); renderFavorites(); window.openAppModal('favModal'); };
    window.openOrders = function(e) { if(e) e.preventDefault(); renderOrders(); window.openAppModal('ordersModal'); };

    function renderFavorites() {
        const list = document.getElementById('favList');
        let favs = JSON.parse(localStorage.getItem('myFavs') || '[]');
        const countEl = document.getElementById('favModalCount');
        if(countEl) countEl.innerText = favs.length > 0 ? `(${favs.length})` : '';
        if (favs.length === 0) { list.innerHTML = '<div class="text-center text-slate-400 py-12 font-semibold"><svg class="w-16 h-16 mx-auto mb-4 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><br>რჩეულები ცარიელია</div>'; return; }
        list.innerHTML = favs.map((f, i) => {
            let oldPHtml = (f.oldPrice && f.oldPrice !== 'null' && !f.oldPrice.includes('undefined')) ? `<span class="text-[0.8rem] text-slate-400 line-through decoration-red-500 font-bold ml-1.5">${f.oldPrice}</span>` : '';
            return `<div class="flex gap-3 bg-transparent border-b border-slate-200 py-4 px-2 relative items-center transition-all duration-200 last:border-none cursor-pointer hover:bg-slate-50" onclick="location.href='${f.link}'">
                <img class="w-16 h-16 rounded-lg object-contain bg-transparent shrink-0 border-none" src="${f.img || '/img/no-image.png'}" alt="">
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-[0.95rem] text-slate-900 leading-snug mb-1 line-clamp-2 overflow-hidden text-ellipsis">${f.name}</div>
                    <div class="font-bold text-blue-600 text-[1.1rem] flex items-center flex-wrap gap-1.5">${f.price} ${oldPHtml}</div>
                </div>
                <button class="bg-transparent text-red-500 w-9 h-9 rounded-lg flex items-center justify-center cursor-pointer transition-all duration-300 outline-none shrink-0 border-none active:scale-85 active:bg-red-100" onclick="event.stopPropagation(); removeFav(${i})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            </div>`;
        }).join('');
    }

    window.removeFav = function(index) {
        let favs = JSON.parse(localStorage.getItem('myFavs') || '[]');
        let removedLink = favs[index] ? favs[index].link : null;
        favs.splice(index, 1);
        localStorage.setItem('myFavs', JSON.stringify(favs));
        renderFavorites(); updateBadges();
        if (removedLink) {
            document.querySelectorAll('.btn-fav, .btn-fav-card').forEach(btn => {
                let link = ""; let card = btn.closest('.product-card');
                if(card) { let a = card.querySelector('a'); if(a) link = a.getAttribute('href'); } else link = window.location.pathname;
                if(link === removedLink) btn.classList.remove('active');
            });
        }
    };

    function renderOrders() {
        const list = document.getElementById('ordersList');
        let orders = JSON.parse(localStorage.getItem('myOrders') || '[]');
        const countEl = document.getElementById('ordersModalCount');
        if(countEl) countEl.innerText = orders.length > 0 ? `(${orders.length})` : '';
        if (orders.length === 0) { list.innerHTML = '<div class="text-center text-slate-400 py-12 font-semibold"><svg class="w-16 h-16 mx-auto mb-4 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg><br>შეკვეთები არ გაქვთ</div>'; return; }
        list.innerHTML = orders.map(o => {
            let d = new Date(o.date);
            let dateStr = d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
            let priceFixed = String(o.price).includes('₾') ? o.price : String(o.price).trim() + ' ₾';
            let oldPHtml = (o.oldPrice && o.oldPrice !== 'null' && !o.oldPrice.includes('undefined')) ? `<span class="text-[0.8rem] text-slate-400 line-through decoration-red-500 font-bold ml-1.5">${o.oldPrice}</span>` : '';
            return `<div class="flex flex-col gap-0 bg-transparent border-b border-slate-200 py-4 px-2 relative items-start transition-all duration-200 last:border-none">
                <div class="flex justify-between w-full pb-1 mb-1">
                    <span class="text-[0.8rem] text-slate-500 font-semibold">${dateStr}</span>
                    <span class="text-[1rem] text-blue-600 font-bold flex items-center">${priceFixed} ${oldPHtml}</span>
                </div>
                <div class="whitespace-normal leading-snug text-[0.9rem] font-bold text-slate-900">${o.product}</div>
                <div class="text-[0.8rem] text-slate-500 mt-1 font-semibold">${o.name} • ${o.phone}</div>
            </div>`;
        }).join('');
    }
    
    window.copyProductLink = function(btn) {
        if(btn) { btn.style.transform = "scale(0.9)"; setTimeout(() => btn.style.transform = "", 200); }
        let url = window.location.href;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(() => window.showToast('ბმული დაკოპირდა', {type: 'link', url: url}));
        } else {
            let textArea = document.createElement("textarea"); textArea.value = url;
            textArea.style.position = "fixed"; textArea.style.left = "-999999px";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand('copy'); window.showToast('ბმული დაკოპირდა', {type: 'link', url: url}); } catch (err) {}
            textArea.remove();
        }
    }
</script>
