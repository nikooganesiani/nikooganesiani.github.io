{% if site.data.promo_block and site.data.promo_block.size > 0 %}
<div class="relative left-1/2 -translate-x-1/2 w-screen max-w-[100vw] my-2 md:my-3 bg-transparent select-none overflow-hidden" aria-label="Promo Banners" data-promo-block>
  <!-- Full Viewport Track (В покое виден только 1 баннер без обрезков, при свайпе карточка скользит до самых краев экрана) -->
  <div
    id="promoBannerTrack"
    class="flex w-full min-w-0 overflow-x-auto overflow-y-hidden snap-x snap-mandatory [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden overscroll-x-contain [-webkit-overflow-scrolling:touch] cursor-grab active:cursor-grabbing"
  >
    {% for item in site.data.promo_block %}
      <div
        class="w-screen flex-[0_0_100vw] snap-start relative bg-transparent px-6 md:px-[calc(max(1.5rem,(100vw-1280px)/2+1.5rem))] flex justify-center promo-banner-slide"
        data-index="{{ forloop.index0 }}"
      >
        {% if item.url and item.url != "" %}
          <a
            href="{{ item.url | relative_url }}"
            class="block relative w-full max-w-[1232px] aspect-[3.2/1] md:aspect-[3.4/1] overflow-hidden rounded-2xl md:rounded-3xl focus:outline-none focus:ring-2 focus:ring-[#155dfc] focus:ring-offset-2 [transform:translateZ(0)] [-webkit-mask-image:-webkit-radial-gradient(white,black)]"
            draggable="false"
          >
            <img
              src="{{ item.image | relative_url }}"
              alt="{{ item.title | escape }}"
              class="w-full h-full object-cover object-center rounded-2xl md:rounded-3xl pointer-events-none select-none will-change-transform promo-banner-image [transform:translateZ(0)]"
              loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"
              draggable="false"
            />
          </a>
        {% else %}
          <div class="relative block w-full max-w-[1232px] aspect-[3.2/1] md:aspect-[3.4/1] overflow-hidden rounded-2xl md:rounded-3xl [transform:translateZ(0)] [-webkit-mask-image:-webkit-radial-gradient(white,black)]">
            <img
              src="{{ item.image | relative_url }}"
              alt="{{ item.title | escape }}"
              class="w-full h-full object-cover object-center rounded-2xl md:rounded-3xl pointer-events-none select-none will-change-transform promo-banner-image [transform:translateZ(0)]"
              loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"
              draggable="false"
            />
          </div>
        {% endif %}
      </div>
    {% endfor %}
  </div>

  <!-- Animated Worm Dots Container -->
  {% if site.data.promo_block.size > 1 %}
    <div class="flex items-center justify-center pt-3 md:pt-4 bg-transparent select-none">
      <div id="promoBannerDots" class="relative flex items-center justify-center gap-[7px] md:gap-2.5 bg-transparent"></div>
    </div>
  {% endif %}
</div>
{% endif %}
