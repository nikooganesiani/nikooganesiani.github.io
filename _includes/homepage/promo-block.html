{% if site.data.promo_block and site.data.promo_block.size > 0 %}
<section class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 my-6 bg-transparent" aria-label="Promo Banners">
  <div class="relative w-full overflow-hidden bg-transparent select-none" data-promo-slider>
    <!-- Slides Track -->
    <div class="flex w-full transition-transform duration-500 ease-out will-change-transform" data-promo-track>
      {% for item in site.data.promo_block %}
        <div class="min-w-full flex-shrink-0 bg-transparent" data-promo-slide data-index="{{ forloop.index0 }}">
          {% if item.url and item.url != "" %}
            <a href="{{ item.url | relative_url }}" class="block w-full overflow-hidden rounded-2xl md:rounded-3xl focus:outline-none focus:ring-2 focus:ring-[#155dfc] focus:ring-offset-2 transition-transform duration-200 active:scale-[0.99]">
              <img
                src="{{ item.image | relative_url }}"
                alt="{{ item.title | escape }}"
                class="w-full h-auto block object-cover rounded-2xl md:rounded-3xl"
                loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"
                draggable="false"
              />
            </a>
          {% else %}
            <div class="block w-full overflow-hidden rounded-2xl md:rounded-3xl">
              <img
                src="{{ item.image | relative_url }}"
                alt="{{ item.title | escape }}"
                class="w-full h-auto block object-cover rounded-2xl md:rounded-3xl"
                loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"
                draggable="false"
              />
            </div>
          {% endif %}
        </div>
      {% endfor %}
    </div>

    <!-- Pagination Dots -->
    {% if site.data.promo_block.size > 1 %}
      <div class="flex items-center justify-center gap-2 mt-4 bg-transparent" data-promo-dots>
        {% for item in site.data.promo_block %}
          <button
            type="button"
            class="w-2.5 h-2.5 md:w-3 md:h-3 rounded-full transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-[#155dfc] focus:ring-offset-2 {% if forloop.first %}bg-[#155dfc] scale-110{% else %}bg-gray-400/50 hover:bg-gray-400{% endif %}"
            data-promo-dot="{{ forloop.index0 }}"
            aria-label="Go to slide {{ forloop.index }}"
            aria-current="{% if forloop.first %}true{% else %}false{% endif %}">
          </button>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</section>
{% endif %}
