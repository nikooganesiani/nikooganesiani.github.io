{% if site.data.promo_block and site.data.promo_block.size > 0 %}
<div class="w-full relative my-3 md:my-5 bg-transparent" aria-label="Promo Banners" data-promo-block>
  <!-- Frame -->
  <div class="relative w-full overflow-hidden rounded-2xl md:rounded-3xl bg-transparent">
    <!-- Native Snap Scroll Track -->
    <div
      id="promoBannerTrack"
      class="relative flex w-full h-full min-w-0 max-w-full overflow-x-auto overflow-y-hidden snap-x snap-mandatory [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden overscroll-x-contain [-webkit-overflow-scrolling:touch]"
    >
      {% for item in site.data.promo_block %}
        <div class="flex-[0_0_100%] w-full min-w-full snap-start relative overflow-hidden bg-transparent select-none promo-banner-slide" data-index="{{ forloop.index0 }}">
          {% if item.url and item.url != "" %}
            <a
              href="{{ item.url | relative_url }}"
              class="block relative w-full aspect-[2.4/1] overflow-hidden rounded-2xl md:rounded-3xl focus:outline-none focus:ring-2 focus:ring-[#155dfc] focus:ring-offset-2"
            >
              <img
                src="{{ item.image | relative_url }}"
                alt="{{ item.title | escape }}"
                class="w-full h-full object-cover object-center pointer-events-none select-none [-webkit-user-drag:none]"
                loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"
                draggable="false"
              />
            </a>
          {% else %}
            <div class="relative block w-full aspect-[2.4/1] overflow-hidden rounded-2xl md:rounded-3xl">
              <img
                src="{{ item.image | relative_url }}"
                alt="{{ item.title | escape }}"
                class="w-full h-full object-cover object-center pointer-events-none select-none [-webkit-user-drag:none]"
                loading="{% if forloop.first %}eager{% else %}lazy{% endif %}"
                draggable="false"
              />
            </div>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </div>

  <!-- Animated Worm Dots Container -->
  {% if site.data.promo_block.size > 1 %}
    <div class="flex items-center justify-center pt-3 bg-transparent select-none">
      <div id="promoBannerDots" class="relative flex items-center justify-center bg-transparent"></div>
    </div>
  {% endif %}
</div>
{% endif %}
