<style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="mt-8 max-lg:mt-6 opacity-0 animate-[fadeUp_0.5s_ease_forwards_0.4s]" id="recentlyViewedSection" style="display: none;">
    <div class="relative inline-block z-10 mb-5">
        <h2 class="inline-flex items-center gap-0 text-[1.4rem] font-bold text-slate-900 tracking-tight">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ბოლოს ნანახი
        </h2>
    </div>
    <div class="relative w-full">
        <button class="absolute top-1/2 -translate-y-1/2 -left-5 z-10 w-11 h-11 bg-slate-50 hover:bg-slate-100 text-slate-900 hover:text-blue-600 rounded-full flex items-center justify-center transition-all active:scale-90 max-lg:hidden border-none cursor-pointer outline-none shadow-none" id="recentArrowLeft" aria-label="წინა" onclick="scrollCarousel('recentScroll', -1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <div class="flex gap-4 overflow-x-auto snap-x snap-mandatory [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden items-stretch w-full py-2 box-border max-lg:px-6 max-lg:-mx-6 max-lg:w-[calc(100%+3rem)] max-lg:gap-3 max-lg:scroll-pl-6" id="recentScroll"></div>
        <button class="absolute top-1/2 -translate-y-1/2 -right-5 z-10 w-11 h-11 bg-slate-50 hover:bg-slate-100 text-slate-900 hover:text-blue-600 rounded-full flex items-center justify-center transition-all active:scale-90 max-lg:hidden border-none cursor-pointer outline-none shadow-none" id="recentArrowRight" aria-label="შემდეგი" onclick="scrollCarousel('recentScroll', 1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
    </div>
</div>
