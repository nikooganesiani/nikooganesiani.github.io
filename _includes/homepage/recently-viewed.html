<section class="mt-8" id="recentlyViewedSection" aria-labelledby="recentTitle" hidden>
  <div class="flex items-center justify-between gap-5 mb-6 max-[768px]:mb-5">
    <h2 id="recentTitle" class="m-0 text-[color:light-dark(#26303e,var(--color-night-ink))] text-[length:22px] font-semibold tracking-[-.025em] leading-[1.4] max-[768px]:text-[length:21px]">ბოლოს ნანახი</h2>
    <div class="flex gap-2" aria-label="ბოლოს ნანახი პროდუქტების ნავიგაცია">
      <button type="button" class="carousel-arrow inline-flex" id="recentArrowLeft" aria-label="წინა პროდუქტები" aria-controls="recentScroll" disabled onclick="scrollCarousel('recentScroll', -1)">{% include icons.html name='chevron-left' size=18 %}</button>
      <button type="button" class="carousel-arrow inline-flex" id="recentArrowRight" aria-label="შემდეგი პროდუქტები" aria-controls="recentScroll" disabled onclick="scrollCarousel('recentScroll', 1)">{% include icons.html name='chevron-right' size=18 %}</button>
    </div>
  </div>
  <div class="product-carousel flex gap-6 overflow-x-auto snap-x snap-mandatory [scrollbar-width:none] pt-0.5 pb-2.5 [&::-webkit-scrollbar]:hidden max-[768px]:gap-4" id="recentScroll" tabindex="0" role="group" aria-label="ბოლოს ნანახი პროდუქტები"></div>
  <p id="recentStatus" role="status" class="text-sm text-[color:light-dark(var(--color-slate-600),var(--color-night-copy))] mt-3 empty:hidden"></p>
  <button type="button" id="recentRetry" class="mt-3 text-sm font-semibold text-[color:light-dark(var(--color-blue-700),var(--color-accent))] underline" hidden>ხელახლა ცდა</button>
</section>
