<section class="mt-8" id="recentlyViewedSection" aria-labelledby="recentTitle" hidden>
  <div class="flex items-center justify-between gap-3 mb-4">
    <h2 id="recentTitle" class="text-xl sm:text-2xl font-bold tracking-tight">ბოლოს ნანახი</h2>
    <div class="flex gap-2" aria-label="ბოლოს ნანახი პროდუქტების ნავიგაცია">
      <button type="button" class="carousel-control" id="recentArrowLeft" aria-label="წინა პროდუქტები" aria-controls="recentScroll" disabled onclick="scrollCarousel('recentScroll', -1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button type="button" class="carousel-control" id="recentArrowRight" aria-label="შემდეგი პროდუქტები" aria-controls="recentScroll" disabled onclick="scrollCarousel('recentScroll', 1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="product-carousel" id="recentScroll" tabindex="0" role="group" aria-label="ბოლოს ნანახი პროდუქტები"></div>
  <p id="recentStatus" role="status" class="text-sm text-slate-600 mt-3"></p>
  <button type="button" id="recentRetry" class="mt-3 text-sm font-semibold text-blue-700 underline" hidden>ხელახლა ცდა</button>
</section>
