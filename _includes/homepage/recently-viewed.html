<section class="mt-8" id="recentlyViewedSection" aria-labelledby="recentTitle" hidden>
  <div class="flex items-center justify-between gap-5 mb-6 max-[768px]:mb-5">
    <h2 id="recentTitle" class="m-0 text-[#26303e] text-[length:22px] font-semibold tracking-[-.025em] leading-[1.4] max-[768px]:text-[length:21px]">ბოლოს ნანახი</h2>
    <div class="flex gap-2" aria-label="ბოლოს ნანახი პროდუქტების ნავიგაცია">
      <button type="button" class="inline-flex items-center justify-center w-10 h-10 shrink-0 border border-solid border-[#e7ebf0] rounded-[50%] text-[#667383] bg-white cursor-pointer [transition:color_.15s,_border-color_.15s,_background_.15s] hover:border-[#c7cfd9] hover:text-[#253140] hover:bg-[#f8fafc] disabled:opacity-[.28] disabled:cursor-default max-[768px]:w-11 max-[768px]:h-11" id="recentArrowLeft" aria-label="წინა პროდუქტები" aria-controls="recentScroll" disabled onclick="scrollCarousel('recentScroll', -1)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0"/></svg></button>
      <button type="button" class="inline-flex items-center justify-center w-10 h-10 shrink-0 border border-solid border-[#e7ebf0] rounded-[50%] text-[#667383] bg-white cursor-pointer [transition:color_.15s,_border-color_.15s,_background_.15s] hover:border-[#c7cfd9] hover:text-[#253140] hover:bg-[#f8fafc] disabled:opacity-[.28] disabled:cursor-default max-[768px]:w-11 max-[768px]:h-11" id="recentArrowRight" aria-label="შემდეგი პროდუქტები" aria-controls="recentScroll" disabled onclick="scrollCarousel('recentScroll', 1)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M8.3 4.3a1 1 0 0 1 1.4 0l7 7a1 1 0 0 1 0 1.4l-7 7a1 1 0 1 1-1.4-1.4l6.3-6.3-6.3-6.3a1 1 0 0 1 0-1.4"/></svg></button>
    </div>
  </div>
  <div class="product-carousel flex gap-6 overflow-x-auto snap-x snap-mandatory [scrollbar-width:none] pt-0.5 pr-0 pb-2.5 pl-0 [&::-webkit-scrollbar]:hidden max-[768px]:gap-4" id="recentScroll" tabindex="0" role="group" aria-label="ბოლოს ნანახი პროდუქტები"></div>
  <p id="recentStatus" role="status" class="text-sm text-slate-600 mt-3 empty:hidden"></p>
  <button type="button" id="recentRetry" class="mt-3 text-sm font-semibold text-blue-700 underline" hidden>ხელახლა ცდა</button>
</section>
