<!-- _includes/homepage/banners.html -->
{% assign promo_items = site.data.promo_stories %}
{% if promo_items %}
<section class="w-full py-2.5 sm:py-3 select-none">
  <div
    id="promo-slider-track"
    class="flex items-center gap-2 sm:gap-2.5 lg:gap-3 overflow-x-auto overflow-y-hidden cursor-grab active:cursor-grabbing [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden py-1.5 px-3 sm:px-4 lg:px-6 w-full box-border"
  >
    {% for promo in promo_items %}
    <a
      href="{{ promo.url | relative_url }}"
      data-promo-id="{{ promo.id }}"
      class="promo-card shrink-0 flex flex-col justify-center items-center box-border
             /* Мобильный: ровно 4 карточки + 5-я выглядывает на ~45% */
             w-[calc((100vw-24px-3.5*8px)/4.45)] aspect-[1/1.35]
             /* Планшет: 5 карточек + 6-я выглядывает */
             sm:w-[calc((100vw-32px-4.5*10px)/5.4)] sm:aspect-[1/1.35]
             /* ПК: ровно 7 карточек + 8-я выглядывает */
             lg:w-[calc((100%-6*12px)/7.35)] lg:aspect-[1/1.35]
             p-[2.5px] sm:p-[3px] border-2 border-blue-700 rounded-[18px] sm:rounded-[22px] lg:rounded-[24px] 
             transition-transform duration-150 active:scale-95"
    >
      <div class="w-full h-full rounded-[13.5px] sm:rounded-[17px] lg:rounded-[19px] overflow-hidden relative bg-zinc-100">
        <img
          src="{{ promo.image | relative_url }}"
          alt="Промо"
          loading="lazy"
          decoding="async"
          draggable="false"
          class="w-full h-full object-cover object-center pointer-events-none"
          onerror="this.parentElement.classList.add('bg-gradient-to-b','from-blue-900','to-zinc-900'); this.style.display='none';"
        />
      </div>
    </a>
    {% endfor %}

    <!-- Распорка, защищающая последнюю карточку от обрезания правой границы при скролле -->
    <div class="shrink-0 w-1 sm:w-2 lg:w-3 h-1 pointer-events-none" aria-hidden="true"></div>
  </div>
</section>

<script>
  (function () {
    const track = document.getElementById('promo-slider-track');
    if (!track) return;

    const STORAGE_KEY = 'viewed_promo_stories';
    let viewedCards = [];

    try {
      viewedCards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      viewedCards = [];
    }

    const cards = track.querySelectorAll('.promo-card');

    function applyViewedStatus(card, id) {
      if (viewedCards.includes(id)) {
        card.classList.remove('border-blue-700');
        card.classList.add('border-zinc-400', 'opacity-75');
      }
    }

    cards.forEach((card) => {
      const id = card.getAttribute('data-promo-id');
      if (id) applyViewedStatus(card, id);
    });

    function markAsViewed(id, card) {
      if (id && !viewedCards.includes(id)) {
        viewedCards.push(id);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(viewedCards));
        } catch (e) {}
        applyViewedStatus(card, id);
      }
    }

    let isDown = false;
    let startX = 0;
    let scrollLeft = 0;
    let hasMoved = false;

    track.addEventListener('mousedown', (e) => {
      isDown = true;
      hasMoved = false;
      track.classList.add('cursor-grabbing');
      startX = e.pageX - track.offsetLeft;
      scrollLeft = track.scrollLeft;
    });

    window.addEventListener('mouseup', () => {
      if (!isDown) return;
      isDown = false;
      track.classList.remove('cursor-grabbing');
    });

    track.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - track.offsetLeft;
      const walk = (x - startX) * 1.4;
      if (Math.abs(walk) > 4) {
        hasMoved = true;
      }
      track.scrollLeft = scrollLeft - walk;
    });

    cards.forEach((card) => {
      card.addEventListener('click', (e) => {
        if (hasMoved) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        const id = card.getAttribute('data-promo-id');
        markAsViewed(id, card);
      });
    });
  })();
</script>
{% endif %}
