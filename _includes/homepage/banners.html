<section class="py-3.5 sm:py-4 select-none">
  <div class="max-w-7xl mx-auto px-3 sm:px-4">
    <div
      id="promo-slider-track"
      class="flex items-center gap-2.5 sm:gap-3.5 overflow-x-auto overflow-y-hidden cursor-grab active:cursor-grabbing snap-x snap-mandatory md:snap-none [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden py-1"
    >
      {% for promo in promo_items %}
        <a
          href="{{ promo.url | relative_url }}"
          data-promo-id="{{ promo.id }}"
          class="promo-card group relative shrink-0 snap-start flex flex-col items-center 
                 w-[21.5vw] min-w-[78px] max-w-[94px] h-[106px] 
                 xs:w-[86px] xs:h-[118px]
                 sm:w-[100px] sm:h-[136px]
                 md:w-[calc((100%-6*14px)/7.2)] md:max-w-[130px] md:h-[160px] 
                 lg:w-[calc((100%-6*14px)/7.3)] lg:max-w-[145px] lg:h-[180px]
                 p-[3px] rounded-[22px] sm:rounded-[26px] border-2 border-blue-700 transition-all duration-300 transform active:scale-95"
        >
          <!-- Внутренний контейнер изображения -->
          <div class="w-full h-full rounded-[17px] sm:rounded-[21px] overflow-hidden bg-zinc-900 relative">
            <img
              src="{{ promo.image | relative_url }}"
              alt="{{ promo.title | default: 'Промо' }}"
              loading="lazy"
              draggable="false"
              class="w-full h-full object-cover object-center pointer-events-none transition-transform duration-300 group-hover:scale-105"
              onerror="this.parentElement.classList.add('bg-gradient-to-b','from-blue-900','to-zinc-900'); this.style.display='none';"
            />
            
            {% if promo.title %}
              <div class="absolute inset-x-0 bottom-0 p-1.5 bg-gradient-to-t from-black/80 via-black/30 to-transparent text-center">
                <span class="text-[10px] sm:text-xs font-medium text-white line-clamp-1 leading-tight">
                  {{ promo.title }}
                </span>
              </div>
            {% endif %}
          </div>
        </a>
      {% endfor %}
    </div>
  </div>
</section>

<script>
  (function () {
    const track = document.getElementById('promo-slider-track');
    if (!track) return;

    // 1. Управление статусом "Просмотрено" через localStorage
    const STORAGE_KEY = 'viewed_promo_stories';
    let viewedCards = [];

    try {
      viewedCards = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      viewedCards = [];
    }

    const cards = track.querySelectorAll('.promo-card');

    function applyViewedStatus(card, id) {
      if (viewedCards.includes(id)) {
        card.classList.remove('border-blue-700');
        card.classList.add('border-zinc-600', 'opacity-85');
      }
    }

    cards.forEach((card) => {
      const id = card.getAttribute('data-promo-id');
      if (id) applyViewedStatus(card, id);
    });

    function markAsViewed(id, card) {
      if (id && !viewedCards.includes(id)) {
        viewedCards.push(id);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(viewedCards));
        } catch (e) {}
        applyViewedStatus(card, id);
      }
    }

    // 2. Drag-to-scroll для Desktop мыши + предотвращение перехода при свайпе
    let isDown = false;
    let startX = 0;
    let scrollLeft = 0;
    let hasMoved = false;

    track.addEventListener('mousedown', (e) => {
      isDown = true;
      hasMoved = false;
      track.classList.add('cursor-grabbing');
      startX = e.pageX - track.offsetLeft;
      scrollLeft = track.scrollLeft;
    });

    window.addEventListener('mouseup', () => {
      if (!isDown) return;
      isDown = false;
      track.classList.remove('cursor-grabbing');
    });

    track.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - track.offsetLeft;
      const walk = (x - startX) * 1.5;
      if (Math.abs(walk) > 5) {
        hasMoved = true;
      }
      track.scrollLeft = scrollLeft - walk;
    });

    // Обработка клика
    cards.forEach((card) => {
      card.addEventListener('click', (e) => {
        if (hasMoved) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        const id = card.getAttribute('data-promo-id');
        markAsViewed(id, card);
      });
    });
  })();
</script>
