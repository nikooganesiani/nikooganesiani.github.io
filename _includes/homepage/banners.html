{% assign promo_items = site.data.promo_stories %}
{% if promo_items %}
<section class="w-full py-3 select-none" aria-label="სასარგებლო ბმულები">
  <ul
    id="promo-slider-track"
    role="list"
    aria-label="ინფორმაცია და სოციალური ქსელები"
    class="flex flex-nowrap items-center gap-3 sm:gap-4 overflow-x-auto overflow-y-hidden overscroll-x-contain cursor-grab active:cursor-grabbing [&.is-dragging]:cursor-grabbing [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden [-webkit-overflow-scrolling:touch] [-webkit-touch-callout:none] py-3 px-1.5 box-border w-full"
  >
    {% for promo in promo_items %}
    {% assign promo_title = promo.title | default: promo.name | default: 'შეთავაზება' %}
    <li class="shrink-0 contents">
      <a
        href="{% if promo.url contains "://" %}{{ promo.url | escape }}{% else %}{{ promo.url | relative_url }}{% endif %}"{% if promo.url contains "://" %} target="_blank" rel="noopener noreferrer"{% endif %}
        data-promo-id="{{ promo.id }}"
        data-title="{{ promo_title | escape }}"
        aria-label="{{ promo_title | escape }}"
        draggable="false"
        class="promo-card shrink-0 relative block w-[calc((100vw-28px-3.3*10px)/4.35)] min-w-[72px] max-w-[88px] aspect-[1/1.36] sm:w-[94px] sm:max-w-none sm:aspect-[1/1.36] md:w-[110px] my-1.5 mx-1 rounded-[15px] sm:rounded-[19px] overflow-hidden outline outline-[3px] outline-blue-600 data-[viewed]:outline-zinc-500 outline-offset-[3px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-4 focus-visible:z-10"
      >
        <img
          src="{{ promo.image | relative_url }}"
          alt=""
          width="88"
          height="120"
          decoding="async"
          {% if forloop.first %}
          fetchpriority="high"
          loading="eager"
          {% elsif forloop.index <= 5 %}
          loading="eager"
          {% else %}
          loading="lazy"
          {% endif %}
          draggable="false"
          class="w-full h-full object-cover object-center pointer-events-none brightness-[1.02] contrast-[1.02]"
        />
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
