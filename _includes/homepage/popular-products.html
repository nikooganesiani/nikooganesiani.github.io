{% assign popular_list = site.data.popular_items.items | default: site.data.popular_items %}
{% if popular_list and popular_list.size > 0 %}
<div class="mt-8 max-lg:mt-6 opacity-0 animate-[fadeUp_0.5s_ease_forwards_0.4s]" id="popularSection" style="display: none;" data-popular-ids="{{ popular_list | join: ',' }}">
    <div class="relative inline-block z-10 mb-5">
        <h2 class="inline-flex items-center gap-0 text-[1.4rem] font-bold text-slate-900 tracking-tight">
            <!-- Иконка огня (Flame) для популярных товаров -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#155dfc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
            </svg>
            პოპულარული
        </h2>
    </div>
    <div class="relative w-full">
        <button class="absolute top-1/2 -translate-y-1/2 -left-5 z-10 w-11 h-11 bg-slate-50 hover:bg-slate-100 text-slate-900 hover:text-[#155dfc] rounded-full flex items-center justify-center transition-all active:scale-90 max-lg:hidden border-none cursor-pointer outline-none shadow-none" id="popularArrowLeft" aria-label="წინა" onclick="scrollCarousel('popularScroll', -1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <div class="flex gap-4 overflow-x-auto snap-x snap-mandatory [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden items-stretch w-full py-2 box-border max-lg:px-6 max-lg:-mx-6 max-lg:w-[calc(100%+3rem)] max-lg:gap-3 max-lg:scroll-pl-6" id="popularScroll"></div>
        <button class="absolute top-1/2 -translate-y-1/2 -right-5 z-10 w-11 h-11 bg-slate-50 hover:bg-slate-100 text-slate-900 hover:text-[#155dfc] rounded-full flex items-center justify-center transition-all active:scale-90 max-lg:hidden border-none cursor-pointer outline-none shadow-none" id="popularArrowRight" aria-label="შემდეგი" onclick="scrollCarousel('popularScroll', 1)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
    </div>
</div>
{% endif %}
