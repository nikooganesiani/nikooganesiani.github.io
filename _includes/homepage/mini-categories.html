<!-- _includes/categories.html -->
<section class="w-full py-4 sm:py-6" aria-labelledby="categoriesTitle">
  <h2 id="categoriesTitle" class="text-xl sm:text-2xl font-bold tracking-tight mb-4">კატეგორიები</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 sm:gap-3">
    {% for category in site.data.catalog %}
      {% assign cat_id = category[0] %}
      {% assign cat_info = category[1] %}
      <a
        href="/category/?{{ cat_id | url_encode }}"
        aria-haspopup="dialog"
        aria-controls="categoryModal"
        aria-expanded="false"
        class="category-item-btn group flex flex-row sm:flex-col items-center sm:justify-center gap-3 sm:gap-2.5 p-2.5 sm:p-4 rounded-2xl bg-white border border-slate-200/70 hover:border-[#155dfc]/40 active:bg-slate-50 transition-colors duration-150 text-left sm:text-center cursor-pointer outline-none"
        data-cat="{{ cat_id }}"
        data-name="{{ cat_info.title | escape }}"
        data-subs='{{ cat_info.subs | jsonify | escape }}'
      >
        <!-- Иконка -->
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-[#155dfc]/[0.07] text-[#155dfc] flex items-center justify-center shrink-0 group-hover:bg-[#155dfc] group-hover:text-white transition-colors duration-150 [&>svg]:w-5 [&>svg]:h-5 sm:[&>svg]:w-6 sm:[&>svg]:h-6">
          {{ cat_info.icon }}
        </div>

        <!-- Название -->
        <span class="text-xs sm:text-[13px] font-semibold text-slate-800 group-hover:text-[#155dfc] leading-tight line-clamp-2 sm:line-clamp-1 transition-colors duration-150">
          {{ cat_info.title }}
        </span>
      </a>
    {% endfor %}
  </div>
</section>

<div class="modal hidden fixed [inset:var(--modal-viewport-top,_0px)_0_auto] z-[10000] w-full h-[var(--modal-viewport-height,_100dvh)] items-center justify-center p-6 bg-[rgb(15_23_42_/_.4)] opacity-[0] [transition:opacity_180ms_ease] overscroll-contain [-webkit-tap-highlight-color:transparent] [&.active]:opacity-[1] [&.modal--gallery]:items-center [&.modal--gallery]:p-0 [&.modal--gallery]:bg-white max-[640px]:items-end max-[640px]:pt-[max(12px,_env(safe-area-inset-top))] max-[640px]:pr-[max(10px,_env(safe-area-inset-right))] max-[640px]:pb-[max(10px,_env(safe-area-inset-bottom))] max-[640px]:pl-[max(10px,_env(safe-area-inset-left))] [@media(max-height:_540px)]:min-[640px]:p-3 motion-reduce:[transition:none]" id="categoryModal" role="dialog" aria-labelledby="categoryModalTitle" aria-hidden="true">
  <div id="categoryModalBox" class="flex flex-col w-full max-w-120 max-h-full min-h-0 overflow-hidden text-[#202a37] bg-white border border-solid border-[rgb(255_255_255_/_.8)] rounded-3xl shadow-[0_24px_80px_-20px_rgb(15_23_42_/_.3),_0_4px_16px_rgb(15_23_42_/_.06)] transform-[translateY(12px)_scale(.985)] [transition:transform_220ms_cubic-bezier(.2,_.8,_.2,_1)] [.modal.active_&]:transform-none [.modal--catalog_&]:max-w-225 [.modal--search_&]:max-w-140 max-[640px]:max-w-full max-[640px]:rounded-[22px] max-[640px]:transform-[translateY(20px)] max-[640px]:[.modal--search_&]:transform-[translateY(-8px)] max-[640px]:[.modal--search.active_&]:transform-none motion-reduce:[transition:none]"><header class="flex flex-none items-start justify-between gap-4 pt-6 pr-6 pb-5 pl-6 border-b border-solid border-b-[#edf0f3] max-[640px]:pt-4.5 max-[640px]:pr-4.5 max-[640px]:pb-4 max-[640px]:pl-4.5 max-[640px]:gap-3 [@media(max-height:_540px)]:min-[640px]:py-3.5"><div class="min-w-0 pt-[7px]"><h2 id="categoryModalTitle" class="m-0 text-[length:20px] leading-[1.5] font-semibold tracking-[-.025em] [overflow-wrap:anywhere] focus:[outline:none]! [.modal-success_&]:text-[length:24px] max-[640px]:text-[length:18px] max-[640px]:[.modal-success_&]:text-[length:22px]" tabindex="-1" data-modal-initial-focus></h2><p class="mt-1.5 mr-0 mb-0 ml-0 text-[#637082] text-[length:13px] leading-[1.7] [.modal-success_&]:mt-2.5 [.modal-success_&]:mr-auto [.modal-success_&]:mb-6 [.modal-success_&]:ml-auto [.modal-success_&]:max-w-82.5">აირჩიეთ თქვენთვის სასურველი ქვეკატეგორია.</p></div>{% include modals/close-button.html %}</header><nav class="modal-body min-h-0 overflow-y-auto overscroll-y-contain p-6 [scrollbar-width:thin] [scrollbar-color:#cbd2dc_transparent] [scroll-padding-block:16px] [&_>_:first-child]:mt-0 [.modal--catalog_&]:pt-5 max-[640px]:py-5 max-[640px]:px-4.5" aria-label="ქვეკატეგორიები"><div id="categoryModalList"></div></nav></div>
</div>
