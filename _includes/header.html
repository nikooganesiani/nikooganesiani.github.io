<header class="site-header" id="site-header">
  <div class="header-utility">
    <div class="header-utility-inner">
      <p class="header-service">{% include icons.html name='truck' size=16 %}<span>უფასო მიწოდება <span class="header-service-divider" aria-hidden="true">·</span> გადახდა მიღებისას</span></p>
      <nav class="header-help" aria-label="მომხმარებლის დახმარება">
        <a href="{{ '/info/delivery' | relative_url }}"{% if page.url contains '/info/delivery' %} aria-current="page"{% endif %}>მიწოდება</a>
        <a href="{{ '/info/warranty' | relative_url }}"{% if page.url contains '/info/warranty' %} aria-current="page"{% endif %}>გარანტია</a>
        <a href="{{ '/info/contacts' | relative_url }}"{% if page.url contains '/info/contacts' %} aria-current="page"{% endif %}>კონტაქტი</a>
        <a class="header-phone" href="tel:+995551178990">{% include icons.html name='phone' size=14 %}<span>+995 551 17 89 90</span></a>
      </nav>
    </div>
  </div>
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="header-logo" aria-label="ENKA Electronics — მთავარი"{% if page.url == '/' %} aria-current="page"{% endif %}>
      <img src="{{ '/img/logohead.webp' | relative_url }}" alt="ENKA Electronics" width="180" height="38">
    </a>
    <a href="{{ '/category/' | relative_url }}" class="header-catalog" data-header-panel="navModal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>კატალოგი</span>
    </a>
    <form class="header-search" role="search" aria-label="პროდუქტის ძიება" action="{{ '/search/' | relative_url }}" method="get">
      <input type="search" name="result" id="searchInput" aria-label="პროდუქტის ძიება" placeholder="პროდუქტი, ბრენდი ან მოდელი" autocomplete="off" enterkeyhint="search" maxlength="200">
      <button type="button" id="desktopSearchClear" class="header-search-clear" aria-label="ძიების გასუფთავება">{% include icons.html name='close' size=18 %}</button>
      <button type="submit" id="desktopSearchBtn" class="header-search-submit" aria-label="ძიება">{% include icons.html name='search' size=20 %}</button>
      <div id="desktopSearchResults" class="header-search-results" role="region" aria-label="ძიების შედეგები" hidden></div>
    </form>
    <nav class="header-actions" aria-label="პირადი სივრცე">
      <button type="button" class="header-action header-action--tracking" aria-controls="trackingModal" aria-haspopup="dialog" aria-expanded="false" data-header-panel="trackingModal" aria-label="შეკვეთის სტატუსი">
        <span class="header-action-icon">{% include icons.html name='truck' size=23 %}</span>
        <span class="header-action-label">სტატუსი</span>
      </button>
      <button type="button" class="header-action header-action--saved" aria-controls="favModal" aria-haspopup="dialog" aria-expanded="false" data-header-panel="favModal" data-count-label="რჩეულები" aria-label="რჩეულები">
        <span class="header-action-icon">{% include icons.html name='heart' size=23 %}<span class="fav-badge header-badge" style="display:none" aria-hidden="true">0</span></span>
        <span class="header-action-label">რჩეულები</span>
      </button>
      <button type="button" class="header-action header-action--saved" aria-controls="ordersModal" aria-haspopup="dialog" aria-expanded="false" data-header-panel="ordersModal" data-count-label="შეკვეთები" aria-label="შეკვეთები">
        <span class="header-action-icon">{% include icons.html name='package' size=23 %}<span class="orders-badge header-badge" style="display:none" aria-hidden="true">0</span></span>
        <span class="header-action-label">შეკვეთები</span>
      </button>
      <a class="header-action header-action--phone" href="tel:+995551178990" aria-label="დაგვირეკეთ: +995 551 17 89 90">{% include icons.html name='phone' size=21 %}</a>
    </nav>
  </div>
  <noscript><style>.site-header button[data-header-panel] { display: none; }</style></noscript>
</header>
