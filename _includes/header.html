<header class="desktop-header fixed top-0 left-0 w-full z-[100] bg-white/95 backdrop-blur-xl max-sm:hidden border-b border-slate-200" aria-label="მთავარი მენიუ">
  <div class="header-inner max-w-[1280px] mx-auto px-6 flex items-center gap-6 h-[70px]">
    <a href="/" class="header-logo shrink-0" aria-label="ENKA Electronics — მთავარი"><img src="/img/logohead.webp" alt="ENKA Electronics" width="180" height="38" class="h-[38px] w-[180px] object-contain"></a>
    <button type="button" aria-haspopup="dialog" aria-controls="navModal" aria-expanded="false" class="header-catalog flex items-center gap-2 bg-blue-600 text-white px-5 rounded-xl font-bold h-12 shrink-0 hover:bg-blue-700" onclick="openAppModal('navModal')" aria-label="კატალოგი"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>კატალოგი</span></button>
    <div class="header-search relative flex flex-1 min-w-0 h-12 items-center bg-white border-2 border-blue-600 rounded-xl" role="search" aria-label="პროდუქტის ძიება">
      <input type="search" id="searchInput" aria-label="პროდუქტის ძიება" placeholder="მოძებნეთ პროდუქტი..." autocomplete="off" class="flex-1 min-w-0 border-none bg-transparent py-3 pr-10 pl-4 text-[15px] outline-none">
      <button type="button" aria-label="ძიების გასუფთავება" id="desktopSearchClear" class="absolute right-16 w-8 h-8 hidden items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 [&.show]:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      <button type="button" id="desktopSearchBtn" class="self-stretch bg-blue-600 text-white px-5 rounded-r-lg hover:bg-blue-700" aria-label="ძიება"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.75" cy="10.75" r="7.25"/><path d="m16 16 4.5 4.5"/></svg></button>
    </div>
    <div class="header-actions flex items-center gap-3 shrink-0">
      <button type="button" class="flex flex-col items-center justify-center gap-1 min-w-11 min-h-11 text-slate-600 hover:text-blue-600" aria-controls="trackingModal" aria-haspopup="dialog" aria-expanded="false" onclick="openTracking()" title="შეკვეთის სტატუსი" aria-label="შეკვეთის სტატუსი"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21 5 17V7l7-4 7 4v6M5 7l7 4 7-4M12 11v10"/><circle cx="18" cy="17" r="3"/><path d="m20 19 3 3"/></svg><span class="text-xs font-semibold">სტატუსი</span></button>
      <button type="button" class="flex flex-col items-center justify-center gap-1 min-w-11 min-h-11 text-slate-600 hover:text-blue-600" aria-controls="favModal" aria-haspopup="dialog" aria-expanded="false" onclick="openFavorites(event)" title="რჩეულები"><span class="relative"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span class="fav-badge absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold min-w-5 h-5 rounded-full px-1 border-2 border-white items-center justify-center" style="display:none" aria-hidden="true">0</span></span><span class="text-xs font-semibold">რჩეულები</span></button>
      <button type="button" class="flex flex-col items-center justify-center gap-1 min-w-11 min-h-11 text-slate-600 hover:text-blue-600" aria-controls="ordersModal" aria-haspopup="dialog" aria-expanded="false" onclick="openOrders(event)" title="ჩემი შეკვეთები"><span class="relative"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v9"/></svg><span class="orders-badge absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold min-w-5 h-5 rounded-full px-1 border-2 border-white items-center justify-center" style="display:none" aria-hidden="true">0</span></span><span class="text-xs font-semibold">შეკვეთები</span></button>
    </div>
  </div>
</header>
<div class="sm:hidden flex items-center justify-between gap-4 px-4 py-3 bg-white border-b border-slate-200">
  <a href="/" aria-label="ENKA Electronics — მთავარი"><img src="/img/logohead.webp" alt="ENKA Electronics" width="180" height="38" class="h-8 w-auto max-w-[160px] object-contain"></a>
  <button type="button" aria-label="პროდუქტის ძიება" aria-controls="searchModalMobile" aria-haspopup="dialog" aria-expanded="false" class="w-11 h-11 flex items-center justify-center rounded-xl bg-blue-50 text-blue-600" onclick="openAppModal('searchModalMobile')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.75" cy="10.75" r="7.25"/><path d="m16 16 4.5 4.5"/></svg></button>
</div>
