<li class="{% if include.kind %} breadcrumb-{{ include.kind | escape }} {% endif %}{% if include.current %} breadcrumb-current [.site-breadcrumbs_&]:shrink {% endif %}" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"{% if include.kind == 'home' %} data-breadcrumb-home{% endif %}>
  {% if include.href %}<a class="breadcrumb-link [.site-breadcrumbs_&]:inline-flex [.site-breadcrumbs_&]:items-center [.site-breadcrumbs_&]:gap-[7px] [.site-breadcrumbs_&]:min-h-9 [.site-breadcrumbs_&]:text-muted [.site-breadcrumbs_&]:text-[length:14px] [.site-breadcrumbs_&]:font-semibold [.site-breadcrumbs_&]:leading-[1.5] [.site-breadcrumbs_&]:no-underline [.site-breadcrumbs_&]:whitespace-nowrap [.site-breadcrumbs_&:is(a)]:[transition:color_.15s] [.site-breadcrumbs_&:is(a):hover]:text-accent max-[768px]:[.site-breadcrumbs_&]:text-[length:13px]" itemprop="item" href="{{ include.href | escape }}" aria-label="{{ include.label | escape }}">{% else %}<span class="breadcrumb-link [.site-breadcrumbs_&]:inline-flex [.site-breadcrumbs_&]:items-center [.site-breadcrumbs_&]:gap-[7px] [.site-breadcrumbs_&]:min-h-9 [.site-breadcrumbs_&]:text-muted [.site-breadcrumbs_&]:text-[length:14px] [.site-breadcrumbs_&]:font-semibold [.site-breadcrumbs_&]:leading-[1.5] [.site-breadcrumbs_&]:no-underline [.site-breadcrumbs_&]:whitespace-nowrap [.site-breadcrumbs_&:is(a)]:[transition:color_.15s] [.site-breadcrumbs_&:is(a):hover]:text-accent max-[768px]:[.site-breadcrumbs_&]:text-[length:13px]"{% if include.current %} aria-current="page"{% endif %}>{% endif %}
    {% if include.kind == 'home' %}{% include icons.html name='home' size=16 %}{% endif %}
    <span class="breadcrumb-icon [.site-breadcrumbs_&]:flex [.site-breadcrumbs_&]:items-center [.site-breadcrumbs_&:empty]:hidden [.site-breadcrumbs_&_svg]:w-4 [.site-breadcrumbs_&_svg]:h-4" aria-hidden="true">{% if include.icon %}{{ include.icon }}{% endif %}</span>
    <span class="breadcrumb-label [.site-breadcrumbs_.breadcrumb-current_&]:overflow-hidden [.site-breadcrumbs_.breadcrumb-current_&]:text-ellipsis max-[768px]:[.site-breadcrumbs_.breadcrumb-home_&]:hidden max-[768px]:[.site-breadcrumbs_.breadcrumb-category:has(.breadcrumb-icon_svg):not(.breadcrumb-current)_&]:hidden" itemprop="name">{{ include.label | escape }}</span>
  {% if include.href %}</a>{% else %}</span>{% endif %}
  <meta itemprop="position" content="{{ include.position | default: 2 }}">
</li>
