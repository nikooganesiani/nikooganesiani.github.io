<!-- Meta Pixel с отложенной загрузкой (обход блокировки Chrome) -->
<script>
let pixelLoaded = false;

function loadFbPixel() {
    if (pixelLoaded) return;
    pixelLoaded = true;
    
    console.log('🔄 Загружаем Meta Pixel...');
    
    // Загружаем скрипт
    var script = document.createElement('script');
    script.src = 'https://connect.facebook.net/en_US/fbevents.js';
    script.async = true;
    script.onload = function() {
        window.fbq = window.fbq || function() {
            (window.fbq.queue = window.fbq.queue || []).push(arguments);
        };
        fbq('init', '1499689204986172');  // ← ЗАМЕНИТЕ НА РЕАЛЬНЫЙ ID
        fbq('track', 'PageView');
        console.log('✅ Meta Pixel загружен!');
    };
    script.onerror = function() {
        console.warn('⚠️ Не удалось загрузить Meta Pixel');
    };
    document.head.appendChild(script);
}

// Загружаем при первом взаимодействии
document.addEventListener('click', loadFbPixel, { once: true });
document.addEventListener('scroll', loadFbPixel, { once: true });
document.addEventListener('touchstart', loadFbPixel, { once: true });

// Если пользователь ничего не делает - загружаем через 3 секунды
setTimeout(loadFbPixel, 3000);

console.log('⏳ Meta Pixel будет загружен при взаимодействии или через 3 секунды');
</script>
<!-- Конец Meta Pixel -->
