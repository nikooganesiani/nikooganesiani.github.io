<script>
    document.addEventListener('DOMContentLoaded', () => {
        try { window.updateBadges(); } catch(e){}

        try {
            const navContainer = document.getElementById('dynamicNavAccordion');
            if (navContainer && window.CATALOG_STRUCTURE) {
                const cols = [[], [], []];
                let idx = 0;
                for (const [catId, catData] of Object.entries(window.CATALOG_STRUCTURE)) {
                    let subLinks = catData.subs.map(sub => `<a href="/?category=${catId}&sub=${sub.id}" class="no-underline text-slate-600 text-[0.85rem] font-semibold py-2 px-4 rounded-full bg-slate-100 transition-all duration-300 select-none active:scale-95 hover:text-white hover:bg-blue-600" draggable="false">${sub.name}</a>`).join('');
                    let itemHtml = `
                    <div class="shrink-0 bg-transparent border-none rounded-xl overflow-hidden transition-all duration-300 [&.active]:bg-slate-50 group/item">
                        <div class="flex items-center justify-between p-4 cursor-pointer font-bold text-slate-800 text-[1.05rem] select-none transition-all duration-300 active:scale-95" onclick="this.parentElement.classList.toggle('active')">
                            <div class="flex items-center gap-3"><div class="w-10 h-10 bg-transparent rounded-full flex items-center justify-center text-slate-500 transition-colors duration-300 group-[.active]/item:text-blue-600 [&>svg]:w-5 [&>svg]:h-5">${catData.icon}</div><span>${catData.title}</span></div>
                            <svg class="w-5 h-5 text-slate-400 transition-transform duration-300 group-[.active]/item:rotate-180 group-[.active]/item:text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
                        </div>
                        <div class="hidden px-5 pb-5 group-[.active]/item:block animate-[fadeIn_0.4s_ease]"><div class="flex flex-wrap gap-2 border-t border-dashed border-slate-200 pt-4 mt-1"><a href="/?category=${catId}" class="no-underline text-slate-600 text-[0.85rem] font-semibold py-2 px-4 rounded-full bg-slate-100 transition-all duration-300 select-none active:scale-95 hover:text-white hover:bg-blue-600" draggable="false">ყველა</a>${subLinks}</div></div>
                    </div>`;
                    cols[idx % 3].push(itemHtml);
                    idx++;
                }
                navContainer.innerHTML = `<div class="max-lg:contents flex flex-col gap-6">${cols[0].join('')}</div><div class="max-lg:contents flex flex-col gap-6">${cols[1].join('')}</div><div class="max-lg:contents flex flex-col gap-6">${cols[2].join('')}</div>`;
                navContainer.className = "flex flex-col gap-3 lg:grid lg:grid-cols-3 lg:gap-6 lg:items-start flex-1 overflow-y-auto pr-1 pt-4 pb-4 -mt-4 -mb-4 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden [mask-image:linear-gradient(to_bottom,transparent,black_1rem,black_calc(100%-1rem),transparent)]";
            }
        } catch(e) { console.error(e); }

        try {
            const params = new URLSearchParams(window.location.search);
            if (params.has('orderstatus')) {
                const orderId = params.get('orderstatus');
                if (window.openTracking) window.openTracking(orderId);
                if (orderId) { setTimeout(() => { const checkBtn = document.getElementById('trackingCheckBtn'); if (checkBtn) checkBtn.click(); }, 400); }
            }
            const searchQ = params.get('search');
            if (searchQ) {
                const s = document.getElementById('searchInput');
                if (s) { s.value = searchQ; document.getElementById('desktopSearchClear')?.classList.add('show'); }
            }
        } catch(e) { console.error(e); }
    });

    window.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) window.closeAppModal(e.target);
        if (e.target.closest('.mobile-bottom-img')) window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function normalizeQuery(q) {
        const map = {'a':'ა','b':'ბ','c':'ც','d':'დ','e':'ე','f':'ფ','g':'გ','h':'ჰ','i':'ი','j':'ჯ','k':'კ','l':'ლ','m':'მ','n':'ნ','o':'ო','p':'პ','q':'ქ','r':'რ','s':'ს','t':'ტ','u':'უ','v':'ვ','w':'წ','x':'ხ','y':'ყ','z':'ზ','A':'ა','B':'ბ','C':'ჩ','D':'დ','E':'ე','F':'ფ','G':'ღ','H':'ჰ','I':'ი','J':'ჟ','K':'კ','L':'ლ','M':'მ','N':'ნ','O':'ო','P':'პ','Q':'ქ','R':'ღ','S':'შ','T':'თ','U':'უ','V':'ვ','W':'ჭ','X':'ხ','Y':'ყ','Z':'ძ', 'а':'ა','б':'ბ','в':'ვ','г':'გ','д':'დ','е':'ე','ё':'ე','ж':'ჟ','з':'ზ','и':'ი','й':'ი','к':'კ','л':'ლ','м':'მ','н':'ნ','о':'ო','п':'პ','р':'რ','с':'ს','т':'ტ','у':'უ','ф':'ფ','х':'ხ','ц':'ც','ч':'ჩ','ш':'შ','щ':'შ','ъ':'','ы':'ი','ь':'','э':'ე','ю':'იუ','я':'ია'};
        let res = '';
        for(let char of q) { res += map[char] || char; }
        return res.toLowerCase();
    }

    let _catalogCache = null;
    let _catalogPromise = null;
    function fetchCatalogCached() {
        if (_catalogCache) return Promise.resolve(_catalogCache);
        if (!_catalogPromise) {
            _catalogPromise = fetch('https://api.enkaelectronics.com.ge/catalog')
                .then(res => { if (!res.ok) throw new Error('Network error'); return res.json(); })
                .then(d => { _catalogCache = d; return d; });
        }
        return _catalogPromise;
    }

    function setupSearch(inputId, resultsId, clearId) {
        try {
            const s = document.getElementById(inputId); const r = document.getElementById(resultsId); const c = document.getElementById(clearId);
            if (!s) return;
            
            const renderResults = () => {
                let q = s.value.trim();
                if(c) { if(q.length > 0) c.classList.add('show'); else c.classList.remove('show'); }
                if (!q) { if(r) { r.innerHTML = ''; r.classList.remove('show'); if (inputId === 'mobileSearchInput') r.style.display = 'none'; else r.style.display = ''; } return; }
                
                fetchCatalogCached().then(d => {
                    if (s.value.trim() !== q) return;
                    let qLower = q.toLowerCase();
                    let normalizedQ = normalizeQuery(q);
                    let f = d.products.filter(p => p.stockStatus !== 'out_of_stock' && 
                        ((p.name || '').toLowerCase().includes(qLower) || 
                         (p.name || '').toLowerCase().includes(normalizedQ))
                    );
                    
                    if(r) {
                        if (inputId === 'mobileSearchInput') {
                            r.innerHTML = f.length ? f.map(p => {
                                let catText = ''; let mainCatId = (Array.isArray(p.categories) && p.categories.length > 0) ? p.categories[0] : (p.category || p.categories);
                                if (mainCatId && window.CATALOG_STRUCTURE && window.CATALOG_STRUCTURE[mainCatId]) catText = window.CATALOG_STRUCTURE[mainCatId].title;
                                let oldP = (p.oldPrice || p.old_price) ? `<span class="text-[0.8rem] text-slate-400 line-through decoration-red-500 font-bold ml-1.5">${String(p.oldPrice || p.old_price).replace(/₾/g, '')}₾</span>` : '';
                                return `<div class="flex gap-3 bg-transparent border-b border-slate-200 py-4 px-2 relative items-center transition-all duration-200 last:border-none cursor-pointer mb-2 hover:bg-slate-50" onclick="location.href='/product/${p.id}/'"><img class="w-16 h-16 rounded-lg object-contain bg-transparent shrink-0" src="${(p.images && p.images.length > 0) ? p.images[0] : p.image}" onerror="this.src='/img/no-image.png'"><div class="flex-1 min-w-0"><div class="font-bold text-[0.95rem] text-slate-900 leading-snug mb-0.5 line-clamp-2 overflow-hidden text-ellipsis">${p.name}</div><div class="text-[0.75rem] text-slate-400 mt-0.5 font-semibold">${catText}</div><div class="font-bold text-blue-600 text-[1.1rem] flex items-center flex-wrap gap-1.5">${String(p.price).replace(/₾/g, '')}₾ ${oldP}</div></div></div>`;
                            }).join('') : '<div class="text-center p-8 text-slate-400 font-semibold">ვერაფერი მოიძებნა</div>';
                            r.style.display = 'flex';
                        } else {
                            r.innerHTML = f.length ? f.map(p => {
                                let catText = ''; let mainCatId = (Array.isArray(p.categories) && p.categories.length > 0) ? p.categories[0] : (p.category || p.categories);
                                let subCatId = (Array.isArray(p.subcategories) && p.subcategories.length > 0) ? p.subcategories[0] : (p.subcategory || p.sub || p.subcategories);
                                if (mainCatId && window.CATALOG_STRUCTURE[mainCatId]) { catText = window.CATALOG_STRUCTURE[mainCatId].title; if (subCatId) { let sub = window.CATALOG_STRUCTURE[mainCatId].subs.find(sb => sb.id === subCatId); if (sub) catText += ` <span class="text-slate-300 mx-1">&bull;</span> ${sub.name} `; } }
                                let oldPriceValue = p.oldPrice || p.old_price; let oldPriceHtml = oldPriceValue ? `<span class="text-[0.8rem] text-slate-400 line-through font-semibold ml-2">${String(oldPriceValue).replace(/₾/g, '')}₾</span>` : '';
                                return `<div class="flex items-center gap-4 p-3 cursor-pointer rounded-2xl transition-all duration-200 hover:bg-slate-50" onclick="location.href='/product/${p.id}/'"><img src="${(p.images && p.images.length > 0) ? p.images[0] : p.image}" class="w-12 h-12 object-contain rounded-2xl bg-transparent shrink-0" onerror="this.src='/img/no-image.png'"><div class="flex-1 min-w-0"><div class="text-[0.95rem] font-bold whitespace-nowrap overflow-hidden text-ellipsis text-slate-900">${p.name}</div><div class="text-[0.75rem] text-slate-400 font-semibold mt-0.5">${catText}</div><div class="font-bold text-blue-600 mt-0.5 flex items-center"><span>${String(p.price).replace(/₾/g, '')}₾</span>${oldPriceHtml}</div></div></div>`;
                            }).join('') : '<div class="p-8 text-center text-slate-400 font-semibold">ვერაფერი მოიძებნა</div>';
                            r.style.display = '';
                            r.classList.add('show');
                        }
                    }
                }).catch(err => console.error(err));
            };

            s.addEventListener('input', renderResults);
            s.addEventListener('focus', function() {
                if(this.value.trim().length > 0 && r && r.innerHTML !== '') {
                    if (inputId === 'mobileSearchInput') {
                        r.style.display = 'flex';
                    } else {
                        r.style.display = '';
                        r.classList.add('show');
                    }
                }
            });

            if(c) { c.onclick = function(){ s.value=''; s.focus(); c.classList.remove('show'); renderResults(); }; }
            s.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); const q = this.value.trim(); if (q) window.location.href = '/?search=' + encodeURIComponent(q); } });
            
            if (inputId === 'searchInput') { 
                document.addEventListener('click', e => { 
                    if (!s.contains(e.target) && r && !r.contains(e.target) && !document.getElementById('desktopSearchBtn').contains(e.target) && (!c || !c.contains(e.target))) {
                        r.classList.remove('show'); 
                    }
                }); 
            }
        } catch(e) { console.error(e); }
    }

    try {
        (function(){
            let sr = document.createElement('div');
            sr.className = 'absolute top-[calc(100%+10px)] left-0 right-0 bg-white w-full rounded-[1.5rem] shadow-[0_10px_25px_rgba(0,0,0,0.1)] border-none z-[1000] opacity-0 invisible scale-[0.98] -translate-y-3 transition-all duration-300 max-h-[400px] overflow-y-auto p-2 [&.show]:opacity-100 [&.show]:visible [&.show]:translate-y-0 [&.show]:scale-100 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden';
            sr.id = 'desktopSearchResults';
            let desktopInput = document.getElementById('searchInput');
            if(desktopInput) document.querySelector('.group.relative.h-full').appendChild(sr);
            setupSearch('searchInput', 'desktopSearchResults', 'desktopSearchClear');
            setupSearch('mobileSearchInput', 'mobileSearchResults', 'mobileSearchClear');
            
            ['desktopSearchBtn', 'mobileSearchBtn'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) {
                    btn.addEventListener('click', () => {
                        const inputId = id === 'desktopSearchBtn' ? 'searchInput' : 'mobileSearchInput';
                        const q = document.getElementById(inputId).value.trim();
                        if (q) window.location.href = '/?search=' + encodeURIComponent(q);
                    });
                }
            });
        })();
    } catch(e){}

    const trackingOrderId = document.getElementById('trackingOrderId');
    const trackingCheckBtn = document.getElementById('trackingCheckBtn');
    const trackingResult = document.getElementById('trackingResult');
    const footerTrackingBtn = document.getElementById('footerTrackingBtn');
    const WORKER_URL_TRACKING = 'https://delivery-modal.enkaelectronics.com.ge';
    const statusMap = { 'ასაღები': 'შეკვეთა მზად არის', 'საწყობშია': 'მივიდა საწყობში', 'გატანილია ჩასაბარებლად': 'კურიერი გზაშია', 'ჩაბარებულია': 'ჩაბარებულია' };
    const statusOrder = [ 'ასაღები', 'საწყობშია', 'გატანილია ჩასაბარებლად', 'ჩაბარებულია' ];

    function parseGeorgianDate(dateStr) {
        if (!dateStr) return null;
        try { 
            const parts = String(dateStr).trim().split(' '); 
            const dateParts = parts[0].split(/[./-]/); 
            if (dateParts.length === 3) { 
                const day = parseInt(dateParts[0]), month = parseInt(dateParts[1]) - 1, year = parseInt(dateParts[2]); 
                let hours = 0, minutes = 0; 
                if (parts.length > 1 && parts[1]) { 
                    const timeParts = parts[1].split(':'); 
                    if (timeParts.length >= 2) { hours = parseInt(timeParts[0]); minutes = parseInt(timeParts[1]); } 
                } 
                const d = new Date(year, month, day, hours, minutes); 
                return isNaN(d.getTime()) ? null : d; 
            } 
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? null : d;
        } catch (e) { return null; }
    }

    function getStatusBadge(statusName) {
        const iconBox = (svg) => `<span class="inline-flex mr-2">${svg}</span>`;
        const icons = { box: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>', truck: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>', check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>', clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>' };
        const badgeMap = { 'ჩაბარებულია': { class: 'bg-green-400/15 text-green-400', icon: icons.check, text: 'ჩაბარებულია' }, 'ასაღები': { class: 'bg-blue-400/15 text-blue-400', icon: icons.clock, text: 'მზად არის' }, 'საწყობშია': { class: 'bg-blue-400/15 text-blue-400', icon: icons.box, text: 'საწყობშია' }, 'გატანილია ჩასაბარებლად': { class: 'bg-yellow-400/15 text-yellow-400', icon: icons.truck, text: 'გზაშია' } };
        const badge = badgeMap[statusName] || { class: 'bg-slate-400/15 text-slate-400', icon: icons.box, text: statusName || 'უცნობი' };
        return `<span class="inline-flex items-center px-4 py-2 rounded-full text-[0.85rem] font-bold leading-none ${badge.class}">${iconBox(badge.icon)} ${badge.text}</span>`;
    }

    window.openTracking = (id = '') => {
        const url = new URL(window.location);
        if (id) { url.searchParams.set('orderstatus', id); } else { url.searchParams.set('orderstatus', ''); }
        history.pushState(null, '', url.pathname + '?orderstatus' + (id ? '=' + id : ''));
        window.openAppModal('trackingModal'); trackingOrderId.value = id; trackingResult.style.display = 'none'; trackingResult.innerHTML = ''; if(!id) setTimeout(() => trackingOrderId.focus(), 100);
    };

    if (footerTrackingBtn) { footerTrackingBtn.addEventListener('click', (e) => { e.preventDefault(); window.openTracking(); }); }

    if (trackingCheckBtn) {
        trackingCheckBtn.addEventListener('click', async () => {
            let orderIdInput = trackingOrderId.value.trim();
            if (!orderIdInput) { alert('გთხოვთ, შეიყვანოთ შეკვეთის ნომერი.'); return; }
            const url = new URL(window.location); history.pushState(null, '', url.pathname + '?orderstatus=' + encodeURIComponent(orderIdInput));
            let apiOrderId = orderIdInput; if (!apiOrderId.toUpperCase().startsWith('TNENKAELECTRONICS')) { apiOrderId = 'TNENKAElectronics' + apiOrderId; }
            trackingResult.style.display = 'none'; trackingResult.innerHTML = ''; trackingCheckBtn.disabled = true; 
            trackingCheckBtn.innerHTML = '<div class="animate-spin rounded-full border-[3px] border-white/30 border-t-white w-6 h-6 mx-auto"></div>';

            try {
                const response = await fetch(WORKER_URL_TRACKING, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: apiOrderId }) });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                trackingResult.style.display = 'block';
                if (data.error || !data.data || !Array.isArray(data.data) || data.data.length === 0 || !data.data[0]) {
                   trackingResult.innerHTML = `<div class="flex items-center justify-center gap-2 bg-red-500/10 text-red-500 p-4 rounded-xl text-[0.9rem] font-semibold animate-[fadeIn_0.3s_ease]"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> ვერ მოიძებნა. შეამოწმეთ ნომერი.</div>`; return;
                }
                const order = data.data[0]; const currentStatus = order.statusName || 'უცნობი'; const trackingEvents = [];
                const addDate = parseGeorgianDate(order.formatted_add_date); if (addDate) trackingEvents.push({ status: 'ასაღები', created_at: addDate.toISOString() });
                const safeDate = (dateString) => { return parseGeorgianDate(dateString) || new Date(); };
                
                if (currentStatus === 'საწყობშია' || currentStatus === 'გატანილია ჩასაბარებლად' || currentStatus === 'ჩაბარებულია') { let d = safeDate(order.delivery_date); trackingEvents.push({ status: 'საწყობშია', created_at: d.toISOString() }); }
                if (currentStatus === 'გატანილია ჩასაბარებლად' || currentStatus === 'ჩაბარებულია') { let d = safeDate(order.delivery_date); trackingEvents.push({ status: 'გატანილია ჩასაბარებლად', created_at: d.toISOString() }); }
                if (currentStatus && !trackingEvents.some(ev => ev.status === currentStatus)) { let d = safeDate(order.delivery_date); trackingEvents.push({ status: currentStatus, created_at: d.toISOString() }); }

                trackingEvents.sort((a, b) => statusOrder.indexOf(a.status) - statusOrder.indexOf(b.status));
                const lastStatus = trackingEvents.length > 0 ? trackingEvents[trackingEvents.length - 1].status : null;
                const statusDateMap = {}; trackingEvents.forEach(ev => statusDateMap[ev.status] = ev.created_at);

                let timelineHtml = '';
                statusOrder.forEach((status) => {
                    const hasEvent = statusDateMap[status] !== undefined; const isPast = hasEvent && status !== lastStatus; const isCurrent = status === lastStatus;
                    let stepClass = 'future'; if (isPast) stepClass = 'past'; else if (isCurrent) stepClass = 'current';
                    let dateStr = hasEvent ? new Date(statusDateMap[status]).toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric'}) : '—';
                    timelineHtml += `<div class="flex items-stretch min-h-[50px] group/step ${stepClass}"><div class="flex flex-col items-center mr-4 w-[14px]"><div class="w-3 h-3 rounded-full border-2 border-transparent bg-slate-200 z-10 shrink-0 group-[.past]/step:bg-slate-400 group-[.current]/step:bg-blue-600"></div><div class="w-[2px] bg-slate-200 flex-grow my-1 group-last/step:hidden group-[.past]/step:bg-slate-400"></div></div><div class="pb-6 flex flex-col justify-start -mt-[3px]"><div class="text-[0.75rem] font-bold text-slate-500 mb-1 group-[.current]/step:text-blue-600">${dateStr}</div><div class="text-[0.95rem] font-semibold text-slate-800 group-[.current]/step:text-slate-900">${statusMap[status] || status}</div></div></div>`;
                });

                trackingResult.innerHTML = `<div class="bg-slate-50 p-6 rounded-2xl border border-slate-200"><p class="text-[0.85rem] font-bold text-slate-500 mb-4 text-center uppercase tracking-wider">შეკვეთა #${order.tracking_code || orderIdInput}</p><div class="text-center mb-8">${getStatusBadge(currentStatus)}</div><div class="flex flex-col w-full mt-6">${timelineHtml}</div></div>`;
            } catch (error) {
                trackingResult.style.display = 'block'; trackingResult.innerHTML = `<div class="flex items-center justify-center gap-2 bg-red-500/10 text-red-500 p-4 rounded-xl text-[0.9rem] font-semibold animate-[fadeIn_0.3s_ease]"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> სერვერის შეცდომა. (იხ. კონსოლი)</div>`;
            } finally { trackingCheckBtn.disabled = false; trackingCheckBtn.textContent = 'შემოწმება'; }
        });
        if(trackingOrderId) trackingOrderId.addEventListener('keypress', (e) => { if (e.key === 'Enter') trackingCheckBtn.click(); });
    }

    if(typeof window.WORKER_URL==='undefined'){window.WORKER_URL='https://form-handler.enkaelectronics.com.ge';}
    const quickForm = document.getElementById('quickOrderForm');
    const quickName = document.getElementById('quickName');
    const quickPhone = document.getElementById('quickPhone');

    window.openOrderForm = function(product) {
        try {
            quickName.value = ''; quickPhone.value = '';
            document.getElementById('quickFormWrapperName').classList.remove('error-border'); 
            document.getElementById('quickFormWrapperPhone').classList.remove('error-border');
            document.getElementById('orderFormModal').dataset.product = JSON.stringify(product);
            window.openAppModal('orderFormModal');
        } catch(e) { console.error(e); }
    };

    if(quickPhone) {
        quickPhone.addEventListener('input', function() {
            let val = this.value.replace(/\D/g, ''); if(val.startsWith('995')) val = val.substring(3);
            if(val.length > 9) val = val.slice(0, 9); let formatted = '';
            for(let i = 0; i < val.length; i++) { if(i === 3 || i === 5 || i === 7) formatted += ' '; formatted += val[i]; }
            this.value = formatted;
        });
    }

    if (quickForm) {
        quickForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const hp = document.getElementById('quickEmailHp');
            if (hp && hp.value) return; 

            const name = quickName.value.trim(); const phoneRaw = quickPhone.value.replace(/\s/g, '');
            const phoneWrapper = document.getElementById('quickFormWrapperPhone');
            const nameWrapper = document.getElementById('quickFormWrapperName');
            
            if(!name) { nameWrapper.classList.add('error-border'); return; }
            if(phoneRaw.length !== 9) { phoneWrapper.classList.add('error-border'); return; }
            
            const product = JSON.parse(document.getElementById('orderFormModal').dataset.product || '{}');
            const fullPhone = '+995' + phoneRaw; const submitBtn = quickForm.querySelector('button[type="submit"]');
            const originalContent = submitBtn.innerHTML; 
            submitBtn.innerHTML = '<div class="animate-spin rounded-full border-[3px] border-white/30 border-t-white w-6 h-6 mx-auto"></div>'; 
            submitBtn.disabled = true;
            
            try {
                const eventId = 'purchase_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
                const numericPrice = parseFloat(String(product.price).replace(/[^\d.]/g, '')) || 0;
                const response = await fetch(window.WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, phone: fullPhone, product: product.name, price: product.price, product_id: product.id, event_id: eventId }) });
                if (response.ok) {
                    if (typeof fbq === 'function') { fbq('track', 'Purchase', { value: numericPrice, currency: 'GEL', content_name: product.name, content_ids: product.id ? [String(product.id)] : [], content_type: 'product', num_items: 1 }, { eventID: eventId }); }
                    if (typeof window.sendCapiEvent === 'function') { window.sendCapiEvent('Purchase', { value: numericPrice, currency: 'GEL', content_name: product.name, content_ids: product.id ? [String(product.id)] : [], content_type: 'product' }, eventId); }
                    window.closeAppModal('orderFormModal'); setTimeout(() => { if(window.showOrderConfirm) window.showOrderConfirm({ name: name, phone: fullPhone, product: product.name, price: product.price, oldPrice: product.oldPrice || product.old_price }); }, 400);
                }
            } catch(error) { console.error(error); }
            submitBtn.innerHTML = originalContent; submitBtn.disabled = false;
        });
    }

    window.showOrderConfirm = function(data) {
        try {
            document.getElementById('confirmName').textContent = data.name || '-';
            document.getElementById('confirmPhone').textContent = data.phone || '-';
            document.getElementById('confirmProduct').textContent = data.product || '-';
            const rawConfirmPrice = String(data.price).replace(/₾/g, '').trim();
            document.getElementById('confirmPrice').textContent = rawConfirmPrice ? `${rawConfirmPrice} ₾` : '-';
            
            let oldPrice = (data.oldPrice && data.oldPrice !== 'null' && data.oldPrice !== 'undefined') ? String(data.oldPrice).replace(/₾/g, '').trim() + ' ₾' : null;
            
            let orders = JSON.parse(localStorage.getItem('myOrders') || '[]');
            orders.unshift({ name: data.name, phone: data.phone, product: data.product, price: rawConfirmPrice + ' ₾', oldPrice: oldPrice, date: new Date().toISOString() });
            localStorage.setItem('myOrders', JSON.stringify(orders));
            window.updateBadges();

            window.openAppModal('orderConfirmModal');
        } catch(e) { console.error(e); }
    };

    function formatPhoneInput(input) {
        let value = input.value.replace(/\s/g, ''); if (value.startsWith('+995')) value = value.substring(4);
        value = value.replace(/\D/g, ''); if (value.length > 9) value = value.slice(0, 9);
        let formatted = ''; for (let i = 0; i < value.length; i++) { if (i === 3 || i === 5 || i === 7) formatted += ' '; formatted += value[i]; }
        input.value = formatted;
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.order-form').forEach(form => {
            const nameInput = form.querySelector('input[placeholder*="სახელი"], input[name="name"]');
            const phoneInput = form.querySelector('input[type="tel"], input[name="phone"]');
            if (nameInput && phoneInput) {
                if (!nameInput.id) nameInput.id = 'n' + Math.random().toString(36).substr(2, 5);
                if (!phoneInput.id) phoneInput.id = 'p' + Math.random().toString(36).substr(2, 5);
                phoneInput.addEventListener('input', function() { formatPhoneInput(this); });
            }
        });
    });

    window.toggleFav = function(event, btn) {
        if(event) { event.preventDefault(); event.stopPropagation(); }
        try {
            let name = "პროდუქტი", price = "0 ₾", oldPrice = null, img = "", link = window.location.pathname;
            const card = btn.closest('.product-card');
            
            if (card) {
                let nameEl = card.querySelector('.product-name'); if(nameEl) name = nameEl.innerText;
                let priceEl = card.querySelector('.product-price'); if(priceEl) price = priceEl.innerText.replace(/₾/g, '').trim() + ' ₾';
                let oldPriceEl = card.querySelector('.old-price, .modern-price-old'); if(oldPriceEl) oldPrice = oldPriceEl.innerText.replace(/₾/g, '').trim() + ' ₾';
                let imgEl = card.querySelector('.product-image'); if(imgEl) img = imgEl.src;
                let aEl = card.querySelector('a'); if(aEl) link = aEl.getAttribute('href');
            } else {
                let titleEl = document.querySelector('.title-desktop') || document.querySelector('.title-mobile') || document.querySelector('h1.product-title-h1');
                if (titleEl) name = titleEl.innerText;
                let priceEl = document.querySelector('.modern-price-current'); if(priceEl) price = priceEl.innerText.replace(/₾/g, '').trim() + ' ₾';
                
                let oldPriceEl = priceEl ? priceEl.parentNode.querySelector('.modern-price-old, .old-price') : null; 
                if(oldPriceEl) oldPrice = oldPriceEl.innerText.replace(/₾/g, '').trim() + ' ₾';
                
                let imgEl = document.querySelector('.main-gallery-slide img, .product-main-img'); if(imgEl) img = imgEl.src;
            }

            let favs = JSON.parse(localStorage.getItem('myFavs') || '[]');
            let existingIdx = favs.findIndex(f => f.link === link);

            if (existingIdx > -1) {
                favs.splice(existingIdx, 1);
                btn.classList.remove('active');
                window.showToast('წაშლილია რჩეულებიდან');
            } else {
                favs.unshift({ name, price, oldPrice, img, link });
                btn.classList.add('active');
                window.showToast('დამატებულია რჩეულებში', 'fav');
            }

            localStorage.setItem('myFavs', JSON.stringify(favs));
            window.updateBadges();

            document.querySelectorAll('.btn-fav, .btn-fav-card').forEach(otherBtn => {
                let otherLink = ""; let otherCard = otherBtn.closest('.product-card');
                if(otherCard) { let a = otherCard.querySelector('a'); if(a) otherLink = a.getAttribute('href'); } else otherLink = window.location.pathname;
                if(otherLink === link) { if(existingIdx > -1) otherBtn.classList.remove('active'); else otherBtn.classList.add('active'); }
            });
        } catch(e) { console.error(e); }
    };

    const favObserver = new MutationObserver((mutations) => {
        let favs = JSON.parse(localStorage.getItem('myFavs') || '[]');
        let changed = false; mutations.forEach(m => { if (m.addedNodes.length) changed = true; });
        if (changed) {
            document.querySelectorAll('.btn-fav, .btn-fav-card').forEach(btn => {
                if(btn.dataset.favInit) return;
                let link = ""; let card = btn.closest('.product-card');
                if(card) { let a = card.querySelector('a'); if(a) link = a.getAttribute('href'); } else link = window.location.pathname;
                if (link && favs.some(f => f.link === link)) btn.classList.add('active');
                btn.dataset.favInit = "true";
            });
        }
    });
    favObserver.observe(document.body, { childList: true, subtree: true });

    window.addEventListener('load', () => {
        let favs = JSON.parse(localStorage.getItem('myFavs') || '[]');
        document.querySelectorAll('.btn-fav, .btn-fav-card').forEach(btn => {
            let link = ""; let card = btn.closest('.product-card');
            if(card) { let a = card.querySelector('a'); if(a) link = a.getAttribute('href'); } else link = window.location.pathname;
            if (link && favs.some(f => f.link === link)) btn.classList.add('active');
            btn.dataset.favInit = "true";
        });
    });

    let _tsX = 0, _tsY = 0;
    document.addEventListener('touchstart', function(e) { _tsX = e.changedTouches[0].screenX; _tsY = e.changedTouches[0].screenY; }, {passive: true});
    window.addEventListener('contextmenu', function(e) { if (e.target.closest('button, a, .product-card, .category-btn, .sub-category-btn, .thumb-card, .similar-card')) { e.preventDefault(); } });
    document.addEventListener('touchend', function(e) {
        setTimeout(function() { if (document.activeElement && document.activeElement !== document.body) { const tag = document.activeElement.tagName; if (tag === 'BUTTON' || tag === 'A' || document.activeElement.closest('.product-card, .similar-card, .thumb-card')) { document.activeElement.blur(); } } }, 50);
        let _teX = e.changedTouches[0].screenX; let _teY = e.changedTouches[0].screenY;
        if (Math.abs(_teX - _tsX) < 10 && Math.abs(_teY - _tsY) < 10) { if (e.target.closest('input, textarea')) return; const sel = window.getSelection(); if (sel && sel.toString().length > 0) { const style = window.getComputedStyle(e.target); const userSel = style.userSelect || style.getPropertyValue('-webkit-user-select'); if (userSel === 'none') { sel.removeAllRanges(); } } }
    }, {passive: true});
</script>
