{% include breadcrumbs.html current_label='ძიება' %}

<!-- Заголовок поиска и органичный счетчик результатов -->
<div class="flex flex-wrap items-baseline justify-between gap-3 mb-4 sm:mb-5">
    <div class="flex flex-wrap items-baseline gap-x-2.5 gap-y-1 min-w-0">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
            ძიების შედეგები:
        </h1>
        <span id="searchQueryDisplay" class="text-2xl sm:text-3xl font-extrabold text-blue-600 tracking-tight break-all"></span>
        <span id="searchCountDot" class="text-slate-300 font-bold text-lg select-none">•</span>
        <span id="searchResultCount" class="text-sm sm:text-[15px] font-bold text-slate-400 shrink-0 transition-opacity duration-200">
            ...
        </span>
    </div>
</div>

<!-- Динамические пилюли категорий найденных товаров (появляются, если товары из нескольких категорий) -->
<div id="searchCategoryPillsWrapper" class="hidden relative mb-5">
    <button id="searchScrollLeft" type="button" aria-label="მარცხნივ" class="hidden md:flex items-center justify-center absolute left-0 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-full bg-white text-slate-700 hover:bg-slate-100 hover:text-blue-600 transition-all cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <div id="searchCategoryPills" style="scrollbar-width: none; -ms-overflow-style: none;" class="flex items-center gap-2 overflow-x-auto [&::-webkit-scrollbar]:hidden scroll-smooth py-0.5">
        <!-- Генерируется через JS -->
    </div>

    <button id="searchScrollRight" type="button" aria-label="მარჯვნივ" class="hidden md:flex items-center justify-center absolute right-0 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-full bg-white text-slate-700 hover:bg-slate-100 hover:text-blue-600 transition-all cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
</div>

<!-- Панель управления (Фильтры и Сортировка) — без теней и обводок -->
<div id="filtersBar" class="sticky top-2 z-30 mb-6">
    <div class="bg-white rounded-2xl p-2 sm:px-4 sm:py-3 transition-all">
        <div class="flex items-center justify-between gap-2 w-full">
            
            <!-- Моб. кнопка открытия фильтра (< md) -->
            <button id="mobileFilterBtn" type="button" class="md:hidden flex-1 min-w-0 flex items-center justify-center gap-1.5 h-10 px-3 rounded-xl bg-slate-100 hover:bg-slate-200/70 active:scale-[0.98] text-slate-800 text-[13px] font-bold transition-all cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 shrink-0"><line x1="4" x2="20" y1="21" y2="21"/><line x1="4" x2="20" y1="3" y2="3"/><line x1="4" x2="20" y1="12" y2="12"/><circle cx="14" cy="3" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="21" r="2"/></svg>
                <span class="truncate">ფილტრი</span>
                <span id="mobileFilterDot" class="hidden w-2 h-2 rounded-full bg-blue-600 shrink-0"></span>
            </button>

            <!-- Десктопный фильтр цены (md+) -->
            <div class="hidden md:flex items-center gap-2.5 flex-wrap">
                <div class="flex items-center bg-slate-100 rounded-xl p-1 transition-all">
                    <span class="text-xs font-bold text-slate-400 pl-2.5 pr-1.5 select-none">ფასი</span>
                    <div class="relative flex items-center">
                        <input id="minPrice" type="number" inputmode="numeric" min="0" placeholder="დან" 
                            class="w-20 h-8 px-2 text-[13px] font-bold text-slate-800 bg-transparent placeholder:text-slate-400 placeholder:font-medium focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" />
                    </div>
                    <span class="h-4 w-[1px] bg-slate-300 mx-0.5"></span>
                    <div class="relative flex items-center">
                        <input id="maxPrice" type="number" inputmode="numeric" min="0" placeholder="მდე" 
                            class="w-20 h-8 px-2 text-[13px] font-bold text-slate-800 bg-transparent placeholder:text-slate-400 placeholder:font-medium focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" />
                    </div>
                    <span class="text-xs font-extrabold text-slate-400 pr-2.5 pl-1 select-none">₾</span>
                </div>

                <!-- Быстрые пресеты цен (Desktop) -->
                <div class="hidden lg:flex items-center gap-1.5">
                    <button type="button" data-min="" data-max="50" class="price-preset-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200/70 transition-colors cursor-pointer">
                        50 ₾-მდე
                    </button>
                    <button type="button" data-min="50" data-max="150" class="price-preset-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200/70 transition-colors cursor-pointer">
                        50 - 150 ₾
                    </button>
                    <button type="button" data-min="150" data-max="" class="price-preset-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200/70 transition-colors cursor-pointer">
                        150 ₾ +
                    </button>
                </div>

                <!-- Кнопка сброса фильтров -->
                <button id="resetFilters" type="button" class="hidden items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 active:scale-95 transition-all cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    <span>გასუფთავება</span>
                </button>
            </div>

            <!-- Правая часть: Сортировка и Переключатель сетки -->
            <div class="flex items-center gap-2 flex-[1.4] md:flex-initial min-w-0 justify-end" id="customSortSelect">
                
                <!-- Скрытый нативный селект -->
                <select id="sortSelect" class="hidden" aria-hidden="true">
                    <option value="default">რეკომენდებული</option>
                    <option value="price-asc">ფასი: ზრდადობით</option>
                    <option value="price-desc">ფასი: კლებადობით</option>
                    <option value="name-asc">დასახელება: ა-ჰ</option>
                    <option value="name-desc">დასახელება: ჰ-ა</option>
                </select>

                <!-- Кастомный дропдаун сортировки -->
                <div class="relative flex-1 md:flex-initial min-w-0 md:min-w-[210px]">
                    <button id="selectTrigger" type="button" aria-haspopup="listbox" class="w-full h-10 px-3 rounded-xl bg-slate-100 hover:bg-slate-200/60 flex items-center justify-between gap-1.5 text-[13px] font-bold text-slate-800 transition-all cursor-pointer">
                        <span class="flex items-center gap-1.5 min-w-0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 shrink-0"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
                            <span id="selectedValue" class="truncate">დალაგება</span>
                        </span>
                        <svg class="select-arrow-svg w-4 h-4 text-slate-400 shrink-0 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>

                    <!-- Выпадающий список (прозрачность 95%, без обводки и теней) -->
                    <div id="selectOptions" style="background-color: rgba(255, 255, 255, 0.95);" class="hidden absolute right-0 mt-2 w-56 backdrop-blur-md rounded-2xl py-1.5 z-50 animate-[fadeIn_0.15s_ease-out]">
                        <div data-value="default" class="select-option flex items-center justify-between px-3.5 py-2.5 text-[13px] font-semibold text-slate-700 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">
                            <span>რეკომენდებული</span>
                        </div>
                        <div data-value="price-asc" class="select-option flex items-center justify-between px-3.5 py-2.5 text-[13px] font-semibold text-slate-700 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">
                            <span>ფასი: ზრდადობით</span>
                        </div>
                        <div data-value="price-desc" class="select-option flex items-center justify-between px-3.5 py-2.5 text-[13px] font-semibold text-slate-700 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">
                            <span>ფასი: კლებადობით</span>
                        </div>
                        <div data-value="name-asc" class="select-option flex items-center justify-between px-3.5 py-2.5 text-[13px] font-semibold text-slate-700 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">
                            <span>დასახელება: ა-ჰ</span>
                        </div>
                        <div data-value="name-desc" class="select-option flex items-center justify-between px-3.5 py-2.5 text-[13px] font-semibold text-slate-700 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors">
                            <span>დასახელება: ჰ-ა</span>
                        </div>
                    </div>
                </div>

                <!-- Переключатель плотности сетки на мобильных (2 кол. / 1 кол.) -->
                <button id="gridToggleBtn" type="button" aria-label="ხედის შეცვლა" class="sm:hidden flex items-center justify-center w-10 h-10 rounded-xl bg-slate-100 text-slate-600 hover:text-slate-900 active:scale-95 transition-all shrink-0 cursor-pointer">
                    <svg id="gridIconCompact" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                    <svg id="gridIconSingle" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="18" height="7" x="3" y="14" rx="1"/></svg>
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Сетка результатов поиска -->
<div id="searchResultsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5 min-h-[360px]">
    <!-- Скелетоны при первичной загрузке -->
    {% for i in (1..8) %}
    <div class="bg-white rounded-2xl p-3 sm:p-4 flex flex-col justify-between h-[310px] sm:h-[360px] animate-pulse" aria-hidden="true">
        <div class="w-full h-40 sm:h-48 bg-slate-100 rounded-xl mb-3"></div>
        <div class="space-y-2">
            <div class="h-3.5 bg-slate-100 rounded-md w-4/5"></div>
            <div class="h-3.5 bg-slate-100 rounded-md w-1/2"></div>
        </div>
        <div class="mt-4 pt-2 flex flex-col gap-2.5">
            <div class="h-6 bg-slate-100 rounded-md w-1/3"></div>
            <div class="h-10 bg-slate-100 rounded-xl w-full"></div>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Пагинация (Показать еще + Прогресс) -->
<div id="loadMoreContainer" class="hidden mt-10 sm:mt-12 flex flex-col items-center justify-center gap-3">
    <p id="paginationCounterText" class="text-xs font-bold text-slate-400 tracking-wide"></p>
    <div class="w-48 h-1 bg-slate-200 rounded-full overflow-hidden mb-1">
        <div id="paginationProgressBar" class="h-full bg-blue-600 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
    <button id="loadMoreBtn" type="button" class="group relative inline-flex items-center justify-center gap-2.5 px-8 py-3.5 rounded-2xl bg-white hover:bg-blue-600 text-slate-800 hover:text-white font-bold text-sm transition-all duration-200 active:scale-[0.98] cursor-pointer">
        <span>მეტის ნახვა</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 group-hover:text-white transition-transform duration-200 group-hover:translate-y-0.5"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
    </button>
</div>

<!-- Мобильная шторка фильтров (переносится в body с z-index: 99999) -->
<div id="mobileFilterModal" style="z-index: 99999;" class="fixed inset-0 hidden md:hidden">
    <div id="mobileFilterBackdrop" style="background-color: rgba(15, 23, 42, 0.45);" class="fixed inset-0 backdrop-blur-xs opacity-0 transition-opacity duration-300"></div>
    
    <div id="mobileFilterSheet" class="fixed bottom-0 inset-x-0 bg-white rounded-t-3xl p-5 pb-8 translate-y-full transition-transform duration-300 ease-out">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
        
        <div class="flex items-center justify-between mb-5">
            <h3 class="text-lg font-extrabold text-slate-900">ფილტრაცია</h3>
            <button id="closeMobileFilter" type="button" class="p-1.5 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>

        <div class="mb-5">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5">ფასის დიაპაზონი (₾)</label>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="relative">
                    <input id="mobileMinPrice" type="number" inputmode="numeric" min="0" placeholder="დან" class="w-full h-11 px-3.5 rounded-xl bg-slate-100 text-sm font-bold text-slate-800 focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" />
                    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">₾</span>
                </div>
                <div class="relative">
                    <input id="mobileMaxPrice" type="number" inputmode="numeric" min="0" placeholder="მდე" class="w-full h-11 px-3.5 rounded-xl bg-slate-100 text-sm font-bold text-slate-800 focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" />
                    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">₾</span>
                </div>
            </div>

            <div class="flex flex-wrap gap-2">
                <button type="button" data-min="" data-max="50" class="price-preset-btn px-3.5 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 transition-colors">
                    50 ₾-მდე
                </button>
                <button type="button" data-min="50" data-max="150" class="price-preset-btn px-3.5 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 transition-colors">
                    50 - 150 ₾
                </button>
                <button type="button" data-min="150" data-max="" class="price-preset-btn px-3.5 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 transition-colors">
                    150 ₾ +
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <button id="mobileResetBtn" type="button" class="flex-1 h-12 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm active:scale-[0.98] transition-all">
                გასუფთავება
            </button>
            <button id="mobileApplyBtn" type="button" class="flex-[2] h-12 rounded-xl bg-blue-600 text-white font-bold text-sm active:scale-[0.98] transition-all">
                შედეგების ჩვენება
            </button>
        </div>
    </div>
</div>
