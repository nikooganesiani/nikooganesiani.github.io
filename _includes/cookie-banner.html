<aside 
  id="cookie-banner" 
  class="fixed inset-x-3 bottom-20 sm:bottom-auto sm:top-auto z-50 pointer-events-none transition-all duration-300 ease-out translate-y-8 opacity-0" 
  aria-label="Cookie Policy Notification"
>
  <div class="pointer-events-auto w-full max-w-none sm:max-w-2xl mx-auto bg-white/95 backdrop-blur-md border border-slate-200/90 shadow-xl shadow-slate-900/10 rounded-2xl p-3 sm:p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-6">
    <div class="flex-1 min-w-0">
      <p class="text-xs sm:text-sm font-semibold text-slate-900 leading-snug">
        საიტი იყენებს ქუქი-ფაილებს (Cookies) ანალიტიკური და მარკეტინგული მიზნებისთვის.
      </p>
      <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 sm:mt-1 leading-snug">
        საიტზე დარჩენით თქვენ ეთანხმებით 
        <a href="/info/privacy" class="text-[#155dfc] hover:underline font-medium">კონფიდენციალურობის პოლიტიკას</a>.
      </p>
    </div>

    <button 
      id="cookie-accept-btn" 
      type="button" 
      class="w-full sm:w-auto shrink-0 px-3.5 py-2 sm:px-5 sm:py-2.5 bg-[#155dfc] hover:bg-blue-700 active:scale-95 text-white text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 shadow-sm shadow-[#155dfc]/25 cursor-pointer whitespace-nowrap"
    >
      გასაგებია
    </button>
  </div>
</aside>
