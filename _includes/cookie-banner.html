<aside 
  id="cookie-banner" 
  role="region"
  aria-label="Cookie Policy Notification"
  class="fixed bottom-4 inset-x-4 sm:bottom-6 sm:inset-x-0 z-50 hidden justify-center pointer-events-none"
>
  <div 
    id="cookie-banner-card"
    class="pointer-events-auto w-full sm:w-auto sm:max-w-lg bg-white/95 backdrop-blur-xl border border-slate-200/90 shadow-2xl shadow-slate-900/10 rounded-2xl sm:rounded-[24px] p-4 sm:p-4 sm:pl-5 flex items-center justify-between gap-3.5 sm:gap-6 transition-all duration-300 ease-out translate-y-4 scale-95 opacity-0 motion-reduce:transition-none motion-reduce:transform-none"
  >
    <div class="flex items-center gap-3.5 min-w-0">
      <!-- Иконка для визуального акцента (скрыта на очень узких экранах, если мало места, либо видна всегда) -->
      <div class="hidden xs:flex shrink-0 w-10 h-10 rounded-xl bg-blue-50 text-[#155dfc] items-center justify-center">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5" />
          <path d="M8.5 8.5v.01" />
          <path d="M16 15.5v.01" />
          <path d="M12 12v.01" />
          <path d="M11 17v.01" />
          <path d="M7 14v.01" />
        </svg>
      </div>

      <div class="flex-1 min-w-0">
        <p class="text-xs sm:text-sm font-semibold text-slate-900 leading-snug">
          საიტი იყენებს ქუქი-ფაილებს (Cookies)
        </p>
        <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 sm:mt-1 leading-snug">
          იხილეთ 
          <a 
            href="/info/privacy" 
            class="text-[#155dfc] font-medium underline-offset-2 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#155dfc] rounded-xs"
          >კონფიდენციალურობის პოლიტიკა</a>
        </p>
      </div>
    </div>

    <button 
      id="cookie-accept-btn" 
      type="button" 
      class="shrink-0 px-4 py-2.5 sm:px-5 sm:py-2.5 bg-[#155dfc] hover:bg-blue-700 active:scale-95 text-white text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 shadow-sm shadow-[#155dfc]/25 cursor-pointer whitespace-nowrap focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#155dfc] focus-visible:ring-offset-2"
    >
      ვეთანხმები
    </button>
  </div>
</aside>
