<aside 
  id="cookie-banner" 
  class="fixed bottom-0 inset-x-0 z-50 p-3 sm:p-4 pointer-events-none flex justify-center transition-all duration-300 ease-out translate-y-full opacity-0" 
  aria-label="Cookie Policy Notification"
>
  <div class="pointer-events-auto w-full max-w-2xl bg-white/95 backdrop-blur-md border border-slate-200/80 shadow-2xl rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div class="flex-1 pr-0 sm:pr-3">
      <p class="text-sm font-semibold text-slate-900 leading-snug">
        საიტი იყენებს ქუქი-ფაილებს (Cookies) ანალიტიკური და მარკეტინგული მიზნებისთვის.
      </p>
      <p class="text-xs text-slate-500 mt-1 leading-relaxed">
        საიტზე დარჩენით თქვენ ეთანხმებით კონფიდენციალურობის პოლიტიკას.
      </p>
    </div>
    <button 
      id="cookie-accept-btn" 
      type="button" 
      class="w-full sm:w-auto shrink-0 px-5 py-2.5 bg-[#155dfc] hover:bg-blue-700 active:scale-95 text-white text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 shadow-sm shadow-[#155dfc]/25 cursor-pointer text-center"
    >
      გასაგებია
    </button>
  </div>
</aside>
