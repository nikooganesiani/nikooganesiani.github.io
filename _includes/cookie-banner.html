<style>
  #cookie-banner {
    position: fixed;
    top: 12px;
    left: 10px;
    right: 10px;
    bottom: auto;
    z-index: 2147483647;
    display: none;
    justify-content: center;
    pointer-events: none;
  }
  #cookie-banner.is-mounted {
    display: flex;
  }
  #cookie-banner-card {
    pointer-events: auto;
    width: 100%;
    max-width: 460px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 16px 40px -8px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.04);
    border-radius: 20px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    opacity: 0;
    transform: translateY(-16px) scale(0.96);
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #cookie-banner-card.is-visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .cb-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .cb-icon {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(21, 93, 252, 0.14) 0%, rgba(21, 93, 252, 0.04) 100%);
    border: 1px solid rgba(21, 93, 252, 0.15);
    color: #155dfc;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cb-icon svg {
    width: 18px;
    height: 18px;
  }
  .cb-text {
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }
  .cb-title {
    margin: 0;
    font-size: clamp(10.5px, 2.7vw, 12px);
    font-weight: 600;
    color: #0f172a;
    line-height: 1.35;
    letter-spacing: -0.015em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cb-desc {
    margin: 2px 0 0 0;
    font-size: clamp(10px, 2.5vw, 11.5px);
    color: #64748b;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cb-link {
    color: #155dfc;
    font-weight: 500;
    text-decoration: underline;
    text-decoration-color: rgba(21, 93, 252, 0.35);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.2s;
  }
  .cb-link:hover {
    text-decoration-color: #155dfc;
  }
  .cb-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 8px 12px;
    background: linear-gradient(180deg, #256aff 0%, #155dfc 100%);
    color: #ffffff;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.2;
    border: none;
    border-radius: 11px;
    box-shadow: 0 4px 12px rgba(21, 93, 252, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .cb-btn:hover {
    background: linear-gradient(180deg, #155dfc 0%, #1048cb 100%);
    box-shadow: 0 6px 16px rgba(21, 93, 252, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .cb-btn:active {
    transform: scale(0.96);
  }
  .cb-btn svg {
    width: 13px;
    height: 13px;
    stroke-width: 2.5;
  }

  /* Десктоп и планшеты (внизу экрана, крупнее, без перекрытия хедера) */
  @media (min-width: 640px) {
    #cookie-banner {
      top: auto;
      bottom: 24px;
      left: 0;
      right: 0;
    }
    #cookie-banner-card {
      width: auto;
      max-width: 600px;
      border-radius: 24px;
      padding: 14px 18px;
      gap: 24px;
      transform: translateY(16px) scale(0.96);
    }
    .cb-left {
      gap: 14px;
    }
    .cb-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
    }
    .cb-icon svg {
      width: 22px;
      height: 22px;
    }
    .cb-title {
      font-size: 13.5px;
    }
    .cb-desc {
      font-size: 12px;
      margin-top: 3px;
    }
    .cb-btn {
      padding: 10px 18px;
      font-size: 13px;
      border-radius: 13px;
      gap: 6px;
    }
    .cb-btn svg {
      width: 15px;
      height: 15px;
    }
  }
</style>
