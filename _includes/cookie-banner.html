<aside 
  id="cookie-banner" 
  role="region"
  aria-label="Cookie Policy Notification"
  style="z-index: 2147483647;"
  class="fixed top-3 inset-x-2.5 sm:top-5 sm:inset-x-0 z-[2147483647] hidden justify-center pointer-events-none"
>
  <div 
    id="cookie-banner-card"
    class="pointer-events-auto w-full sm:w-auto sm:max-w-[580px] bg-white/95 backdrop-blur-2xl border border-white/80 ring-1 ring-slate-900/[0.08] shadow-[0_16px_40px_-8px_rgba(15,23,42,0.2)] rounded-2xl sm:rounded-[22px] px-3 py-2.5 sm:px-4 sm:py-3.5 flex items-center justify-between gap-2.5 sm:gap-5 transition-all duration-300 ease-out -translate-y-5 scale-95 opacity-0 motion-reduce:transition-none motion-reduce:transform-none"
  >
    <!-- Левая часть: Иконка + Текст -->
    <div class="flex items-center gap-2.5 sm:gap-3.5 min-w-0">
      
      <!-- Иконка (компактная 32px на мобильных, 44px на десктопе) -->
      <div class="flex shrink-0 w-8 h-8 sm:w-11 sm:h-11 rounded-[10px] sm:rounded-[14px] bg-gradient-to-br from-[#155dfc]/15 via-[#155dfc]/5 to-transparent border border-[#155dfc]/15 text-[#155dfc] items-center justify-center shadow-inner">
        <svg class="w-4 h-4 sm:w-6 sm:h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5Z" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="8.5" cy="8.5" r="1" fill="currentColor"/>
          <circle cx="15.5" cy="15.5" r="1" fill="currentColor"/>
          <circle cx="12" cy="12" r="1" fill="currentColor"/>
          <circle cx="11" cy="16.5" r="1" fill="currentColor"/>
          <circle cx="7.5" cy="13.5" r="1" fill="currentColor"/>
        </svg>
      </div>

      <!-- Текстовый блок (строго 2 строки без переносов) -->
      <div class="flex-1 min-w-0">
        <p class="text-[11px] sm:text-[13.5px] font-semibold text-slate-900 tracking-tight leading-snug whitespace-nowrap">
          საიტი იყენებს ქუქი-ფაილებს (Cookies).
        </p>
        <p class="text-[10.5px] sm:text-xs text-slate-500 mt-0.5 leading-snug whitespace-nowrap">
          იხილეთ 
          <a 
            href="/info/privacy" 
            class="text-[#155dfc] font-medium underline decoration-[#155dfc]/35 underline-offset-3 hover:decoration-[#155dfc] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#155dfc] rounded-xs"
          >კონფიდენციალურობის პოლიტიკა</a>.
        </p>
      </div>
    </div>

    <!-- Правая часть: Кнопка -->
    <button 
      id="cookie-accept-btn" 
      type="button" 
      class="shrink-0 inline-flex items-center justify-center gap-1 sm:gap-1.5 px-3 py-2 sm:px-4 sm:py-2.5 bg-gradient-to-b from-[#256aff] to-[#155dfc] hover:from-[#155dfc] hover:to-[#1048cb] active:scale-95 text-white text-[11.5px] sm:text-[13px] font-semibold rounded-[11px] sm:rounded-[14px] transition-all duration-200 shadow-[0_4px_12px_0_rgba(21,93,252,0.35),inset_0_1px_0_0_rgba(255,255,255,0.25)] cursor-pointer whitespace-nowrap focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#155dfc] focus-visible:ring-offset-2"
    >
      <svg class="w-3 h-3 sm:w-4 sm:h-4 stroke-[2.5]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
      <span>ვეთანხმები</span>
    </button>
  </div>
</aside>
