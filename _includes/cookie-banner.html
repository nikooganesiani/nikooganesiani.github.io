<style>
  #cookie-banner { position: fixed; left: 16px; right: 16px; bottom: calc(var(--mobile-nav-height, 65px) + 12px); z-index: 150; display: flex; justify-content: center; pointer-events: none; }
  #cookie-banner-card { pointer-events: auto; width: 100%; max-width: 700px; padding: 20px; border: 1px solid #dbe3ef; border-radius: 18px; background: #fff; box-shadow: 0 8px 40px #1923341f; display: flex; align-items: center; flex-wrap: wrap; gap: 16px 24px; }
  .cb-text { flex: 1 1 280px; min-width: 0; }
  .cb-title { margin: 0; color: #192334; font-size: 14px; font-weight: 600; line-height: 1.5; }
  .cb-desc { margin: 6px 0 0; color: #586577; font-size: 12px; line-height: 1.7; }
  .cb-link { color: #1048cb; text-decoration: underline; text-underline-offset: 3px; }
  .cb-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .cb-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 16px; border: 1px solid #155dfc; border-radius: 10px; background: #155dfc; color: #fff; font-size: 12px; font-weight: 600; line-height: 1.5; cursor: pointer; }
  .cb-btn:hover { background: #1048cb; }
  .cb-btn--secondary { background: #fff; color: #1048cb; border-color: #c9d6ec; }
  .cb-btn--secondary:hover { background: #edf3ff; }
  @media (min-width: 640px) { #cookie-banner { bottom: 24px; } }
  @media (max-width: 639px) { #cookie-banner { left: 12px; right: 12px; } #cookie-banner-card { padding: 16px; gap: 14px; } .cb-text { flex-basis: 100%; } .cb-actions { width: 100%; } .cb-btn { flex: 1; } }
  @media print { #cookie-banner { display: none !important; } }
</style>
<aside id="cookie-banner" role="region" aria-labelledby="cookie-banner-title" hidden>
  <div id="cookie-banner-card">
    <div class="cb-text">
      <p class="cb-title" id="cookie-banner-title">სარეკლამო ანალიტიკის არჩევანი</p>
      <p class="cb-desc">თქვენი თანხმობით Meta-ს ანალიტიკას რეკლამის შედეგების შესაფასებლად ვიყენებთ. არჩევანი შეკვეთას ხელს არ უშლის. <a href="{{ '/info/privacy#cookies' | relative_url }}" class="cb-link">მონაცემები და პარამეტრები</a>.</p>
    </div>
    <div class="cb-actions"><button id="cookie-decline-btn" type="button" class="cb-btn cb-btn--secondary">მხოლოდ აუცილებელი</button><button id="cookie-accept-btn" type="button" class="cb-btn">თანხმობა</button></div>
  </div>
</aside>
