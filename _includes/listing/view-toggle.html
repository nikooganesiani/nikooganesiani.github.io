<button id="gridToggleBtn" type="button" class="listing-button listing-button--secondary listing-grid-toggle
      {% include listing/button-secondary-classes.html %}
      w-11 p-0! min-[700px]:hidden!
      [&[aria-pressed=true]]:border-accent [&[aria-pressed=true]]:text-accent
      max-[700px]:[grid-area:1_/_2] max-[700px]:justify-self-end" aria-label="ერთი სვეტით ჩვენება" aria-pressed="false" aria-controls="{% if page.listing_mode == 'search' %}searchResultsGrid{% else %}catalogContainer{% endif %}" hidden>
  <span id="gridIconCompact">{% include icons.html name='grid' size=18 %}</span>
  <span id="gridIconSingle" hidden>{% include icons.html name='rows' size=18 %}</span>
</button>
