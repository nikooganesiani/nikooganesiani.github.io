{% include listing/controls.html count_id=include.count_id %}
<div class="listing-layout
      grid min-w-0
      min-[1024px]:[&:has(.listing-sidebar:not([hidden]))]:[grid-template-columns:16rem_minmax(0,_1fr)] min-[1024px]:[&:has(.listing-sidebar:not([hidden]))]:gap-[1.5rem]
      min-[1480px]:[&:has(.listing-sidebar:not([hidden]))]:[grid-template-columns:17.5rem_minmax(0,_1fr)] min-[1480px]:[&:has(.listing-sidebar:not([hidden]))]:gap-[2rem]
      [.no-js_&]:hidden!">
  <aside id="listingSidebar" class="listing-sidebar
      hidden self-start min-w-0 px-4 border border-line rounded-[.875rem] bg-canvas
      min-[1024px]:[&:not([hidden])]:block" aria-label="პროდუქტების ფილტრები" hidden>
    <div class="listing-sidebar-title
      flex items-center gap-2.5 py-4 border-b border-line text-ink text-base font-[650]
      [&_svg]:text-accent">{% include icons.html name='sliders-horizontal' size=18 %}<span>ფილტრები</span></div>
    {% include listing/facets.html %}
  </aside>
  <section id="listingResults" class="listing-results
      min-w-0 [scroll-margin-top:calc(var(--site-header-height,_80px)_+_.75rem)]" aria-label="პროდუქტები">
    {% include listing/results.html grid_id=include.grid_id %}
  </section>
</div>
