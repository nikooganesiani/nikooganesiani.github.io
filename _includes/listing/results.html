<p id="listingStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true">პროდუქტები იტვირთება…</p>
<div id="{{ include.grid_id }}" class="{% include listing/grid-classes.html %}" aria-busy="true">
  {% if page.storefront_locale and page.listing_mode == 'category' and listing_products.size > 0 %}
    {% for product in listing_products limit:16 %}{% include homepage/product-card.html product=product %}{% endfor %}
  {% else %}
  {% for i in (1..8) %}<div class="listing-skeleton
      [animation:listing-pulse_1.5s_ease-in-out_infinite_alternate] pb-[3rem]
      [&_div]:block [&_div]:bg-surface [&_div]:rounded-xl
      [&_span]:block [&_span]:bg-surface [&_span]:rounded-xl
      [&_div]:[aspect-ratio:1] [&_div]:mb-[1rem]
      [&_span]:w-[74%] [&_span]:h-[.875rem] [&_span]:mb-[.55rem]
      [&_span:last-child]:w-[42%]
      motion-reduce:[animation:none]" aria-hidden="true"><div></div><span></span><span></span></div>{% endfor %}
  {% endif %}
</div>
<div id="loadMoreContainer" class="listing-more
      grid justify-items-center gap-[.65rem] mt-[2rem] text-muted text-sm
      [&_.listing-button]:min-w-[12rem]
      [&_progress]:w-[11rem] [&_progress]:h-[.3rem] [&_progress]:border-0 [&_progress]:rounded-2xl [&_progress]:overflow-hidden [&_progress]:accent-brand
      [&_progress::-webkit-progress-bar]:bg-line
      [&_progress::-webkit-progress-value]:bg-brand
      [&_progress::-moz-progress-bar]:bg-brand" hidden>
  <p id="paginationCounterText"></p>
  <progress id="paginationProgressBar" value="0" max="1" aria-label="ნაჩვენები პროდუქტები"></progress>
  <button id="loadMoreBtn" type="button" class="listing-button listing-button--secondary
      {% include listing/button-secondary-classes.html %}
      " aria-controls="{{ include.grid_id }}">მეტის ნახვა</button>
</div>
