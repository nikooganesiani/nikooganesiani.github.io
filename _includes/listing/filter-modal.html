<div id="mobileFilterModal" class="modal listing-modal hidden {% include modals/classes.html part='overlay' %}" role="dialog" aria-labelledby="mobileFilterTitle" aria-hidden="true">
  <div class="modal-panel {% include modals/classes.html part='panel' %} listing-modal-panel">
    {% include modals/header.html icon="sliders-horizontal" title_id="mobileFilterTitle" title="ფილტრები" focus_title=true %}
    <div id="listingMobileFacets" class="modal-body listing-modal-body {% include modals/classes.html part='body' %} bg-page pt-4! [&_.listing-facet]:rounded-media [&_.listing-facet]:bg-canvas [&_.listing-facet]:px-3 [&_summary]:min-h-11 [&_.listing-option]:min-h-11"></div>
    <footer class="listing-modal-footer
      {% include modals/classes.html part='footer' actions=true %} flex items-center justify-between gap-3
      [&_.listing-button--primary]:flex-1">
      <button id="mobileResetBtn" type="button" class="listing-button listing-button--secondary
      {% include listing/button-secondary-classes.html %}
      ">გასუფთავება</button>
      <button id="mobileApplyBtn" type="button" class="listing-button listing-button--primary
      {% include listing/button-primary-classes.html %}
      "><span>ჩვენება</span><span id="mobileFilterPreview"></span></button>
      <p id="mobileFilterStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </footer>
  </div>
</div>
