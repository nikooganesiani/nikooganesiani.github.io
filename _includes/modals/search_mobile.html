<div class="modal modal--search hidden" id="searchModalMobile" role="dialog" aria-labelledby="mobileSearchTitle" aria-hidden="true">
  <div class="modal-panel"><header class="modal-header"><div class="modal-heading"><h2 id="mobileSearchTitle" class="modal-title">ძიება</h2></div>{% include modals/close-button.html %}</header>
    <div class="modal-search-controls">
      <div class="modal-field modal-search-field">
        <input type="search" id="mobileSearchInput" aria-label="პროდუქტის ძიება" aria-describedby="mobileSearchHint" data-modal-initial-focus autocomplete="off" enterkeyhint="search" placeholder="პროდუქტი, ბრენდი ან მოდელი">
        <button type="button" class="modal-search-clear" id="mobileSearchClear" aria-label="ძიების გასუფთავება">{% include icons.html name='close' size=18 %}</button>
        <button type="button" class="modal-search-submit" id="mobileSearchBtn" aria-label="ძიება"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.75" cy="10.75" r="7.25"/><path d="m16 16 4.5 4.5"/></svg></button>
      </div>
      <p id="mobileSearchHint" class="modal-field-help">მოძებნეთ დასახელებით, ბრენდით ან მოდელით.</p>
    </div>
    <div class="modal-body modal-search-body"><div id="mobileSearchResults" class="modal-search-results" hidden></div></div></div>
</div>
