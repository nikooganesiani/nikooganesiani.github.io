{%- assign close_icon_trigger = 'auto' -%}
{%- if include.color_only -%}{%- assign close_icon_trigger = 'click' -%}{%- endif -%}
<button type="button" class="inline-flex size-11 shrink-0 items-center justify-center rounded-control bg-transparent text-muted cursor-pointer hover:bg-surface hover:text-ink active:bg-surface motion-safe:transition-colors" data-close-modal aria-label="{{ include.label | default: 'დახურვა' | escape }}">{% include icons.html name='close' size=18 trigger=close_icon_trigger %}</button>
