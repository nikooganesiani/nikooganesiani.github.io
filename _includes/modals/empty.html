    <p class="mt-2 max-w-80 text-sm leading-relaxed text-muted">{{ include.description }}</p>
    <a href="{{ '/category/' | relative_url }}" class="mt-5 inline-flex min-h-11 items-center justify-center rounded-control bg-brand px-5 py-2 text-sm font-semibold text-white hover:bg-brand-dark">პროდუქტების ნახვა</a>
  </div>
</template>
