<div class="modal modal--catalog hidden" id="navModal" role="dialog" aria-labelledby="navModalTitle" aria-hidden="true">
  <div class="modal-panel"><header class="modal-header"><div class="modal-heading"><h2 id="navModalTitle" class="modal-title" tabindex="-1" data-modal-initial-focus>კატალოგი</h2><p class="modal-description">აირჩიეთ კატეგორია და იპოვეთ სასურველი ტექნიკა.</p></div>{% include modals/close-button.html %}</header>
    <nav class="modal-body" aria-label="პროდუქტის კატეგორიები"><div id="dynamicNavAccordion" class="modal-catalog-grid">
      {% for category in site.data.catalog %}<a class="modal-subcategory" href="/category/?{{ category[0] | url_encode }}">{{ category[1].title | escape }}</a>{% endfor %}
    </div></nav></div>
</div>
