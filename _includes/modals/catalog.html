<div class="modal fixed inset-0 bg-slate-900/40 backdrop-blur-[8px] z-[9999] hidden justify-center items-center opacity-0 transition-opacity duration-400 p-4 [&.active]:opacity-100 group" id="navModal">
    <style>
        @media (min-width: 1024px) {
            #dynamicNavAccordion [class*="grid-cols-3"],
            #dynamicNavAccordion .lg\:grid-cols-3 {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }
        }
    </style>
    <div class="bg-white max-w-[440px] lg:max-w-[750px] w-full rounded-3xl p-6 h-[70vh] min-h-[400px] max-h-[600px] flex flex-col pb-6 transform scale-90 translate-y-5 opacity-0 transition-all duration-400 ease-[cubic-bezier(0.34,1.56,0.64,1)] group-[.active]:scale-100 group-[.active]:translate-y-0 group-[.active]:opacity-100 border-none shadow-none">
        <h3 class="flex items-center justify-center text-[1.5rem] font-bold text-slate-900 mb-4 tracking-tight shrink-0">კატალოგი</h3>
        <div class="flex-1 overflow-y-auto pr-1 pt-4 pb-4 -mt-4 -mb-4 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden [mask-image:linear-gradient(to_bottom,transparent,black_1rem,black_calc(100%-1rem),transparent)]" id="dynamicNavAccordion"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const acc = document.getElementById('dynamicNavAccordion');
    if (acc) {
        const observer = new MutationObserver(() => {
            acc.querySelectorAll('.lg\\:grid-cols-3, .grid-cols-3').forEach(el => {
                el.classList.remove('lg:grid-cols-3', 'grid-cols-3');
                el.classList.add('lg:grid-cols-2');
            });
        });
        observer.observe(acc, { childList: true, subtree: true });
    }
});
</script>
