<div class="modal fixed inset-0 bg-slate-900/50 backdrop-blur-[4px] z-[9999] hidden justify-center items-center opacity-0 transition-opacity duration-150 p-3 sm:p-4 [&.active]:opacity-100 group" id="navModal">
    <div class="bg-white max-w-[460px] lg:max-w-[920px] w-full rounded-2xl sm:rounded-3xl p-4 sm:p-6 h-auto max-h-[85vh] flex flex-col opacity-0 transition-opacity duration-150 group-[.active]:opacity-100 border border-slate-200/80 shadow-2xl shadow-slate-900/10">
        
        <!-- Шапка каталога -->
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                </div>
                <h3 class="text-[1.25rem] sm:text-[1.35rem] font-bold text-slate-900 tracking-tight m-0">კატალოგი</h3>
            </div>
            
            <button type="button" id="closeNavModalBtn" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition-colors duration-150 cursor-pointer border-none outline-none" aria-label="დახურვა">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Список категорий (генерируется через JS) -->
        <div class="flex-1 overflow-y-auto [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden" id="dynamicNavAccordion"></div>
    </div>
</div>
