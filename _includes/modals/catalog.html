<!-- _includes/categories.html -->
<section class="w-full max-w-7xl mx-auto px-4 py-3 sm:py-4" aria-label="კატეგორიები">
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 sm:gap-3">
    {% for category in site.data.catalog %}
      {% assign cat_id = category[0] %}
      {% assign cat_info = category[1] %}
      <button
        type="button"
        aria-haspopup="dialog"
        class="category-item-btn group flex flex-row sm:flex-col items-center sm:justify-center gap-3 sm:gap-2.5 p-2.5 sm:p-4 rounded-2xl bg-white border border-slate-200/70 hover:border-[#155dfc]/40 active:bg-slate-50 transition-colors duration-150 text-left sm:text-center cursor-pointer outline-none"
        data-cat="{{ cat_id }}"
        data-name="{{ cat_info.title | escape }}"
        data-subs='{{ cat_info.subs | jsonify | escape }}'
      >
        <!-- Иконка -->
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl bg-[#155dfc]/[0.07] text-[#155dfc] flex items-center justify-center shrink-0 group-hover:bg-[#155dfc] group-hover:text-white transition-colors duration-150 [&>svg]:w-5 [&>svg]:h-5 sm:[&>svg]:w-6 sm:[&>svg]:h-6">
          {{ cat_info.icon }}
        </div>

        <!-- Название -->
        <span class="text-xs sm:text-[13px] font-semibold text-slate-800 group-hover:text-[#155dfc] leading-tight line-clamp-2 sm:line-clamp-1 transition-colors duration-150">
          {{ cat_info.title }}
        </span>
      </button>
    {% endfor %}
  </div>
</section>

<!-- Модальное окно (z-[9999] поверх нижнего меню) -->
<div
  id="categoryModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="categoryModalTitle"
  aria-hidden="true"
  class="fixed inset-0 z-[9999] flex items-end sm:items-center justify-center sm:p-4 bg-black/45 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200"
>
  <div
    id="categoryModalBox"
    class="relative w-full max-w-md bg-white rounded-t-[28px] sm:rounded-3xl overflow-hidden transform translate-y-6 sm:translate-y-0 opacity-0 transition-all duration-200"
  >
    <!-- Тонкий ползунок шторки (только на мобильных) -->
    <div class="w-9 h-1 bg-slate-300/80 rounded-full mx-auto mt-2.5 sm:hidden"></div>

    <!-- Шапка -->
    <div class="flex items-center justify-between px-5 pt-3.5 pb-3 sm:py-4 border-b border-slate-100">
      <h3 id="categoryModalTitle" class="text-base sm:text-[17px] font-semibold text-slate-900 tracking-tight"></h3>
      <button
        type="button"
        id="categoryModalClose"
        aria-label="დახურვა"
        class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200/80 hover:text-slate-800 flex items-center justify-center transition-colors cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Список подкатегорий (скроллбар скрыт визуально) -->
    <div
      id="categoryModalList"
      class="p-3.5 sm:p-4 pb-6 sm:pb-4 grid grid-cols-1 gap-1.5 max-h-[65vh] overflow-y-auto [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden"
    ></div>
  </div>
</div>
