<div class="modal hidden" id="orderConfirmModal" role="dialog" aria-labelledby="orderConfirmTitle" aria-hidden="true" aria-describedby="orderConfirmDescription">
  <div class="modal-panel">
    <div class="modal-header modal-header--quiet"><span></span>{% include modals/close-button.html %}</div>
    <div class="modal-body modal-success">
      <div class="modal-success-icon" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div>
      <h2 id="orderConfirmTitle" class="modal-title" tabindex="-1" data-modal-initial-focus>შეკვეთა მიღებულია</h2>
      <p id="orderConfirmDescription" class="modal-description">მალე დაგიკავშირდებით შეკვეთის დასადასტურებლად. მადლობა, რომ აირჩიეთ ENKA!</p>
      <dl class="modal-receipt">
        <div><dt>სახელი</dt><dd id="confirmName">—</dd></div>
        <div><dt>ტელეფონი</dt><dd id="confirmPhone">—</dd></div>
        <div><dt>პროდუქტი</dt><dd id="confirmProduct">—</dd></div>
        <div><dt>თანხა</dt><dd id="confirmPrice">—</dd></div>
      </dl>
      <button type="button" class="modal-button" id="closeOrderConfirmModal" onclick="window.openOrders(event); window.closeAppModal('orderConfirmModal');">ჩემი შეკვეთები {% include icons.html name='chevron-right' size=18 %}</button>
    </div></div>
</div>
