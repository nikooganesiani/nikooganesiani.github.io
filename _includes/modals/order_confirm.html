<div class="modal fixed inset-0 bg-slate-900/40 backdrop-blur-[8px] z-[9999] hidden justify-center items-center opacity-0 transition-opacity duration-400 p-4 [&.active]:opacity-100 group" id="orderConfirmModal">
    <div class="bg-white max-w-[440px] w-full rounded-3xl p-6 max-h-[90vh] overflow-y-auto overflow-x-hidden transform scale-90 translate-y-5 opacity-0 transition-all duration-400 ease-[cubic-bezier(0.34,1.56,0.64,1)] group-[.active]:scale-100 group-[.active]:translate-y-0 group-[.active]:opacity-100 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden border-none shadow-none">
        <div class="relative w-[100px] h-[100px] mx-auto mb-6 flex items-center justify-center">
            <div class="absolute w-[90px] h-[90px] rounded-full bg-green-100 flex items-center justify-center animate-[statusPulse_2s_infinite]">
                <div class="w-[60px] h-[60px] rounded-full bg-green-600 flex items-center justify-center z-[2]">
                    <svg class="w-[30px] h-[30px] text-white stroke-[4]" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17L4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
            </div>
        </div>
        <h3 class="flex items-center justify-center text-[1.8rem] font-bold text-slate-900 mb-0 tracking-tight">შეკვეთა მიღებულია!</h3>
        <p class="text-center text-slate-500 text-[1rem] font-medium mb-6 mt-4 leading-relaxed">მალე დაგიკავშირდებით. <br>მადლობა, რომ აირჩიეთ ENKA Electronics!</p>
        
        <div class="bg-transparent p-5 mb-6">
            <div class="flex justify-between items-center mb-3 pb-3 border-b border-dashed border-slate-100"><span class="text-slate-500 font-semibold text-[0.9rem]">სახელი:</span><span class="font-bold text-slate-900 text-[0.95rem] text-right max-w-[60%]" id="confirmName">-</span></div>
            <div class="flex justify-between items-center mb-3 pb-3 border-b border-dashed border-slate-100"><span class="text-slate-500 font-semibold text-[0.9rem]">ტელეფონი:</span><span class="font-bold text-slate-900 text-[0.95rem] text-right max-w-[60%]" id="confirmPhone">-</span></div>
            <div class="flex justify-between items-center mb-3 pb-3 border-b border-dashed border-slate-100"><span class="text-slate-500 font-semibold text-[0.9rem]">პროდუქტი:</span><span class="font-bold text-slate-900 text-[0.95rem] text-right max-w-[60%]" id="confirmProduct">-</span></div>
            <div class="flex justify-between items-center pt-2 border-none mb-0 pb-0"><span class="text-slate-500 font-semibold text-[1rem]">თანხა:</span><span class="font-bold text-[1.4rem] text-blue-600" id="confirmPrice">-</span></div>
        </div>
        
        <button class="bg-blue-600 text-white border-none p-4 w-full rounded-xl text-[1.1rem] font-bold cursor-pointer transition-all duration-300 flex justify-center items-center gap-2 select-none outline-none hover:bg-blue-700 active:scale-95 shadow-none" id="closeOrderConfirmModal" onclick="window.closeAppModal('orderConfirmModal'); window.openOrders(event);">ჩემი შეკვეთები</button>
    </div>
</div>
