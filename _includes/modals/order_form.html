<div class="modal order-form-modal hidden" id="orderFormModal" role="dialog" aria-labelledby="orderFormTitle" aria-hidden="true">
  <div class="modal-panel"><header class="modal-header"><div class="modal-heading"><h2 id="orderFormTitle" class="modal-title" tabindex="-1" data-modal-initial-focus>შეკვეთის გაფორმება</h2><p class="modal-description">დატოვეთ ნომერი — დეტალებს ზარით დავაზუსტებთ.</p></div>{% include modals/close-button.html %}</header>
    <div class="modal-body">
      <div class="modal-product-summary">
        <p id="quickProductName" class="modal-product-name"></p>
        <p id="quickProductPrice" class="modal-product-price"></p>
        <p class="modal-product-delivery">{% include icons.html name='truck' size=16 %} უფასო მიწოდება · გადახდა მიღებისას</p>
      </div>
      <form id="quickOrderForm" novalidate aria-describedby="quickOrderError">
        <input type="email" name="email_hp" id="quickEmailHp" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="modal-form-field">
          <label for="quickName" class="modal-field-label">თქვენი სახელი</label>
          <div class="modal-field" id="quickFormWrapperName"><input type="text" id="quickName" name="name" required minlength="2" maxlength="80" aria-describedby="quickOrderError" placeholder="სახელი" autocomplete="name" enterkeyhint="next"></div>
        </div>
        <div class="modal-form-field">
          <label for="quickPhone" class="modal-field-label">მობილურის ნომერი</label>
          <div class="modal-field" id="quickFormWrapperPhone"><span class="text-sm text-slate-500 shrink-0" aria-hidden="true">+995</span><input type="tel" id="quickPhone" name="phone" required maxlength="17" aria-describedby="quickPhoneHint quickOrderError" placeholder="555 12 34 56" inputmode="tel" autocomplete="tel-national" enterkeyhint="done"></div>
          <p id="quickPhoneHint" class="modal-field-help">9-ნიშნა ნომერი, რომელიც იწყება 5-ით.</p>
        </div>
        <p id="quickOrderError" role="alert" class="modal-error"></p>
        <button type="submit" class="modal-button">შეკვეთის გაგზავნა {% include icons.html name='chevron-right' size=18 %}</button>
        <p class="modal-privacy">შეკვეთის გაგზავნით ეთანხმებით <a href="/info/privacy">კონფიდენციალურობის პოლიტიკას</a>.</p>
      </form>
    </div></div>
</div>
