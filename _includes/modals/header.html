<header class="modal-header grid shrink-0 grid-cols-[auto_minmax(0,1fr)_auto] items-start gap-3">
  <span class="grid size-11 place-items-center rounded-control bg-surface text-accent" aria-hidden="true">{% include icons.html name=include.icon size=21 %}</span>
  <div class="modal-header-copy flex min-h-11 min-w-0 flex-col gap-1">
    <h2 id="{{ include.title_id }}" class="m-0 font-[650] tracking-tight wrap-anywhere"{% if include.focus_title %} tabindex="-1" data-modal-initial-focus{% endif %}>{{ include.title | escape }}{% if include.count_id %} <span id="{{ include.count_id }}" class="text-sm font-medium text-muted whitespace-nowrap"></span>{% endif %}</h2>
    {% if include.description %}<p{% if include.description_id %} id="{{ include.description_id }}"{% endif %} class="text-[length:13px] leading-[1.55] text-muted wrap-anywhere">{{ include.description | escape }}</p>{% endif %}
  </div>
  {% include modals/close-button.html color_only=include.color_only %}
</header>
