<div class="modal hidden" id="trackingModal" role="dialog" aria-labelledby="trackingModalTitle" aria-hidden="true">
  <div class="modal-panel"><header class="modal-header"><div class="modal-heading"><h2 id="trackingModalTitle" class="modal-title" tabindex="-1" data-modal-initial-focus>შეკვეთის სტატუსი</h2><p class="modal-description">გაიგეთ, სად არის თქვენი ამანათი.</p></div>{% include modals/close-button.html %}</header>
    <div class="modal-body">
      <label for="trackingOrderId" class="modal-field-label">შეკვეთის ნომერი</label>
      <div class="modal-field" id="trackingInputWrapper"><input type="text" id="trackingOrderId" aria-describedby="trackingHint trackingResult" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" enterkeyhint="go" placeholder="მაგ. TNENKAElectronics…"></div>
      <p id="trackingHint" class="modal-field-help">ჩასვით ნომერი სრულად ან TNENKAElectronics პრეფიქსის გარეშე.</p>
      <button type="button" id="trackingCheckBtn" class="modal-button">შემოწმება</button>
      <div id="trackingResult" role="status" aria-live="polite" aria-atomic="true" class="modal-tracking-result hidden"></div>
    </div></div>
</div>
