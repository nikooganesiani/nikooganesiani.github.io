<div class="modal hidden {% include modals/classes.html part='overlay' %}" id="trackingModal" role="dialog" aria-labelledby="trackingModalTitle" aria-hidden="true">
  <div class="modal-panel {% include modals/classes.html part='panel' %}">
    {% include modals/header.html icon="truck" title_id="trackingModalTitle" title="შეკვეთის სტატუსი" focus_title=true description="გაიგეთ, სად არის თქვენი ამანათი." %}
    <div class="modal-body modal-content {% include modals/classes.html part='body' %}">
      <div class="[--group-radius:var(--radius-panel)] rounded-(--group-radius) bg-page p-4">
      <label for="trackingOrderId" class="block mt-0 mr-0 mb-2 ml-0 text-[length:13px] font-semibold leading-[1.5] text-[color:light-dark(#374151,var(--color-night-copy))]">შეკვეთის ნომერი</label>
      <div class="flex items-center gap-2.5 min-h-13 py-0 px-3.5 border border-solid border-[color:light-dark(#dce1e8,var(--color-night-line))] rounded-[calc(var(--group-radius)_-_--spacing(4))] bg-canvas [transition:border-color_150ms,_box-shadow_150ms] focus-within:border-brand focus-within:shadow-[0_0_0_3px_rgb(21_93_252_/_.12)] [&.error-border]:border-[#c93737] [&:has([aria-invalid=true])]:border-[#c93737] [&_svg]:shrink-0 [&_svg]:text-[color:light-dark(#7c8795,var(--color-night-muted))] [&_input]:w-full [&_input]:min-w-0 [&_input]:min-h-12.5 [&_input]:py-3 [&_input]:px-0 [&_input]:border-0 [&_input]:bg-transparent [&_input]:text-[color:light-dark(#202a37,var(--color-night-ink))] [&_input]:text-[length:16px] [&_input]:font-normal [&_input]:leading-[1.5] [&_input::placeholder]:text-[color:light-dark(#6b7685,var(--color-night-copy))] [&_input::placeholder]:opacity-[1] [&_input:autofill]:shadow-[0_0_0_1000px_var(--color-canvas)_inset]" id="trackingInputWrapper" data-field-frame>{% include icons.html name='package' size=18 %}<input type="text" id="trackingOrderId" data-modal-draft aria-describedby="trackingHint" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" enterkeyhint="go" placeholder="მაგ. TNENKAElectronics…"></div>
      <p id="trackingHint" class="mt-2 mr-0 mb-5 ml-0 text-[length:12px] leading-[1.7] text-[color:light-dark(#637082,var(--color-night-copy))] [.modal-search-controls_&]:mb-4">ჩასვით ნომერი სრულად ან TNENKAElectronics პრეფიქსის გარეშე.</p>
      <button type="button" id="trackingCheckBtn" class="[.listing-filter-actions_&]:min-w-0 [.listing-filter-actions_&]:px-3 [.listing-filter-actions_&]:text-[length:14px] inline-flex items-center justify-center gap-2.5 w-full min-h-12.5 py-3 px-4.5 border border-solid border-transparent rounded-[calc(var(--group-radius)_-_--spacing(4))] bg-brand text-white text-[length:15px] font-semibold leading-[1.6] cursor-pointer text-center no-underline [transition:background-color_150ms] active:bg-[#1046c7] disabled:bg-[#416fcb] disabled:cursor-wait [.modal-empty_&]:w-auto [.modal-empty_&]:min-w-45 [@media(hover:_hover)]:hover:bg-[#104ed8]">შემოწმება</button>
      </div>
      <div id="trackingResult" hidden class="mt-5 text-[color:light-dark(#475569,var(--color-night-copy))] text-[length:13px] leading-[1.8] [overflow-wrap:anywhere]"></div>
      <p id="trackingFeedback" class="sr-only" role="status" aria-atomic="true"></p>
    </div></div>
</div>
