<div class="modal hidden" id="linkModal" role="dialog" aria-labelledby="linkModalTitle" aria-hidden="true" aria-describedby="linkModalHint">
  <div class="modal-panel"><header class="modal-header"><div class="modal-heading"><h2 id="linkModalTitle" class="modal-title" tabindex="-1" data-modal-initial-focus>პროდუქტის ბმული</h2></div>{% include modals/close-button.html %}</header>
    <div class="modal-body">
      <p id="linkModalHint" class="modal-field-help">ავტომატური კოპირება ვერ მოხერხდა. მონიშნეთ და დააკოპირეთ ბმული.</p>
      <label for="copiedLinkText" class="modal-field-label">ბმული</label>
      <textarea id="copiedLinkText" class="modal-copy-value" rows="3" readonly spellcheck="false" onclick="this.select()"></textarea>
    </div>
    <footer class="modal-footer"><button type="button" class="modal-button modal-button--secondary" data-close-modal>დახურვა</button></footer></div>
</div>
