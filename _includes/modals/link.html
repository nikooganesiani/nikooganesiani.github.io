<div class="modal fixed inset-0 bg-slate-900/40 backdrop-blur-[8px] z-[9999] hidden justify-center items-center opacity-0 transition-opacity duration-400 p-4 [&.active]:opacity-100 group" id="linkModal">
    <div class="bg-white max-w-[440px] w-full rounded-3xl p-6 max-h-[90vh] overflow-y-auto overflow-x-hidden transform scale-90 translate-y-5 opacity-0 transition-all duration-400 ease-[cubic-bezier(0.34,1.56,0.64,1)] group-[.active]:scale-100 group-[.active]:translate-y-0 group-[.active]:opacity-100 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden border-none shadow-none text-center">
        <div class="flex items-center justify-between gap-3 mb-4"><h3 class="text-lg font-bold text-slate-900">პროდუქტის ბმული</h3><button type="button" class="modal-close" data-close-modal aria-label="დახურვა">{% include icons.html name='close' size=20 %}</button></div>
        <div class="bg-slate-100 p-4 rounded-xl break-all text-[0.9rem] text-blue-600 font-semibold select-all" id="copiedLinkText"></div>
    </div>
</div>
