<style>
    #mobileBottomBar #buyButton {
        max-width: 0;
        opacity: 0;
        padding-left: 0;
        padding-right: 0;
        margin-left: 0;
        pointer-events: none;
        overflow: hidden;
        transition: 
            max-width 0.3s cubic-bezier(0.22, 1, 0.36, 1),
            padding 0.3s cubic-bezier(0.22, 1, 0.36, 1),
            margin 0.3s cubic-bezier(0.22, 1, 0.36, 1),
            opacity 0.22s ease,
            transform 0.15s ease;
    }
    #mobileBottomBar #buyButton.is-visible {
        max-width: 140px;
        opacity: 1;
        padding-left: 14px;
        padding-right: 14px;
        margin-left: 6px;
        pointer-events: auto;
    }
    .delivery-pill {
        background-color: #e3f3e8;
        color: #115e36;
    }
</style>

<div id="mobileBottomBar" 
     class="hidden max-sm:flex print:hidden fixed bottom-[calc(var(--mobile-nav-height)+10px)] left-2 right-2 bg-white/95 backdrop-blur-[10px] border border-slate-200 rounded-2xl p-2 z-[90] items-center justify-between gap-2 shadow-[0_10px_25px_-5px_rgba(0,0,0,0.1)]">
    
    <div class="flex items-center gap-2.5 flex-1 min-w-0">
        <img src="{{ page.images[0] }}" 
             class="w-[42px] h-[42px] rounded-[9px] object-contain bg-transparent border-none flex-shrink-0" 
             alt="Product" 
             width="84" 
             height="84" 
             loading="lazy">

        <div class="flex-1 flex flex-col justify-between min-w-0 h-[42px]">
            <div class="flex items-baseline gap-1.5 truncate">
                <div class="font-bold text-blue-600 text-[1.1rem] leading-none">
                    {{ page.price | replace: '₾', '' }}₾
                </div>
                {% if page.oldPrice != "" and page.oldPrice != nil %}
                <div class="font-bold text-[1.1rem] leading-none line-through decoration-slate-400 decoration-[1px] text-slate-400">
                    {{ page.oldPrice | replace: '₾', '' }}₾
                </div>
                {% endif %}
            </div>

            <div class="delivery-pill inline-flex items-center gap-1 px-2 py-[3px] rounded-[6px] w-fit max-w-full">
                <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="3" width="14" height="13" rx="1"></rect>
                    <polygon points="15 8 19 8 23 12 23 16 15 16 15 8"></polygon>
                    <circle cx="5.5" cy="18.5" r="2.5"></circle>
                    <circle cx="18.5" cy="18.5" r="2.5"></circle>
                </svg>
                <span class="text-[0.65rem] font-bold leading-none truncate">უფასო მიწოდება</span>
            </div>
        </div>
    </div>

    <div class="flex items-center flex-shrink-0" id="actionButtons">
        <button type="button"
                class="w-[38px] h-[42px] rounded-[9px] bg-transparent text-slate-500 flex items-center justify-center border-none outline-none transition-all duration-200 cursor-pointer active:scale-90" 
                aria-label="გაზიარება" 
                onclick="copyProductLink(this)" 
                title="გაზიარება">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
        </button>

        <button type="button"
                class="w-[38px] h-[42px] rounded-[9px] bg-transparent text-slate-500 flex items-center justify-center border-none outline-none transition-all duration-200 cursor-pointer active:scale-90 ml-0.5 btn-fav [&.active]:text-red-500 [&.active_svg]:fill-current" 
                aria-label="დამატება რჩეულებში" 
                onclick="toggleFav(event, this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" class="[&.active>svg]:fill-current">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
        </button>

        <button type="button"
                class="bg-blue-600 text-white border-none rounded-[9px] h-[42px] font-bold flex items-center justify-center gap-1.5 text-[0.9rem] cursor-pointer active:scale-95 whitespace-nowrap" 
                id="buyButton" 
                aria-label="ყიდვა" 
                onclick="scrollToForm()">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                <path d="M3 6h18"></path>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span class="flex-shrink-0">ყიდვა</span>
        </button>
    </div>
</div>

<script>
(function() {
    const buyButton = document.getElementById('buyButton');
    const bar = document.getElementById('mobileBottomBar');
    if (!buyButton || !bar) return;

    let isButtonVisible = false;
    let ticking = false;

    function showBuyButton() {
        if (isButtonVisible) return;
        isButtonVisible = true;
        buyButton.classList.add('is-visible');
    }

    function hideBuyButton() {
        if (!isButtonVisible) return;
        isButtonVisible = false;
        buyButton.classList.remove('is-visible');
    }

    function checkScroll() {
        const windowHeight = window.innerHeight;
        const buyButtonForm = document.querySelector('form[data-buy-form], #orderForm, form.order-form, .order-form, #buyForm, form');

        if (buyButtonForm) {
            const formRect = buyButtonForm.getBoundingClientRect();
            if (formRect.top < windowHeight && formRect.bottom > 0) {
                hideBuyButton();
            } else {
                showBuyButton();
            }
        } else {
            const barRect = bar.getBoundingClientRect();
            if (barRect.top < windowHeight && barRect.bottom > windowHeight * 0.3) {
                showBuyButton();
            } else {
                hideBuyButton();
            }
        }
        ticking = false;
    }

    function onScroll() {
        if (!ticking) {
            window.requestAnimationFrame(checkScroll);
            ticking = true;
        }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    document.addEventListener('DOMContentLoaded', checkScroll);

    setTimeout(checkScroll, 100);
    setTimeout(checkScroll, 500);
    checkScroll();
})();
</script>
