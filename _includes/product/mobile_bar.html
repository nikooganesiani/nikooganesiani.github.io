<div id="mobileBottomBar" class="product-mobile-bar print:hidden hidden max-[640px]:grid max-[640px]:grid-cols-[minmax(0,_1fr)_auto] max-[640px]:items-center max-[640px]:fixed max-[640px]:z-[90] max-[640px]:bottom-[var(--mobile-nav-height)] max-[640px]:inset-x-0 max-[640px]:min-h-14 max-[640px]:py-1.5 max-[640px]:[padding-inline:max(6px,_env(safe-area-inset-left,_0px))_max(6px,_env(safe-area-inset-right,_0px))] max-[640px]:gap-3 max-[640px]:bg-brand max-[640px]:text-white max-[640px]:shadow-[0_-4px_20px_rgb(15_23_42_/_6%)] motion-reduce:[&_*]:[transition:none]! motion-reduce:[&_*]:[animation-duration:.01ms]! print:hidden!" aria-label="პროდუქტის შეძენა">
  <div class="flex min-w-0 flex-col items-start gap-1 [&_strong]:text-white [&_strong]:text-[length:20px] [&_strong]:font-[650] [&_strong]:tracking-[-.035em] [&_strong]:leading-[1.2] [&_strong]:[overflow-wrap:anywhere] [&_strong]:tabular-nums [&_del]:text-white/80 [&_del]:text-[length:13px] [&_del]:leading-[1.2] [&_del]:[text-decoration-thickness:1px] [&_del]:tabular-nums">
    <div class="flex flex-wrap items-baseline gap-y-0.5 gap-x-1.5"><strong data-product-price>{% if product_price > 0 %}{{ product_price }} ₾{% else %}ფასი ზუსტდება{% endif %}</strong><del data-product-old-price {% unless product_old_price > product_price and product_price > 0 %}hidden{% endunless %}>{{ page.oldPrice | remove: '₾' | escape }} ₾</del></div>
    <span class="inline-flex items-center gap-1 max-w-full min-h-4 text-white text-[length:10px] font-medium leading-[1.4] [&_>_span]:overflow-hidden [&_>_span]:text-ellipsis [&_>_span]:whitespace-nowrap" data-product-delivery {% unless product_available %}hidden{% endunless %}>{% include icons.html name='truck' size=14 %}<span>უფასო მიწოდება</span></span>
    <span class="product-mobile-stock text-white/90 text-[length:11px] leading-[1.5] [overflow-wrap:anywhere]" data-product-stock data-stock="{{ product_stock | escape }}" {% if product_available %}hidden{% endif %}>{{ product_stock_label }}</span>
  </div>
  <div class="product-mobile-actions flex items-center gap-0.5">
    <button type="button" class="w-11 h-11 inline-flex items-center justify-center shrink-0 rounded-full bg-transparent text-white cursor-pointer transition-colors hover:bg-canvas/15 active:scale-95 max-[400px]:hidden" aria-label="ბმულის გაზიარება" onclick="copyProductLink(this)">{% include icons.html name='share' size=18 %}</button>
    <button type="button" class="btn-fav w-11 h-11 inline-flex items-center justify-center shrink-0 rounded-full bg-transparent text-white cursor-pointer transition-colors hover:bg-canvas/15 active:scale-95 [&.active]:text-[color:light-dark(#ffe0e7,var(--color-night-danger))] [&.active_svg]:fill-current max-[360px]:hidden" aria-label="დამატება რჩეულებში" aria-pressed="false" onclick="toggleFav(event, this)">{% include icons.html name='heart' size=20 %}</button>
    <button type="button" class="inline-flex items-center justify-center gap-1.5 min-w-22 min-h-11 py-2.5 px-3 border border-solid border-transparent rounded-[9px] text-accent bg-canvas text-[length:13px] font-semibold whitespace-nowrap cursor-pointer transition-colors hover:bg-[color:light-dark(var(--color-blue-50),var(--color-night-blue))] active:translate-y-px disabled:text-[color:light-dark(#8b93a0,var(--color-night-muted))] disabled:bg-[color:light-dark(#e9ecf1,var(--color-night-blue))] disabled:cursor-default" id="buyButton" onclick="scrollToForm()">{% include icons.html name='bag' size=18 %}<span id="mobileBuyLabel">{% if product_available %}ყიდვა{% else %}დეტალურად{% endif %}</span></button>
  </div>
</div>
