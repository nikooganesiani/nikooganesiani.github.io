<div class="hidden max-sm:flex fixed bottom-[calc(75px+env(safe-area-inset-bottom))] left-2 right-2 bg-white/95 backdrop-blur-[10px] border border-slate-200 rounded-2xl p-2.5 z-[90] items-center gap-2 shadow-[0_10px_25px_-5px_rgba(0,0,0,0.1)]" id="mobileBottomBar">
    <img src="{{ page.images[0] }}" class="w-10 h-10 rounded-lg object-contain bg-transparent border-none" alt="Product" width="80" height="80" loading="lazy">
    <div class="flex-1 flex flex-col justify-center overflow-hidden">
        <div class="flex items-baseline gap-1.5">
            <div class="font-bold text-blue-600 text-[1.1rem] leading-none">{{ page.price | replace: '₾', '' }}₾</div>
            {% if page.oldPrice != "" and page.oldPrice != nil %}
            <div class="text-[1.1rem] line-through decoration-slate-400 decoration-[1px] text-slate-400">{{ page.oldPrice | replace: '₾', '' }}₾</div>
            {% endif %}
        </div>
        <div class="text-[0.6rem] text-[#0A5733] font-bold flex items-center gap-1 mt-0.5">
           უფასო მიწოდება
        </div>
    </div>
    <div class="flex gap-1.5 items-center" id="actionButtons">
        <button class="w-9 h-9 rounded-lg bg-transparent text-slate-500 flex items-center justify-center border-none outline-none transition-all duration-200 cursor-pointer active:scale-90" aria-label="გაზიარება" onclick="copyProductLink(this)" title="გაზიარება">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
        <button class="w-9 h-9 rounded-lg bg-transparent text-slate-500 flex items-center justify-center border-none outline-none transition-all duration-200 cursor-pointer active:scale-90 btn-fav [&.active]:text-red-500" aria-label="დამატება რჩეულებში" onclick="toggleFav(event, this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="[&.active>svg]:fill-current"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </button>
        <button class="bg-blue-600 text-white border-none rounded-lg px-4 h-9 font-bold flex items-center gap-1.5 text-[0.9rem] transition-all duration-300 cursor-pointer active:scale-95 origin-right" id="buyButton" aria-label="ყიდვა" onclick="scrollToForm()" style="width: 0; padding-left: 0; padding-right: 0; margin: 0; opacity: 0; overflow: hidden; white-space: nowrap; border: none; min-width: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span class="flex-shrink-0">ყიდვა</span>
        </button>
    </div>
</div>

<script>
(function() {
    const buyButton = document.getElementById('buyButton');
    if (!buyButton) return;

    let isButtonVisible = false;

    function showBuyButton() {
        if (isButtonVisible) return;
        isButtonVisible = true;
        buyButton.style.width = '';
        buyButton.style.paddingLeft = '';
        buyButton.style.paddingRight = '';
        buyButton.style.margin = '';
        buyButton.style.opacity = '1';
        buyButton.style.overflow = 'visible';
    }

    function hideBuyButton() {
        if (!isButtonVisible) return;
        isButtonVisible = false;
        buyButton.style.width = '0';
        buyButton.style.paddingLeft = '0';
        buyButton.style.paddingRight = '0';
        buyButton.style.margin = '0';
        buyButton.style.opacity = '0';
        buyButton.style.overflow = 'hidden';
    }

    function checkScroll() {
        const bar = document.getElementById('mobileBottomBar');
        if (!bar) return;

        const barRect = bar.getBoundingClientRect();
        const windowHeight = window.innerHeight;
        
        const buyButtonForm = document.querySelector('form[data-buy-form], #orderForm, form.order-form, .order-form, #buyForm, form');

        if (buyButtonForm) {
            const formRect = buyButtonForm.getBoundingClientRect();
            if (formRect.top < windowHeight && formRect.bottom > 0) {
                hideBuyButton();
            } else if (formRect.top >= windowHeight || formRect.bottom <= 0) {
                showBuyButton();
            }
        } else {
            if (barRect.top < windowHeight && barRect.bottom > windowHeight * 0.3) {
                showBuyButton();
            } else if (barRect.bottom <= windowHeight * 0.3) {
                hideBuyButton();
            }
        }
    }

    window.addEventListener('scroll', checkScroll, { passive: true });
    window.addEventListener('resize', checkScroll, { passive: true });

    setTimeout(checkScroll, 100);
    setTimeout(checkScroll, 500);
    setTimeout(checkScroll, 1000);

    document.addEventListener('DOMContentLoaded', checkScroll);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        checkScroll();
    }
})();
</script>
