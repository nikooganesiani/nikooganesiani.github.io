<nav aria-label="ნავიგაციის ჯაჭვი" class="mb-5">
  <ol itemscope itemtype="https://schema.org/BreadcrumbList" class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs sm:text-sm text-slate-500">
    <li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"><a itemprop="item" href="/" class="inline-flex items-center min-h-8 hover:text-blue-700"><span itemprop="name">მთავარი</span></a><meta itemprop="position" content="1"></li>
    {% if first_cat and cat_name %}<li aria-hidden="true">/</li><li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"><a itemprop="item" href="/category/?{{ first_cat | url_encode }}" class="inline-flex items-center min-h-8 hover:text-blue-700"><span itemprop="name">{{ cat_name | escape }}</span></a><meta itemprop="position" content="2"></li>{% endif %}
    {% if first_cat and first_sub and sub_name %}<li aria-hidden="true">/</li><li itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"><a itemprop="item" href="/category/?{{ first_cat | url_encode }}&amp;sub={{ first_sub | url_encode }}" class="inline-flex items-center min-h-8 hover:text-blue-700"><span itemprop="name">{{ sub_name | escape }}</span></a><meta itemprop="position" content="3"></li>{% endif %}
  </ol>
</nav>
