<div class="flex flex-col opacity-0 animate-[fadeUp_0.5s_ease_forwards_0.2s]">
    <style>
        #dynamicFormInputs .relative > span.absolute {
            margin-top: 2px !important;
        }
    </style>
    <div class="sticky top-6 flex flex-col gap-4 rounded-3xl" id="stickyBuyBox">
        <form id="inlineOrderForm" novalidate class="flex flex-col gap-3 w-full">
            <div class="flex flex-col gap-2.5 mb-1">
                <div class="inline-flex flex-col items-start justify-center min-w-[120px] shrink-0 gap-1.5 max-sm:hidden pb-1">
                    <div class="flex items-center gap-4">
                        <div class="text-[1.8rem] font-bold text-blue-700 leading-none tracking-tight flex items-center">
                            {{ page.price | replace: '₾', '' }}<span class="text-inherit font-bold ml-0.5">₾</span>
                        </div>
                        {% if page.oldPrice != "" and page.oldPrice != nil %}
                        <div class="text-[1.1rem] font-bold flex items-center leading-none tracking-tight line-through decoration-red-500 decoration-[3px] text-slate-400 m-0">{{ page.oldPrice | replace: '₾', '' }}₾</div>
                        {% endif %}
                    </div>
                    <div class="flex items-center gap-1.5 text-[0.85rem] font-bold text-[#0A5733] bg-green-600/10 px-2.5 py-1 rounded-lg mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg> 
                        უფასო მიწოდება
                    </div>
                </div>
            </div>
            
            <div id="dynamicFormInputs" class="flex flex-col gap-3"></div>
            <div id="dynamicBuyButton" class="w-full flex flex-col gap-3"></div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('inlineOrderForm');
    if (form) {
        const observer = new MutationObserver(() => {
            const spans = form.querySelectorAll('span');
            spans.forEach(span => {
                if (span.textContent.trim() === '+995') {
                    span.style.display = 'inline-block';
                    span.style.transform = 'translateY(1.5px)';
                }
            });
        });
        observer.observe(form, { childList: true, subtree: true });
    }
});
</script>
