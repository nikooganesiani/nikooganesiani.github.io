<div id="imageZoomModal" class="modal modal--gallery hidden {% include modals/classes.html part='overlay' %} motion-reduce:[&_*]:[transition:none]! motion-reduce:[&_*]:[animation-duration:.01ms]!" role="dialog" aria-labelledby="zoomTitle" aria-hidden="true" tabindex="-1">
  <div class="flex flex-col w-full h-full min-h-0">
    <header class="modal-header flex shrink-0 items-center gap-3 border-b border-line">
      <h2 id="zoomTitle" class="min-w-0 flex-1 truncate text-sm font-medium text-ink focus:[outline:none]!" tabindex="-1" data-modal-initial-focus data-product-name>{{ product_name | escape }}</h2>
      <span class="whitespace-nowrap text-xs tabular-nums text-muted" id="zoomCounter" role="status" aria-live="polite" aria-atomic="true">1 / {{ product_photos.size }}</span>
      {% include modals/close-button.html label="გალერეის დახურვა" %}
    </header>
    <div id="modalTrack" class="flex w-full bg-page overflow-x-auto overflow-y-hidden snap-x snap-mandatory overscroll-x-contain [scrollbar-width:none] [&::-webkit-scrollbar]:hidden flex-1 min-h-0" tabindex="0" role="group" aria-label="გადიდებული ფოტოები">
      {% for img in product_photos %}<div class="flex min-w-0 basis-full shrink-0 snap-start items-center justify-center p-4 min-[769px]:p-6"><img class="h-auto max-h-full w-auto max-w-full select-none object-contain dark:rounded-media dark:bg-white" src="{{ img | escape }}" data-catalog-content alt="{{ product_name | escape }} — ფოტო {{ forloop.index }}" width="1200" height="1200" loading="lazy" draggable="false" onerror="this.onerror=null;this.src='/img/no-image.svg'"></div>{% endfor %}
    </div>
    <div class="product-zoom-footer flex shrink-0 items-center justify-center gap-3 border-t border-line pt-(--modal-close-inset) pr-[max(var(--modal-close-inset),env(safe-area-inset-right))] pb-[max(var(--modal-close-inset),env(safe-area-inset-bottom))] pl-[max(var(--modal-close-inset),env(safe-area-inset-left))]">
      <button type="button" class="inline-flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-control bg-surface text-ink hover:text-accent" data-zoom-direction="-1" aria-label="წინა ფოტო" {% if product_photos.size <= 1 %}hidden{% endif %}>{% include icons.html name='chevron-left' size=20 class='rtl:rotate-180' %}</button>
      <div id="modalThumbStrip" class="product-thumbnails flex min-w-0 gap-2 overflow-x-auto" role="group" aria-label="გადიდებული ფოტოს არჩევა">{% for img in product_photos %}<button type="button" class="flex size-14 shrink-0 items-center justify-center overflow-hidden rounded-control border-2 border-line bg-white p-1 aria-pressed:border-brand hover:border-accent focus-visible:outline-offset-[-4px] [&_img]:size-full [&_img]:object-contain" data-zoom-index="{{ forloop.index0 }}" aria-label="გადიდებული ფოტო {{ forloop.index }}" aria-pressed="false">{% include product/thumbnail.html image=img size=48 %}</button>{% endfor %}</div>
      <button type="button" class="inline-flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-control bg-surface text-ink hover:text-accent" data-zoom-direction="1" aria-label="შემდეგი ფოტო" {% if product_photos.size <= 1 %}hidden{% endif %}>{% include icons.html name='chevron-right' size=20 class='rtl:rotate-180' %}</button>
    </div>
  </div>
</div>
