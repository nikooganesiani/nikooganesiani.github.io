<div id="imageZoomModal" class="modal modal--gallery hidden {% include modals/classes.html part='overlay' %} motion-reduce:[&_*]:[transition:none]! motion-reduce:[&_*]:[animation-duration:.01ms]!" role="dialog" aria-labelledby="zoomTitle" aria-hidden="true" tabindex="-1">
  <div class="flex flex-col w-full h-full min-h-0">
    <div class="flex shrink-0 items-center gap-6 pt-[max(18px,_env(safe-area-inset-top))] pr-[max(28px,_env(safe-area-inset-right))] pb-4.5 pl-[max(28px,_env(safe-area-inset-left))] border-b border-solid border-b-[color:light-dark(#f0f2f5,var(--color-night-line))] max-[768px]:pt-[max(12px,_env(safe-area-inset-top))] max-[768px]:pr-[max(16px,_env(safe-area-inset-right))] max-[768px]:pb-3 max-[768px]:pl-[max(16px,_env(safe-area-inset-left))] max-[768px]:gap-3"><h2 id="zoomTitle" class="flex-1 min-w-0 m-0 overflow-hidden text-ellipsis whitespace-nowrap text-[color:light-dark(#475569,var(--color-night-copy))] text-[length:14px] font-medium focus:[outline:none]! max-[768px]:text-[length:12px]" tabindex="-1" data-modal-initial-focus data-product-name>{{ product_name | escape }}</h2><span class="text-muted text-[length:12px] tabular-nums whitespace-nowrap" id="zoomCounter" role="status" aria-live="polite" aria-atomic="true">1 / {{ product_photos.size }}</span>{% include modals/close-button.html label="გალერეის დახურვა" %}</div>
    <div id="modalTrack" class="flex w-full bg-page overflow-x-auto overflow-y-hidden snap-x snap-mandatory overscroll-x-contain [scrollbar-width:none] [&::-webkit-scrollbar]:hidden flex-1 min-h-0" tabindex="0" role="group" aria-label="გადიდებული ფოტოები">
      {% for img in product_photos %}<div class="flex [flex:0_0_100%] min-w-0 items-center justify-center py-6 px-12 snap-start [&_img]:w-full [&_img]:h-full [&_img]:object-contain dark:[&_img]:bg-white dark:[&_img]:rounded-media [&_img]:select-none max-[768px]:p-4"><img src="{{ img | escape }}" data-catalog-content alt="{{ product_name | escape }} — ფოტო {{ forloop.index }}" width="1200" height="1200" loading="lazy" draggable="false" onerror="this.onerror=null;this.src='/img/no-image.svg'"></div>{% endfor %}
    </div>
    <div class="product-zoom-footer flex shrink-0 items-center justify-center gap-5 pt-3 pr-[max(24px,_env(safe-area-inset-right))] pb-[max(18px,_env(safe-area-inset-bottom))] pl-[max(24px,_env(safe-area-inset-left))] border-t border-solid border-t-[color:light-dark(#f0f2f5,var(--color-night-line))] max-[768px]:gap-2 max-[768px]:pl-2.5 max-[768px]:pr-2.5">
      <button type="button" class="carousel-arrow inline-flex size-11 shrink-0 items-center justify-center rounded-full border border-line bg-surface text-ink hover:border-accent" data-zoom-direction="-1" aria-label="წინა ფოტო" {% if product_photos.size <= 1 %}hidden{% endif %}>{% include icons.html name='chevron-left' size=20 %}</button>
      <div id="modalThumbStrip" class="product-thumbnails flex min-w-0 gap-2 overflow-x-auto p-1" role="group" aria-label="გადიდებული ფოტოს არჩევა">{% for img in product_photos %}<button type="button" class="flex size-14 shrink-0 items-center justify-center overflow-hidden rounded-media border-2 border-line bg-white p-1 aria-pressed:border-brand hover:border-accent [&_img]:size-full [&_img]:object-contain" data-zoom-index="{{ forloop.index0 }}" aria-label="გადიდებული ფოტო {{ forloop.index }}" aria-pressed="false">{% include product/thumbnail.html image=img size=48 %}</button>{% endfor %}</div>
      <button type="button" class="carousel-arrow inline-flex size-11 shrink-0 items-center justify-center rounded-full border border-line bg-surface text-ink hover:border-accent" data-zoom-direction="1" aria-label="შემდეგი ფოტო" {% if product_photos.size <= 1 %}hidden{% endif %}>{% include icons.html name='chevron-right' size=20 %}</button>
    </div>
  </div>
</div>
