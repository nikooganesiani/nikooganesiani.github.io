<!-- Подключаем скрипт lite-youtube в head или в начало body -->
<script type="module" src="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.3/src/lite-yt-embed.js" defer></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.3/src/lite-yt-embed.css" />

<div class="mt-6 opacity-0 animate-[fadeUp_0.5s_ease_forwards_0.3s]">
    <div class="flex flex-col lg:grid lg:grid-cols-2 gap-6 lg:gap-10 items-start">
        
        <!-- Спецификации -->
        <div>
            <h2 class="text-[1.4rem] mb-5 font-bold text-slate-900 flex items-center gap-2.5 tracking-tight">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                სპეციფიკაციები
            </h2>
            <div class="relative max-h-[280px] overflow-hidden transition-[max-height] duration-400 ease-in-out group [&.expanded]:max-h-[3000px]" id="specsBlock">
                <div class="flex flex-col gap-1.5">
                    {% for spec in page.specs %}
                    <div class="flex max-sm:flex-col max-sm:items-start max-sm:gap-1 items-center py-2.5 max-sm:py-3 bg-transparent transition-colors duration-300">
                        <div class="flex-1 text-slate-600 text-[0.9rem] font-semibold">{{ spec[0] }}</div>
                        <div class="flex-1 text-slate-900 font-bold text-[0.9rem] max-sm:text-[0.85rem] text-right max-sm:text-left">{{ spec[1] }}</div>
                    </div>
                    {% endfor %}
                </div>
                <div class="absolute bottom-0 left-0 right-0 h-[100px] bg-gradient-to-t from-slate-50 to-transparent pointer-events-none transition-opacity duration-300 group-[.expanded]:opacity-0"></div>
            </div>
            <button class="bg-transparent border-none text-blue-600 font-bold text-[0.95rem] cursor-pointer mb-2 hidden transition-all duration-300 outline-none hover:text-blue-700 active:scale-95" id="btnExpandSpecs" aria-label="მეტის ნახვა" onclick="toggleExpand('specsBlock', this)">მეტის ნახვა</button>
        </div>

        <!-- Описание и Видео -->
        <div class="max-lg:border-t max-lg:border-slate-100 max-lg:pt-6">
            <h3 class="text-[1.4rem] mb-5 font-bold text-slate-900 flex items-center gap-2.5 tracking-tight">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                პროდუქტის აღწერა
            </h3>
            <div class="leading-relaxed text-slate-600 text-[1rem] font-medium whitespace-pre-line mt-4 selection:bg-blue-200/50">{{ page.longDescription }}</div>
            
            {% if yt_id != "" %}
            <div class="mt-8">
                <h3 class="text-[1.4rem] mb-5 font-bold text-slate-900 flex items-center gap-2.5 tracking-tight">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
                    ვიდეო განხილვა
                </h3>
                <div class="rounded-2xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.1)]">
                    <lite-youtube 
                        videoid="{{ yt_id }}" 
                        playlabel="Play Video"
                        style="background-image: url('https://i.ytimg.com/vi/{{ yt_id }}/maxresdefault.jpg');"
                    ></lite-youtube>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
function toggleExpand(blockId, button) {
    const block = document.getElementById(blockId);
    if (block) {
        block.classList.toggle('expanded');
        if (button) {
            button.textContent = block.classList.contains('expanded') ? 'ნაკლების ნახვა' : 'მეტის ნახვა';
        }
    }
}

// Показать кнопку "Показать больше", если контент превышает максимальную высоту
document.addEventListener('DOMContentLoaded', function() {
    const specBlock = document.getElementById('specsBlock');
    const btnExpand = document.getElementById('btnExpandSpecs');
    
    if (specBlock && btnExpand) {
        if (specBlock.scrollHeight > 280) {
            btnExpand.style.display = 'block';
        }
    }
    
    // Инициализация lite-youtube для динамического контента
    if (window.liteYoutube) {
        window.liteYoutube.init();
    }
});
</script>
