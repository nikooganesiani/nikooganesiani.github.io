---
layout: default
title: "მთავარი"
---

<style>
    .categories-bar { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; position: relative; z-index: 20; }
    .categories-wrapper { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; margin-right: -1.5rem; }
    
    .categories, .subcategories { 
        display: flex; gap: 0.8rem; flex-wrap: nowrap; 
        padding: 1.5rem 2.5rem 1.5rem 0.5rem; margin: -1rem 0; 
        overflow-x: auto; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none;
    }
    .categories::-webkit-scrollbar, .subcategories::-webkit-scrollbar { display: none; }

    .category-btn {
        background: white; border: 1px solid #e2e8f0; padding: 0.7rem 1.4rem;
        border-radius: 2rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; color: #64748b;
        display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; transition: 0.3s;
    }
    .category-btn svg { width: 18px; height: 18px; }
    .category-btn:hover { border-color: #2563eb; color: #2563eb; transform: translateY(-2px); }
    .category-btn.active { background: #0f172a; color: white; border-color: #0f172a; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2); }
    
    .subcategories-bar { max-width: 1280px; margin: -0.5rem auto 1rem auto; padding: 0 1.5rem; display: none; position: relative; z-index: 15; }
    .subcategories { padding: 0.5rem 2.5rem 0.5rem 0.5rem; }
    .sub-category-btn {
        background: transparent; border: 1px solid #cbd5e1; padding: 0.5rem 1rem;
        border-radius: 2rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; color: #475569;
        white-space: nowrap; flex-shrink: 0; transition: 0.2s;
    }
    .sub-category-btn:hover { background: #f1f5f9; color: #0f172a; }
    .sub-category-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.8rem; margin-bottom: 3rem; }
    .product-card {
        background: white; border-radius: 2.2rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03); 
        transition: 0.4s; display: flex; flex-direction: column; border: 1px solid #f1f5f9; height: 100%;
    }
    .product-card:hover { border-color: #e2e8f0; transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08); }
    .product-image-wrapper { position: relative; width: 100%; height: 260px; overflow: hidden; background: white; }
    .product-images-track { display: flex; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
    .product-slide { flex: 0 0 100%; width: 100%; height: 100%; padding: 1.5rem; display: flex; align-items: center; justify-content: center; }
    .product-image { max-width: 100%; max-height: 100%; object-fit: contain; }
    .product-info { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }
    .product-name-box { background: #f8fafc; border-radius: 1.2rem; padding: 1rem; height: 4.2rem; display: flex; align-items: center; margin-bottom: 1.2rem; border: 1px solid #f1f5f9; cursor: pointer; transition: 0.3s; }
    .product-name { font-size: 1rem; font-weight: 800; color: #0f172a; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price-container { display: flex; align-items: baseline; gap: 10px; margin-bottom: 1.2rem; padding: 0 0.5rem; }
    .product-price { font-size: 1.8rem; font-weight: 900; color: #2563eb; }
    .old-price { text-decoration: line-through; color: #94a3b8; font-size: 1rem; font-weight: 700; }
    
    .btn-order { background: #0f172a; color: white; border: none; padding: 1.1rem; border-radius: 1.2rem; font-weight: 800; font-size: 1.05rem; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-order:hover { background: #2563eb; transform: translateY(-2px); }

    /* Прочие стили из старой версии опущены для лаконичности (можно перенести фильтры) */
</style>

<!-- ДИНАМИЧЕСКИЙ БЛОК ГЛАВНЫХ КАТЕГОРИЙ -->
<div class="categories-bar">
    <div class="categories-wrapper">
        <div class="categories" id="dynamicCategories">
            <!-- Будет заполнено JS -->
        </div>
    </div>
</div>

<!-- ДИНАМИЧЕСКИЙ БЛОК ПОДКАТЕГОРИЙ -->
<div class="subcategories-bar" id="dynamicSubcategoriesBar">
    <div class="categories-wrapper">
        <div class="subcategories" id="dynamicSubcategories">
            <!-- Будет заполнено JS -->
        </div>
    </div>
</div>

<main>
    <div class="container">
        <!-- КАТАЛОГ -->
        <div class="catalog" id="catalogContainer"></div>
    </div>
</main>

<script>
    let currentCategory = 'all';
    let currentSubcategory = 'all';
    const container = document.getElementById('catalogContainer');
    const catContainer = document.getElementById('dynamicCategories');
    const subCatBar = document.getElementById('dynamicSubcategoriesBar');
    const subCatContainer = document.getElementById('dynamicSubcategories');

    // Функция вызывается из default.html когда база готова
    window.initIndexCatalog = function() {
        renderCategoryButtons();
        
        // Проверка параметров URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlCat = urlParams.get('category');
        const urlSub = urlParams.get('sub');

        if (urlCat && window.DynamicCatalog.categories.has(urlCat)) {
            currentCategory = urlCat;
            const btn = document.querySelector(`.category-btn[data-cat="${urlCat}"]`);
            if(btn) { setActiveBtn(catContainer, btn); setTimeout(() => btn.scrollIntoView({inline: 'center'}), 100); }
        }

        renderSubCategoryButtons(currentCategory);

        if (urlSub && currentSubcategory !== 'all') {
            currentSubcategory = urlSub;
            const btn = document.querySelector(`.sub-category-btn[data-sub="${urlSub}"]`);
            if(btn) { setActiveBtn(subCatContainer, btn); setTimeout(() => btn.scrollIntoView({inline: 'center'}), 200); }
        }

        renderProducts();
    };

    function renderCategoryButtons() {
        let html = `<button class="category-btn active" data-cat="all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg> 
            ყველაფერი
        </button>`;

        window.DynamicCatalog.categories.forEach(catId => {
            const info = window.ShopCategories[catId] || window.ShopCategories["default"];
            html += `<button class="category-btn" data-cat="${catId}">${info.icon} ${info.name || catId}</button>`;
        });

        catContainer.innerHTML = html;

        catContainer.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setActiveBtn(catContainer, btn);
                currentCategory = btn.dataset.cat;
                currentSubcategory = 'all';
                renderSubCategoryButtons(currentCategory);
                renderProducts();
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });
        });
    }

    function renderSubCategoryButtons(catId) {
        if (catId === 'all' || !window.DynamicCatalog.subcategories[catId] || window.DynamicCatalog.subcategories[catId].size === 0) {
            subCatBar.style.display = 'none';
            return;
        }

        let html = `<button class="sub-category-btn active" data-sub="all">ყველა</button>`;
        window.DynamicCatalog.subcategories[catId].forEach(subId => {
            const name = window.SubCatNames[subId] || subId;
            html += `<button class="sub-category-btn" data-sub="${subId}">${name}</button>`;
        });

        subCatContainer.innerHTML = html;
        subCatBar.style.display = 'flex';
        subCatContainer.scrollLeft = 0;

        subCatContainer.querySelectorAll('.sub-category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setActiveBtn(subCatContainer, btn);
                currentSubcategory = btn.dataset.sub;
                renderProducts();
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });
        });
    }

    function setActiveBtn(container, targetBtn) {
        container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        targetBtn.classList.add('active');
    }

    function renderProducts() {
        let filtered = window.allProducts || [];

        if (currentCategory !== 'all') filtered = filtered.filter(p => p.categories && p.categories.includes(currentCategory));
        if (currentSubcategory !== 'all') filtered = filtered.filter(p => p.subcategories && p.subcategories.includes(currentSubcategory));

        if (filtered.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:4rem 0; color:#94a3b8; font-weight:700;">ვერაფერი მოიძებნა</div>`;
            return;
        }

        container.innerHTML = filtered.map(p => {
            const imgs = p.images || (p.image ? [p.image] : []);
            let badge = '';
            if (p.oldPrice) {
                const oldV = parseInt(p.oldPrice.replace(/[^0-9]/g, '')), newV = parseInt(p.price.replace(/[^0-9]/g, ''));
                if (oldV > newV) badge = `<div style="position:absolute; top:15px; left:15px; background:#ef4444; color:white; padding:5px 10px; border-radius:10px; font-weight:800; z-index:5;">-${Math.round(((oldV - newV) / oldV) * 100)}%</div>`;
            }
            return `
            <div class="product-card">
                <div class="product-image-wrapper">
                    ${badge}
                    <img src="${imgs[0]}" class="product-image" style="width:100%;height:100%;object-fit:contain;padding:1.5rem;">
                </div>
                <div class="product-info">
                    <div class="product-name-box" onclick="location.href='/product/${p.id}/'"><div class="product-name">${p.name}</div></div>
                    <div class="product-price-container"><div class="product-price">${p.price}</div>${p.oldPrice ? `<span class="old-price">${p.oldPrice}</span>` : ''}</div>
                    <button class="btn-order" onclick='window.openOrderForm(${JSON.stringify(p).replace(/'/g, "&apos;")})'>შეკვეთა</button>
                </div>
            </div>`;
        }).join('');
    }
</script>
