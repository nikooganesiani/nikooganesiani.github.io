---
layout: default
title: "მთავარი"
---

<style>
    /* Стили категорий и фильтров оставляем из старого кода (они отличные) */
    .categories-bar { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; position: relative; z-index: 20; }
    .categories-wrapper { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; margin-right: -1.5rem; }
    .categories-fade-left { position: absolute; left: 0; top: 0; bottom: 0; width: 32px; background: linear-gradient(to left, rgba(248,250,252,0) 0%, rgba(248,250,252,1) 100%); pointer-events: none; z-index: 2; }
    .categories-fade-right { position: absolute; right: 0; top: 0; bottom: 0; width: 48px; background: linear-gradient(to right, rgba(248,250,252,0) 0%, rgba(248,250,252,1) 100%); pointer-events: none; z-index: 2; }

    .categories { display: flex; gap: 0.8rem; flex-wrap: nowrap; padding: 1.5rem 2.5rem 1.5rem 0.5rem; margin: -1rem 0; overflow-x: auto; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }

    .category-btn { background: white; border: 1px solid #e2e8f0; padding: 0.7rem 1.4rem; border-radius: 2rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.3s; color: #64748b; display: flex; align-items: center; gap: 8px; outline: none; white-space: nowrap; flex-shrink: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    .category-btn svg { width: 18px; height: 18px; }
    .category-btn:hover { background: #f8fafc; border-color: #2563eb; color: #2563eb; transform: translateY(-2px); }
    .category-btn.active { background: #0f172a; color: white; border-color: #0f172a; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2); }

    .subcategories-bar { max-width: 1280px; margin: -0.5rem auto 1rem auto; padding: 0 1.5rem; display: none; align-items: center; position: relative; z-index: 15; }
    .subcategories-wrapper { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; margin-right: -1.5rem; }
    .subcategories { display: flex; gap: 0.6rem; flex-wrap: nowrap; padding: 0.5rem 2.5rem 0.5rem 0.5rem; overflow-x: auto; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
    .subcategories::-webkit-scrollbar { display: none; }

    .sub-category-btn { background: transparent; border: 1px solid #cbd5e1; padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; color: #475569; white-space: nowrap; flex-shrink: 0; }
    .sub-category-btn:hover { background: #f1f5f9; border-color: #94a3b8; color: #0f172a; }
    .sub-category-btn.active { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }

    .filters-bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-top: 0.5rem; margin-bottom: 2rem; background: white; padding: 1.2rem; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03); border: 1px solid #f1f5f9; }
    .filter-group { display: flex; align-items: center; gap: 0.6rem; background: #f8fafc; padding: 0.6rem 1.2rem; border-radius: 2rem; border: 1px solid #e2e8f0; transition: all 0.3s; }
    .filter-group:focus-within { border-color: #2563eb; background: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08); }
    .filter-group input { border: none; background: transparent; font-size: 0.9rem; font-weight: 700; outline: none; width: 60px; color: #0f172a; text-align: center; }
    
    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.8rem; margin-bottom: 3rem; }
    .product-card { background: white; border-radius: 2.2rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03); border: 1px solid #f1f5f9; display: flex; flex-direction: column; height: 100%; transition: all 0.4s; }
    .product-card:hover { border-color: #e2e8f0; transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08); }
    .product-image-wrapper { position: relative; width: 100%; height: 260px; overflow: hidden; background: white; }
    .product-slide { flex: 0 0 100%; width: 100%; height: 100%; padding: 1.5rem; display: flex; align-items: center; justify-content: center; }
    .product-image { max-width: 100%; max-height: 100%; object-fit: contain; }
    .product-info { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }
    .product-name-box { background: #f8fafc; border-radius: 1.2rem; padding: 1rem 1.2rem; height: 4.2rem; display: flex; align-items: center; margin-bottom: 1.2rem; border: 1px solid #f1f5f9; cursor: pointer; transition: 0.3s; }
    .product-name-box:hover { background: #f1f5f9; border-color: #cbd5e1; transform: translateY(-2px); }
    .product-name { font-size: 1.05rem; font-weight: 800; color: #0f172a; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price-container { display: flex; flex-direction: row; align-items: baseline; gap: 10px; margin-bottom: 1.2rem; }
    .product-price { font-size: 1.8rem; font-weight: 900; color: #2563eb; }
    .old-price { text-decoration: line-through; color: #94a3b8; font-size: 1rem; font-weight: 700; }
    .btn-order { background: #0f172a; color: white; border: none; padding: 1.1rem; border-radius: 1.2rem; font-weight: 800; font-size: 1.05rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s; }
    .btn-order:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(37,99,235,0.2); }

    @media (max-width: 640px) {
        .filters-bar { flex-direction: row; flex-wrap: nowrap; padding: 0.8rem; justify-content: space-between; border-radius: 1rem; }
        .filter-group { padding: 0.5rem; }
        .filter-group input { width: 40px; font-size: 0.85rem; }
    }
</style>

<div class="categories-bar">
    <div class="categories-wrapper">
        <div class="categories-fade-left"></div>
        <div class="categories" id="categoriesContainer">
            <button class="category-btn active" data-category="all">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                ყველაფერი
            </button>
            <button class="category-btn" data-category="smarthome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3z"></path></svg> ჭკვიანი სახლი</button>
            <button class="category-btn" data-category="kitchen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line></svg> სამზარეულო</button>
            <button class="category-btn" data-category="homecare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><circle cx="12" cy="14" r="4"></circle></svg> სახლის მოვლა</button>
            <button class="category-btn" data-category="selfcare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg> თავის მოვლა</button>        
            <button class="category-btn" data-category="building"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9"></path><path d="M17.64 15 22 10.64"></path></svg> მშენებლობა</button>  
            <button class="category-btn" data-category="computer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg> კომპიუტერები</button>  
        </div>
        <div class="categories-fade-right"></div>
    </div>
</div>

<div class="subcategories-bar" id="subcategoriesBar">
    <div class="subcategories-wrapper">
        <div class="categories-fade-left"></div>
        <div class="subcategories" id="subcategoriesContainer"></div>
        <div class="categories-fade-right"></div>
    </div>
</div>

<main>
    <div class="container" style="max-width:1280px; margin:0 auto; padding:0 1.5rem;">
        <div class="filters-bar">
            <div class="filter-group">
                <label style="color:#94a3b8; font-weight:800; font-size: 0.75rem; text-transform: uppercase;">ფასი</label>
                <input type="number" id="minPrice" placeholder="დან" min="0">
                <span style="color: #cbd5e1;">|</span>
                <input type="number" id="maxPrice" placeholder="მდე" min="0">
            </div>
            <select id="sortSelect" style="padding:0.7rem 1.2rem; border-radius:2rem; border:1px solid #e2e8f0; font-weight:700; color:#0f172a; outline:none; cursor:pointer;">
                <option value="name-asc">დალაგება: ნაგულისხმევი</option>
                <option value="price-desc">ფასი: კლებადობით</option>
                <option value="price-asc">ფასი: ზრდადობით</option>
            </select>
        </div>
        <div class="catalog" id="catalogContainer"></div>
    </div>
</main>

<script>
    let currentCategory = 'all';
    let currentSubcategory = 'all';
    
    const container = document.getElementById('catalogContainer');
    const subcategoriesBar = document.getElementById('subcategoriesBar');
    const subcategoriesContainer = document.getElementById('subcategoriesContainer');
    
    const minPriceInput = document.getElementById('minPrice');
    const maxPriceInput = document.getElementById('maxPrice');
    const sortSelect = document.getElementById('sortSelect');
    const categoryBtns = document.querySelectorAll('.category-btn');

    // Получаем базу категорий из глобальной переменной (из default.html)
    const catalogStructure = window.CATALOG_STRUCTURE || {};

    function renderSubcategories(catId) {
        if (catId === 'all' || !catalogStructure[catId] || catalogStructure[catId].subs.length === 0) {
            subcategoriesBar.style.display = 'none';
            currentSubcategory = 'all';
            return;
        }

        let html = `<button class="sub-category-btn active" data-sub="all">ყველა</button>`;
        catalogStructure[catId].subs.forEach(sub => {
            html += `<button class="sub-category-btn" data-sub="${sub.id}">${sub.name}</button>`;
        });
        
        subcategoriesContainer.innerHTML = html;
        subcategoriesBar.style.display = 'flex';
        subcategoriesContainer.scrollLeft = 0;

        subcategoriesContainer.querySelectorAll('.sub-category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                subcategoriesContainer.querySelectorAll('.sub-category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSubcategory = btn.dataset.sub;
                
                // Обновляем URL (без перезагрузки)
                const url = new URL(window.location);
                url.searchParams.set('category', currentCategory);
                if(currentSubcategory !== 'all') {
                    url.searchParams.set('sub', currentSubcategory);
                } else {
                    url.searchParams.delete('sub');
                }
                window.history.pushState({}, '', url);

                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                renderProducts();
            });
        });
    }

    function renderProducts() {
        const products = window.allProducts || [];
        let filtered = [...products];
        
        const minVal = parseInt(minPriceInput.value);
        const maxVal = parseInt(maxPriceInput.value);

        if (currentCategory !== 'all') {
            filtered = filtered.filter(p => p.categories && p.categories.includes(currentCategory));
        }
        if (currentSubcategory !== 'all') {
            filtered = filtered.filter(p => p.subcategories && p.subcategories.includes(currentSubcategory));
        }
        if (!isNaN(minVal)) filtered = filtered.filter(p => p.priceValue >= minVal);
        if (!isNaN(maxVal)) filtered = filtered.filter(p => p.priceValue <= maxVal);
        
        const sortBy = sortSelect.value;
        if (sortBy === 'name-asc') filtered.sort((a,b) => a.name.localeCompare(b.name));
        if (sortBy === 'price-asc') filtered.sort((a,b) => a.priceValue - b.priceValue);
        if (sortBy === 'price-desc') filtered.sort((a,b) => b.priceValue - a.priceValue);
        
        if (filtered.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:5rem 0;color:#94a3b8;font-size:1.4rem;font-weight:800;">ვერაფერი მოიძებნა</div>`;
            return;
        }
        
        container.innerHTML = filtered.map(product => {
            const img = (product.images && product.images.length > 0) ? product.images[0] : (product.image || '/img/no-image.png');
            let discountBadge = '';
            if (product.oldPrice) {
                const oldVal = parseInt(product.oldPrice.replace(/[^0-9]/g, ''));
                const newVal = parseInt(product.price.replace(/[^0-9]/g, ''));
                if (oldVal > newVal) {
                    const percent = Math.round(((oldVal - newVal) / oldVal) * 100);
                    discountBadge = `<div style="position:absolute; top:16px; left:16px; background:#ef4444; color:white; padding:6px 12px; border-radius:12px; font-size:0.8rem; font-weight:900; z-index:5;">-${percent}%</div>`;
                }
            }
            
            const productDataAttr = JSON.stringify(product).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

            return `
            <div class="product-card">
                <div class="product-image-wrapper">
                    ${discountBadge}
                    <div class="product-slide">
                        <a href="/product/${product.id}/" style="display:contents;">
                            <img class="product-image" src="${img}" alt="${product.name}" onerror="this.src='/img/no-image.png'">
                        </a>
                    </div>
                </div>
                <div class="product-info">
                    <div class="product-name-box" onclick="location.href='/product/${product.id}/'">
                        <div class="product-name">${product.name}</div>
                    </div>
                    <div class="product-price-container">
                        <div class="product-price">${product.price}</div>
                        ${product.oldPrice ? `<span class="old-price">${product.oldPrice}</span>` : ''}
                    </div>
                    <button class="btn-order" onclick='window.openOrderForm(${productDataAttr})'>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg> შეკვეთა
                    </button>
                </div>
            </div>`
        }).join('');
    }

    categoryBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            categoryBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            currentCategory = btn.dataset.category;
            currentSubcategory = 'all';
            
            // Обновляем URL
            const url = new URL(window.location);
            if(currentCategory !== 'all') {
                url.searchParams.set('category', currentCategory);
            } else {
                url.searchParams.delete('category');
            }
            url.searchParams.delete('sub');
            window.history.pushState({}, '', url);

            renderSubcategories(currentCategory);
            renderProducts();
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });
    });

    minPriceInput.addEventListener('input', renderProducts);
    maxPriceInput.addEventListener('input', renderProducts);
    sortSelect.addEventListener('change', renderProducts);

    document.addEventListener('DOMContentLoaded', () => {
        fetch('/catalog.json').then(res => res.json()).then(data => {
            window.allProducts = data.products.map(p => ({ ...p, priceValue: parseInt(p.price.replace(/[^0-9]/g, '')) }));
            
            const urlParams = new URLSearchParams(window.location.search);
            const urlCat = urlParams.get('category');
            const urlSub = urlParams.get('sub');

            if (urlCat) {
                const targetBtn = document.querySelector(`.category-btn[data-category="${urlCat}"]`);
                if (targetBtn) {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    targetBtn.classList.add('active');
                    currentCategory = urlCat;
                    setTimeout(() => targetBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 100);
                }
            }

            renderSubcategories(currentCategory);

            if (urlSub && currentCategory !== 'all') {
                const targetSubBtn = subcategoriesContainer.querySelector(`.sub-category-btn[data-sub="${urlSub}"]`);
                if (targetSubBtn) {
                    subcategoriesContainer.querySelectorAll('.sub-category-btn').forEach(b => b.classList.remove('active'));
                    targetSubBtn.classList.add('active');
                    currentSubcategory = urlSub;
                    setTimeout(() => targetSubBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 200);
                }
            }

            renderProducts();
        });
    });
</script>
