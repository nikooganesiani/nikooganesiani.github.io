- id: ordering
  title: შეკვეთა და გადახდა
  icon: bag
  questions:
    - question: როგორ შევუკვეთო პროდუქტი?
      answer: პროდუქტის გვერდზე მიუთითეთ სახელი და ტელეფონის ნომერი. ოპერატორი დაგირეკავთ, რომ პროდუქტი, საბოლოო ფასი, მისამართი და მიწოდების ვადა შეათანხმოთ.
      url: /info/terms
      link: შეძენის პირობები
    - question: როდის და როგორ ვიხდი?
      answer: შეკვეთის საფასურს მიღებისას იხდით, ლარში. შეგიძლიათ გადაიხადოთ ნაღდი ფულით ან ბარათით. თუ ბარათით გადახდა გსურთ, წინასწარ უთხარით ოპერატორს.
      url: /info/delivery#payment
      link: გადახდის დეტალები
    - question: როგორ შევცვალო ან გავაუქმო შეკვეთა?
      answer: დაგვიკავშირდით რაც შეიძლება მალე და გვაცნობეთ შეკვეთისას მითითებული ტელეფონის ნომერი. თუ ამანათი უკვე გაგზავნილია, შემდეგ ნაბიჯებს ოპერატორი დაგიზუსტებთ.
      url: /info/contacts
      link: კონტაქტები
- id: shipping
  title: მიწოდება და გზავნილის სტატუსი
  icon: truck
  questions:
    - question: რა ღირს მიწოდება და რამდენ ხანს გრძელდება?
      answer: მიწოდება უფასოა მთელ საქართველოში. დადასტურებიდან სავარაუდო ვადაა 1–2 სამუშაო დღე თბილისში და 1–3 სამუშაო დღე რეგიონებში.
      url: /info/delivery#delivery-time
      link: მიწოდების ვადები
    - question: სად შევამოწმო გზავნილის სტატუსი?
      answer: შეკვეთის გაგზავნის შემდეგ SMS-ით მიიღებთ ამანათის კოდს. გამოიყენეთ ეს კოდი ჩვენს საიტზე სტატუსის სანახავად. თუ კოდი არ მიგიღიათ, დაგვიკავშირდით.
      url: /info/delivery#tracking
      link: შეკვეთის სტატუსი
    - question: შემიძლია პროდუქტის ადგილზე გატანა?
      answer: ვმუშაობთ ონლაინ და ფიზიკური მაღაზია არ გვაქვს. შეკვეთებს უფასო საკურიერო მომსახურებით ვაწვდით.
- id: after-purchase
  title: გარანტია და დაბრუნება
  icon: shield
  questions:
    - question: შემიძლია ნივთის დაბრუნება, თუ გადავიფიქრე?
      answer: დისტანციურ შენაძენზე უარის თქმა შეგიძლიათ ნივთის მიღებიდან 14 კალენდარულ დღეში, კანონით გათვალისწინებული გამონაკლისების გარდა. ამ ვადაში გვაცნობეთ თქვენი გადაწყვეტილება.
      url: /info/warranty#returns
      link: დაბრუნების პირობები
    - question: რა გარანტია აქვს პროდუქტს?
      answer: კანონისმიერი გარანტია მოქმედებს საქონლის ჩაბარებიდან 2 წლის განმავლობაში. დამატებითი კომერციული გარანტიის პირობები, არსებობის შემთხვევაში, მითითებულია პროდუქტთან ან საგარანტიო დოკუმენტში და არ ზღუდავს კანონით დადგენილ უფლებებს.
      url: /info/warranty#guarantee
      link: გარანტიის პირობები
    - question: როგორ მოვითხოვო ნივთის დაბრუნება?
      answer: დაბრუნების შესახებ მოგვწერეთ ელფოსტით. შეგიძლიათ გამოიყენოთ განცხადების ნიმუში ან გამოგვიგზავნოთ საკუთარი განცხადება. დაბრუნების მისამართისა და გაგზავნის გზის დასაზუსტებლად დაგვიკავშირდით.
      url: /info/warranty#request
      link: დაბრუნების ინსტრუქცია და განცხადების ნიმუში
