name: Deploy with Secrets

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if secrets exist
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN не найден!"
            exit 1
          fi
          echo "✅ TELEGRAM_BOT_TOKEN найден"
          
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "❌ TELEGRAM_CHAT_ID не найден!"
            exit 1
          fi
          echo "✅ TELEGRAM_CHAT_ID найден"

      - name: Replace secrets in HTML
        run: |
          echo "🔧 Заменяем метки в index.html..."
          
          # Заменяем
          sed -i "s|___BOT_TOKEN___|${{ secrets.TELEGRAM_BOT_TOKEN }}|g" index.html
          sed -i "s|___CHAT_ID___|${{ secrets.TELEGRAM_CHAT_ID }}|g" index.html
          sed -i "s|___SHEETS_URL___|${{ secrets.GOOGLE_SHEETS_URL }}|g" index.html
          
          # Проверяем
          if grep -q "___BOT_TOKEN___" index.html; then
            echo "❌ Ошибка: метка BOT_TOKEN не заменилась!"
            exit 1
          fi
          if grep -q "___CHAT_ID___" index.html; then
            echo "❌ Ошибка: метка CHAT_ID не заменилась!"
            exit 1
          fi
          echo "✅ Все метки успешно заменены!"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
