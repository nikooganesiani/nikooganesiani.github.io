name: Replace secrets

on:
  push:
    branches: [ main ]

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Replace GH_TOKEN in HTML
        run: |
          sed -i "s|___GH_TOKEN___|${{ secrets.GH_TOKEN }}|g" smartscale/index.html
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add smartscale/index.html
          git diff --staged --quiet || git commit -m "Replace GH_TOKEN"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/nikooganesiani/nikooganesiani.github.io.git HEAD:main
