name: Replace secrets and deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Replace GH_TOKEN in HTML
        run: |
          sed -i "s|___GH_TOKEN___|${{ secrets.GH_TOKEN }}|g" smartscale/index.html
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./smartscale
          force_orphan: true
