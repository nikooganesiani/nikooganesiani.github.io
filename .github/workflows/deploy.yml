name: Deploy with Secrets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace secrets in all HTML files
        run: |
          echo "🔧 Заменяем метки во всех HTML файлах..."
          
          # Находим все HTML файлы и заменяем в них метки
          find . -name "*.html" -type f | while read -r file; do
            echo "📄 Обрабатываем: $file"
            
            # Заменяем метки
            sed -i "s|___BOT_TOKEN___|${{ secrets.TELEGRAM_BOT_TOKEN }}|g" "$file"
            sed -i "s|___CHAT_ID___|${{ secrets.TELEGRAM_CHAT_ID }}|g" "$file"
            sed -i "s|___SHEETS_URL___|${{ secrets.GOOGLE_SHEETS_URL }}|g" "$file"
            
            # Проверяем, заменилось ли
            if grep -q "___BOT_TOKEN___" "$file"; then
              echo "❌ В $file метка BOT_TOKEN не заменилась!"
            else
              echo "✅ $file - OK"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy with secrets'
