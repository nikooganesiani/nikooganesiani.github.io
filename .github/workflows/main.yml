name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy-gh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate product pages
        run: node generate_pages.js

      - name: Install & Build Tailwind CSS
        run: |
          npm install --no-audit --no-fund tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ./assets/css/input.css -o ./assets/css/style.css --minify

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Cache Jekyll build
        uses: actions/cache@v6
        with:
          path: |
            .jekyll-cache
            _site
          key: jekyll-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jekyll-${{ runner.os }}-

      - name: Build Jekyll site
        run: bundle exec jekyll build --incremental
        env:
          JEKYLL_ENV: production

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Артефакт загружается только при ручном деплое на Cloudflare
      - name: Upload Build Artifact for Cloudflare
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: _site/
          retention-days: 1

  deploy-cloudflare:
    needs: build-and-deploy-gh
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build
          path: _site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name nikooganesiani-github-io

      - name: Purge cache (via curl)
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
