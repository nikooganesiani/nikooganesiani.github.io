name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Ручной запуск

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Объединяем Сборку и Деплой в GitHub Pages в ОДНУ джобу
  build-and-deploy-gh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 1. Пропускаем Setup Node.js (экономим ~20 сек). 
      # Node.js уже есть в системе Ubuntu на GitHub.
      - name: Generate product pages
        run: node generate_pages.js

      # 2. Настраиваем Ruby только для Jekyll
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # Это важно для скорости последующих запусков

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # 3. Деплой в GitHub Pages происходит прямо здесь (экономим ~30 сек на пересылке файлов)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 4. Сохраняем артефакт для Cloudflare (на случай, если захочешь нажать кнопку)
      - name: Upload Build Artifact for Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site/
          retention-days: 1

          # 5. Автообновление кеша Cloudflare, т.е Cache Purge
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "nikooganesiani-github-io"
          directory: "_site"

      # Добавляем и сюда, чтобы при ручном деплое тоже всё чистилось
- name: Purge cache (via curl)
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'

  # Cloudflare остается отдельной джобой, так как она запускается только вручную
  deploy-cloudflare:
    needs: build-and-deploy-gh
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "nikooganesiani-github-io"
          directory: "_site"
