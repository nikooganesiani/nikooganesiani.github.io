name: Generate Sitemap

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          find . -name "*.html" | while read file; do
            url=$(echo "$file" | sed 's|^\./||')

            # главная страница
            if [ "$url" = "index.html" ]; then
              echo "  <url><loc>https://enkaelectronics.com.ge/</loc></url>" >> sitemap.xml

            # folder/index.html → /folder/
            elif [[ "$url" == */index.html ]]; then
              clean=${url%index.html}
              echo "  <url><loc>https://enkaelectronics.com.ge/$clean</loc></url>" >> sitemap.xml

            # любые другие .html → убираем .html
            elif [[ "$url" == *.html ]]; then
              clean=${url%.html}
              echo "  <url><loc>https://enkaelectronics.com.ge/$clean</loc></url>" >> sitemap.xml

            else
              echo "  <url><loc>https://enkaelectronics.com.ge/$url</loc></url>" >> sitemap.xml
            fi
          done

          echo '</urlset>' >> sitemap.xml

      - name: Commit sitemap
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add sitemap.xml

          git diff --staged --quiet || git commit -m "Update sitemap"

          git push
