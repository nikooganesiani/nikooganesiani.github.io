title: ENKA Electronics
description: ENKA Electronics - ხარისხიანი ტექნიკა საქართველოში უფასო მიტანით და ადგილზე გადახდით.

url: "https://enkaelectronics.com.ge"
baseurl: ""
encoding: utf-8
facebook_pixel_id: "1499689204986172"
# GA4 web stream Measurement ID (G-...). Empty means Google tracking is disabled.
google_analytics_id: "G-KHQG9C6JQF"

# Полная сборка исключает устаревшие страницы и данные каталога
incremental: false

include: [_pages, _headers]

# Исключаем служебные файлы и папки из итогового билда
exclude:
  - "HANDOFF-*.md"
  - workers
  - tokensave
  - tokensave.exe
  - TRANSLATIONS.md
  - admin
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - scripts
  - tests
  - .local
  - AGENTS.md
  - README.md
  - ICONS.md
  - generate_pages.js
  - assets/css/input.css
  - assets/css/home.css
  - .github
  - .gitignore
  - .git
  - .bundle
  - .jekyll-cache

# Коллекция товаров
collections:
  products:
    output: true
    permalink: /product/:title/

# Настройки по умолчанию для коллекции товаров
defaults:
  - scope:
      path: "info"
    values:
      permalink: /info/:basename
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"

# Плагины
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Настройки для sitemap
sitemap:
  filename: sitemap.xml

# Локализация
lang: "ka"
locale: "ka_GE"
