title: ENKA Electronics
description: ENKA Electronics - ხარისხიანი ტექნიკა საქართველოში უფასო მიტანით და ადგილზე გადახდით.

url: "enkaelectronics.com.ge"   # 👈 твой кастомный домен
baseurl: ""
encoding: utf-8
facebook_pixel_id: "1499689204986172"

# Исключаем ненужные файлы
exclude:
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - catalog.json  # Не копируем в _site

# Коллекция товаров
collections:
  products:
    output: true
    permalink: /:collection/:path/

# Настройки по умолчанию для товаров
defaults:
  - scope:
      path: "_products/*.md"
    values:
      layout: "product"
